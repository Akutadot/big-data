ode-table th{font-size:13px;color:var(--muted)}.callout-compact{font-size:14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:13px 15px}.home-focus-card{margin-top:35px}.home-focus-card .lab-box{padding:25px}.quiz-status{font-size:12px;color:var(--muted)}\n@media(max-width:1150px){.mode-grid{grid-template-columns:1fr 1fr}.quick-terms{grid-template-columns:1fr 1fr}}\n@media(max-width:920px){.lessons-grid{grid-template-columns:1fr}.mode-grid{grid-template-columns:1fr}.layer-tabs{grid-template-columns:repeat(3,1fr)}}\n@media(max-width:540px){.quick-terms{grid-template-columns:1fr}.layer-tabs{grid-template-columns:repeat(2,1fr)}.choice-grid{gap:7px}.choice-grid button{font-size:14px;padding:12px 6px}.mode-table{font-size:12px}.mode-table td,.mode-table th{padding:9px 6px}}\n\u003c/style>\u003c/head>\u003cbody>\u003ca class=\"sr-only\" href=\"#main\">跳到正文\u003c/a>\u003cdiv class=\"mobile-overlay\" id=\"mobile-overlay\" hidden>\u003c/div>\u003cdiv class=\"app-shell\">\u003caside class=\"sidebar\" id=\"sidebar\" aria-label=\"章节导航\">\u003cdiv class=\"brand\">\u003cspan class=\"brand-icon\">4V\u003c/span>\u003cdiv class=\"brand-txt\">大数据概述\u003csmall>INTERACTIVE NOTES\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"side-intro\">概念不漏 · 解释简明 · 云服务重点记\u003c/div>\u003cdiv class=\"side-nav\">\u003cp class=\"nav-overline\">开始学习\u003c/p>\u003cbutton class=\"nav-link active\" data-go=\"home\">\u003cspan class=\"nav-num\">⌂\u003c/span>学习首页\u003c/button>\u003cp class=\"nav-overline\">章节目录\u003c/p>\u003cdiv id=\"side-chapters\">\u003c/div>\u003cp class=\"nav-overline\">自测与考前回顾\u003c/p>\u003cbutton class=\"nav-link\" data-go=\"exam\">\u003cspan class=\"nav-num\">✓\u003c/span>综合测验\u003c/button>\u003cbutton class=\"nav-link\" data-go=\"cheats\">\u003cspan class=\"nav-num\">≡\u003c/span>一页速记表\u003c/button>\u003c/div>\u003cdiv class=\"side-footer\">\u003cdiv class=\"progress-info\">\u003cspan>知识卡片掌握进度\u003c/span>\u003cb id=\"progress-label\">0 / 0\u003c/b>\u003c/div>\u003cdiv class=\"track\">\u003cdiv id=\"progress-bar\">\u003c/div>\u003c/div>\u003csmall>浏览器本地保存 · 可离线学习\u003c/small>\u003c/div>\u003c/aside>\n\u003cdiv class=\"page-frame\">\u003cheader class=\"topbar\">\u003cbutton class=\"icon-button sidebar-toggle\" id=\"menu-btn\" type=\"button\" aria-label=\"打开或收起目录\" aria-expanded=\"true\">☰ \u003cspan id=\"menu-text\">收起目录\u003c/span>\u003c/button>\u003cdiv class=\"crumb\" id=\"crumb\">大数据概述 \u003cb>/\u003c/b> 学习首页\u003c/div>\u003cdiv class=\"top-actions\">\u003cbutton class=\"quiet\" id=\"focus-btn\">专注未掌握\u003c/button>\u003cbutton class=\"icon-button\" id=\"theme-btn\" aria-label=\"切换深浅色\">◐\u003c/button>\u003cbutton class=\"top-chip\" data-go=\"exam\">考前自测 ↗\u003c/button>\u003c/div>\u003c/header>\u003cmain id=\"main\">\n\u003csection class=\"screen active\" id=\"screen-home\">\u003cdiv class=\"hero\">\u003cspan class=\"eyebrow\">LEARN SMARTER · NOT LONGER\u003c/span>\u003ch1>大数据概述，\u003cbr>\u003cem>一章就讲明白。\u003c/em>\u003c/h1>\u003cp>72 页课件浓缩成\u003cstrong>概念地图 + 精简卡片 + 少量自测\u003c/strong>。这章不深挖底层算法，重点弄懂 \u003cstrong>IaaS / PaaS / SaaS\u003c/strong>，看到具体产品就知道属于哪类云服务。\u003c/p>\u003cdiv class=\"hero-actions\">\u003cbutton class=\"btn-primary\" data-go=\"chapter-4\">先攻克云服务模式 →\u003c/button>\u003cbutton class=\"btn-outline\" data-go=\"chapter-0\">从第一个概念开始\u003c/button>\u003c/div>\u003cdiv class=\"hero-stats\">\u003cdiv class=\"stat\">\u003cb>6\u003c/b>\u003csmall>独立章节\u003c/small>\u003c/div>\u003cdiv class=\"stat\">\u003cb id=\"card-num\">—\u003c/b>\u003csmall>精简知识卡\u003c/small>\u003c/div>\u003cdiv class=\"stat\">\u003cb id=\"question-num\">—\u003c/b>\u003csmall>即时考点题\u003c/small>\u003c/div>\u003cdiv class=\"stat\">\u003cb>1\u003c/b>\u003csmall>平台分类挑战\u003c/small>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"eyebrow\">THE BIG PICTURE\u003c/div>\u003ch2 class=\"section-title\">这章只需要理顺两条主线\u003c/h2>\u003cdiv class=\"two-lanes\">\u003carticle class=\"lane lane-blue\">\u003cspan class=\"lane-tag\">主线 A · 数据从哪来到哪去\u003c/span>\u003ch3>采集 → 存储 → 处理 → 分析 → 可视化\u003c/h3>\u003cp>像一家餐厅：进货、放冷库、加工、研究菜谱、把菜端给顾客。大数据平台负责把这条链跑起来。\u003c/p>\u003cdiv class=\"path\">4V · 数据类型 · 技术五层 · 应用\u003c/div>\u003c/article>\u003carticle class=\"lane lane-purple\">\u003cspan class=\"lane-tag\">主线 B · 云平台提供什么\u003c/span>\u003ch3>IaaS → PaaS → SaaS\u003c/h3>\u003cp>分别相当于租厨房设备、租现成厨房、直接订餐。区别是：你究竟自己负责到哪一步。\u003c/p>\u003cdiv class=\"path\">IaaS 资源 / PaaS 平台 / SaaS 软件\u003c/div>\u003c/article>\u003c/div>\n\u003cdiv class=\"home-focus-card\">\u003cdiv class=\"eyebrow\">TRY IT · CLICK TO LEARN\u003c/div>\u003ch2 class=\"section-title\">先用三个场景记住 IaaS / PaaS / SaaS\u003c/h2>\u003cdiv class=\"mode-grid\">\u003carticle class=\"mode-card\">\u003cstrong>IaaS\u003c/strong>\u003cb>租设备｜毛坯厨房\u003c/b>\u003cp>租云服务器与存储，操作系统和应用通常要自己管理。\u003c/p>\u003cspan class=\"mini-tag\">代表：Amazon EC2\u003c/span>\u003c/article>\u003carticle class=\"mode-card\">\u003cstrong>PaaS\u003c/strong>\u003cb>租环境｜现成厨房\u003c/b>\u003cp>运行环境已经准备好，你负责写代码、部署程序。\u003c/p>\u003cspan class=\"mini-tag\">代表：Google App Engine\u003c/span>\u003c/article>\u003carticle class=\"mode-card\">\u003cstrong>SaaS\u003c/strong>\u003cb>用软件｜点餐即食\u003c/b>\u003cp>厂商把软件做好，打开网页或 App 就能用。\u003c/p>\u003cspan class=\"mini-tag\">代表：Microsoft 365\u003c/span>\u003c/article>\u003c/div>\u003cbutton class=\"btn-primary\" data-go=\"chapter-4\">查看三种模式详细对照与产品练习 →\u003c/button>\u003c/div>\n\u003cdiv class=\"home-section\">\u003cdiv class=\"eyebrow\">CHOOSE YOUR PATH\u003c/div>\u003ch2 class=\"section-title\">选择一个知识板块\u003c/h2>\u003cdiv id=\"home-chapters\" class=\"home-card-grid\">\u003c/div>\u003c/div>\u003cdiv class=\"note\">\u003cstrong>使用提示：\u003c/strong>每章是独立页面，左侧可随时跳转；知识卡片可标记掌握；答题后立即显示解析。纯 HTML / CSS / JavaScript，离线可用，也可以直接放进 GitHub Pages。\u003c/div>\u003c/section>\n\u003cdiv id=\"chapters-mount\">\u003c/div>\n\u003csection class=\"screen\" id=\"screen-exam\">\u003cdiv class=\"chapter-head\">\u003cdiv class=\"eyebrow\">EXAM MODE\u003c/div>\u003cdiv class=\"chapter-line\">\u003cspan class=\"chapter-no\">✓\u003c/span>\u003ch2>综合测验\u003c/h2>\u003c/div>\u003cp class=\"chapter-description\">以概念辨认为主；云服务模式占有较大比重。提交后马上得到解释。\u003c/p>\u003c/div>\u003cdiv class=\"lab-box\">\u003cdiv class=\"btn-row\">\u003cbutton class=\"chip-btn selected\" id=\"exam-short\">精选 12 题\u003c/button>\u003cbutton class=\"chip-btn\" id=\"exam-all\">全部题目\u003c/button>\u003cbutton class=\"chip-btn\" id=\"exam-reset\">重新测验 ↻\u003c/button>\u003c/div>\u003cp class=\"footnote\" id=\"exam-description\">\u003c/p>\u003c/div>\u003cdiv class=\"exam-box\">\u003cdiv id=\"exam-list\">\u003c/div>\u003cdiv id=\"exam-score\" class=\"exam-score\">\u003c/div>\u003c/div>\u003cdiv class=\"chapter-footer\">\u003cbutton class=\"btn-outline\" data-go=\"chapter-5\">← 最后一章\u003c/button>\u003cbutton class=\"btn-primary\" data-go=\"cheats\">速记表 →\u003c/button>\u003c/div>\u003c/section>\n\u003csection class=\"screen\" id=\"screen-cheats\">\u003cdiv class=\"chapter-head\">\u003cdiv class=\"eyebrow\">LAST MINUTE REVIEW\u003c/div>\u003cdiv class=\"chapter-line\">\u003cspan class=\"chapter-no\">≡\u003c/span>\u003ch2>概念清单 · 考前速记\u003c/h2>\u003c/div>\u003cp class=\"chapter-description\">只留关键的定义、归类和易错点。每组后面的页码可回去核对课件。\u003c/p>\u003c/div>\u003cdiv class=\"lab-box\">\u003cdiv class=\"scroll-table\">\u003ctable class=\"mode-table\">\u003cthead>\u003ctr>\u003cth>必背关键词\u003c/th>\u003cth>一句话\u003c/th>\u003cth>PDF\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"cheat-body\">\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\u003cdiv class=\"note warning\">\u003cstrong>课件与补充例子的区分：\u003c/strong>课件 P56 用“微软 Azure 平台”作 PaaS 例子；这里按具体产品进一步区分，Azure 虚拟机为 IaaS、Azure App Service 为 PaaS、Microsoft 365 为 SaaS。平台公司本身不是单一模式。课件中个别历史产品配额与商业统计值不作为今天的实时规格。\u003c/div>\u003cp class=\"source-line\">补充阅读（非课件内容）：\u003ca href=\"https://learn.microsoft.com/zh-cn/azure/security/fundamentals/shared-responsibility\" target=\"_blank\" rel=\"noopener noreferrer\">Microsoft 官方：三类云服务责任划分\u003c/a> · \u003ca href=\"https://azure.microsoft.com/zh-cn/resources/cloud-computing-dictionary/what-are-iaas-paas-and-saas\" target=\"_blank\" rel=\"noopener noreferrer\">三类模式对照\u003c/a>。本页面本身无需联网。\u003c/p>\u003cdiv class=\"chapter-footer\">\u003cbutton class=\"btn-outline\" data-go=\"home\">← 首页\u003c/button>\u003cbutton class=\"btn-primary\" data-go=\"exam\">去做综合测验 →\u003c/button>\u003c/div>\u003c/section>\n\u003c/main>\u003c/div>\u003c/div>\n\u003cscript>\n'use strict';\nconst DATA={\"chapters\":[{\"title\":\"先懂大数据与 4V\",\"pages\":\"P4–11\",\"tag\":\"核心定义\",\"desc\":\"这一部分是名词解释的基础。先分清数据与信息，再用 4V 记住大数据的本质。\",\"goal\":\"分清数据 / 信息、4V、三种数据类型和常见单位。\",\"cards\":[[\"数据 Data 与信息 Information\",\"P4–5\",\"数据是原材料，信息是加工后的结论。\",\"数据：数字、文字、日志、交易记录等对事实的原始记录。信息：数据经过清洗、汇总、分析后形成有意义、可用于决策的结果。\",\"1000 条订单是数据；“周末销售较高”是信息。\"],[\"大数据的概念\",\"P6–7\",\"不仅是“特别大的数据”，还要求新技术处理。\",\"规模、类型或变化速度超过传统工具在合理时间内处理能力的数据集合与处理场景。技术目标是存、算、分析，最终发现价值。\",\"课件脉络：20 世纪 90 年代 Bill Inmon 提及 → 2008 年《Nature》专刊 → 2011 年麦肯锡报告。\"],[\"4V：Volume / Variety / Velocity / Value\",\"P7–11\",\"大量、多样、高速、价值（价值密度低）。\",\"Volume：规模大；Variety：格式与来源多；Velocity：产生、传输、处理快；Value：单条信息可能低价值，大规模分析可提炼巨大价值。\",\"口诀：数据“多、杂、快”，从中“淘价值”。考试的 Value 常和「价值密度低」一起出现。\"],[\"三种数据类型\",\"P8\",\"看结构有多规整。\",\"结构化：固定字段/表格（SQL 数据表、Excel）；半结构化：有标签或层次但不严格二维表（JSON、XML、部分日志）；非结构化：自由文本、图像、音视频。\",\"JSON 虽不是传统二维表，但有键值结构，所以常归半结构化。\"],[\"数据量单位\",\"P7\",\"B、KB、MB、GB、TB、PB、EB、ZB、YB。\",\"课件采用二进制换算口径：1 Byte=8 bit；相邻级别按 1024 倍换算，例如 1 TB = 1024 GB，1 PB = 1024 TB。\",\"严格单位体系中 KiB / MiB / GiB 表示 1024 进制；课内题目按课件标法作答。\"]],\"quiz\":[[\"“每天成交 5000 单，周末客单价更高”中的后半句话更接近？\",[\"原始数据\",\"信息\",\"网络设备\",\"非结构化数据\"],1,\"它是从交易记录提炼出的有意义的结论。\"],[\"JSON 通常属于哪类数据？\",[\"结构化\",\"半结构化\",\"非结构化\",\"只能是视频\"],1,\"JSON 有键值和层次结构，但没有严格的二维表结构。\"],[\"大数据 4V 中强调低价值密度但总价值可观的是？\",[\"Volume\",\"Variety\",\"Velocity\",\"Value\"],3,\"Value：沙里淘金。\"]]},{\"title\":\"背景、影响与应用\",\"pages\":\"P13–33\",\"tag\":\"概论罗列\",\"desc\":\"主要掌握关键词和典型例子，不需要背长篇案例数据。\",\"goal\":\"能够列举出现背景、三种思维、四大应用和四类挑战。\",\"cards\":[[\"大数据时代为什么到来\",\"P13–16\",\"数据量增长 + 技术突破 + 商业价值。\",\"三大驱动力：① 数字化、自媒体、物联网推动数据爆发；② 分布式存储/计算、云计算、NoSQL、AI 让处理变得可行；③ 精准营销、运营优化、智能决策带来收益。\",\"记：有数据、有能力、有需求。\"],[\"科学研究的四种范式\",\"P18–19\",\"实验 → 理论 → 计算 → 数据驱动。\",\"经验范式（观察与实验）、理论范式（数学模型与演绎）、计算范式（数值仿真）、数据驱动范式（从海量数据发现规律）。\",\"第四范式关键词是数据驱动；不是“完全不再需要理论与实验”。\"],[\"思维的三大变革\",\"P20–23\",\"全量而非抽样；效率而非精确；相关而非因果。\",\"课件强调：尽可能利用全体数据、在一定误差下换取处理效率、借相关关系做预测。\",\"理解边界：全量也可能有偏差；相关 ≠ 因果，预测不能自动推出原因。\"],[\"大数据对商业模式的影响\",\"P24\",\"推荐、营销、平台、变现。\",\"个性化推荐：千人千面；精准营销：用户画像；平台经济：多边供需匹配；数据变现：数据产品与服务。\",\"辨识场景：猜你喜欢 → 推荐；给特定人群投广告 → 精准营销。\"],[\"对社会与个人的影响\",\"P25–26\",\"城市更聪明，生活更个性化。\",\"社会：智慧交通、公共安全、疫情防控、资源调度。个人：智能出行、个性化娱乐、智慧健康管理、便捷生活服务。\",\"问“智慧城市”可举红绿灯配时、交通拥堵预测。\"],[\"四类风险与挑战\",\"P27\",\"隐私、偏见、鸿沟、信息茧房。\",\"隐私泄露：数据滥用；算法偏见：不公平决策；数字鸿沟：使用数据能力差异；信息茧房：推荐越看越窄。\",\"保护思路：隐私合规、数据治理、算法透明、提高数字普惠。\"],[\"四大行业应用\",\"P28–33\",\"商业、金融、医疗、城市。\",\"商业智能 BI / 精准营销：推荐、销售分析；金融科技：信用评估、反欺诈；智慧医疗：影像辅助诊断和健康管理；智慧城市：交通、安防、能源优化。\",\"BI = Business Intelligence，业务数据分析辅助决策。\"]],\"quiz\":[[\"“相关而非因果”强调什么？\",[\"相关一定证明因果\",\"发现相关可用于预测，但不能自动说明原因\",\"不需要任何数据\",\"相关和因果没有区别\"],1,\"课件是思维转变，科学上依然不能把相关当因果。\"],[\"用户仅看到自己喜欢的观点，属于？\",[\"数字鸿沟\",\"信息茧房\",\"分布式计算\",\"批处理\"],1,\"个性化推荐反复强化既有偏好。\"]]},{\"title\":\"大数据技术全流程\",\"pages\":\"P35–41\",\"tag\":\"概念地图\",\"desc\":\"用“一家餐厅”记整个技术栈：采购食材、入库、加工、分析配方、端菜上桌。\",\"goal\":\"背下五层体系，并知道 Flume、Kafka、HDFS、Spark、Flink 分别做什么。\",\"cards\":[[\"技术体系的五个环节\",\"P35\",\"采集 → 存储 → 处理 → 分析挖掘 → 可视化。\",\"采集：数据从哪里来；存储：放哪里；处理：怎么清洗计算；分析：发现什么规律；可视化：如何呈现给人。\",\"类比餐厅：进货 → 冷库 → 厨房加工 → 研究菜谱 → 上菜。\"],[\"数据采集与 ETL\",\"P36\",\"先把不同来源的数据接进来。\",\"爬虫：抓取网站；ETL = Extract（抽取）→ Transform（转换）→ Load（加载），用于把源数据整理送入目标系统。Scrapy、Beautiful Soup 是课件举的爬取工具。\",\"ETL 三个字母顺序非常适合出选择题。\"],[\"Flume vs Kafka\",\"P36\",\"Flume 搬日志，Kafka 当消息总线。\",\"Flume：日志采集、聚合、传输工具。Kafka：高吞吐分布式消息队列/事件流平台，连接生产者和消费者，支撑实时数据管道。\",\"二者都可出现在采集层，但不能简单理解成“Kafka 就是存文件的 HDFS”。\"],[\"数据采集的五大挑战\",\"P37\",\"五个障碍：杂、变、脏、急、合规。\",\"数据源多样；采集环境/API 动态变化；缺失重复等质量问题；实时性/高并发；合规和隐私保护。\",\"概念题可直接列这五点。\"],[\"存储：HDFS 与 NoSQL\",\"P38\",\"大文件归 HDFS；灵活数据模型用 NoSQL。\",\"HDFS：NameNode 管目录与元数据，DataNode 存数据块，多副本冗余。NoSQL：Redis（键值）、MongoDB（文档）、HBase（列族）、Neo4j（图）。\",\"NoSQL 不等于没有查询语言；核心是区别于传统固定关系表的多样模型。\"],[\"批处理 vs 流处理\",\"P39\",\"批处理像每天打烊算总账；流处理像订单一来就更新。\",\"批处理：MapReduce、Spark，按批处理历史数据，吞吐高，时效性相对低；流处理：Flink、Spark Streaming，持续处理事件，适合实时告警、推荐、风控。\",\"关键词：离线报表→批；交易实时反欺诈→流。\"],[\"分析挖掘：Hive、Spark SQL、Spark ML\",\"P40\",\"SQL 查数 + 模型找规律。\",\"Hive：Hadoop 生态数据仓库/SQL 分析；Spark SQL：Spark 的结构化数据查询组件；Spark ML：Spark 机器学习库，用于特征处理与模型训练。\",\"它们处于分析与挖掘层，不应与存原始文件的 HDFS 混为一谈。\"],[\"可视化工具\",\"P41\",\"数据讲故事的最后一步。\",\"Tableau：拖拽式 BI/仪表盘；ECharts：用于网页图表的 JavaScript 可视化库。把分析结果转成可读的图表。\",\"可视化 ≠ 计算引擎。\"]],\"quiz\":[[\"ETL 的正确顺序是？\",[\"加载→抽取→转换\",\"抽取→转换→加载\",\"转换→加载→抽取\",\"抽取→加载→转换\"],1,\"Extract → Transform → Load。\"],[\"金融实时反欺诈一般更关注？\",[\"批处理 MapReduce\",\"流处理 Flink\",\"只做文件压缩\",\"静态图片渲染\"],1,\"实时风控要求事件到来后尽快处理。\"],[\"哪组 NoSQL 类型配对正确？\",[\"Redis—图数据库\",\"Neo4j—图数据库\",\"HBase—文档数据库\",\"MongoDB—键值数据库\"],1,\"Redis 键值、MongoDB 文档、HBase 列族、Neo4j 图。\"]]},{\"title\":\"大数据平台与趋势\",\"pages\":\"P42–47\",\"tag\":\"概论罗列\",\"desc\":\"记住三类平台和两大技术趋势即可。\",\"goal\":\"分清开源生态、商业发行版、云托管；理解数据湖、湖仓一体。\",\"cards\":[[\"Hadoop、Spark、Flink 分工\",\"P43–44\",\"Hadoop 是生态基础；Spark 擅长通用计算；Flink 擅长流处理。\",\"Hadoop：以 HDFS 存储、MapReduce 批计算为代表；Spark：分布式计算与 SQL/机器学习/流场景；Flink：面向有状态流计算。\",\"“Hadoop、Spark 是相互完全排斥的系统”是错的，可组合使用。\"],[\"大数据平台的三种提供方式\",\"P44\",\"开源自建 / 商业发行版 / 云托管。\",\"开源 Apache 生态：灵活免费但自己运维。商业发行版：如 Cloudera CDP、星环 TDH，提供集成与支持。云托管：如阿里云 EMR、华为云 MRS，集群运维由云厂商承担更多。\",\"云托管大数据平台常属于 PaaS 或托管平台服务范畴；不要把整家云公司归为 PaaS。\"],[\"数据仓库、数据湖、湖仓一体\",\"P46\",\"规整分析 vs 原始数据湖 vs 二者结合。\",\"数据仓库：面向分析治理的结构化数据体系；数据湖：可集中存储原始格式的多类型数据；湖仓一体：结合灵活存储与仓库治理，课件举 Delta Lake、Iceberg。\",\"数据湖不等于随便堆数据；缺乏管理会变成“数据沼泽”。\"],[\"发展趋势\",\"P47\",\"实时化 + 智能化。\",\"流处理应用扩大，批流结合；大数据与 AI 更深度融合，在统一平台上完成数据处理、训练与推理。\",\"课件是趋势概论，不必背具体性能倍数。\"]],\"quiz\":[[\"“数据沼泽”最接近哪个问题？\",[\"数据湖管理混乱、难找难用\",\"数据没有备份\",\"数据量太小\",\"网络没有路由器\"],0,\"没有良好元数据和治理时，数据湖容易变成难以利用的数据堆。\"],[\"阿里云 EMR 在课件里属于？\",[\"云托管大数据平台\",\"普通办公 SaaS\",\"手机操作系统\",\"区块链共识协议\"],0,\"课件 P44 将其归入云托管平台。\"]]},{\"title\":\"重点：云计算与 IaaS / PaaS / SaaS\",\"pages\":\"P49–65\",\"tag\":\"本章重点\",\"desc\":\"理解“租硬件 / 租开发环境 / 直接用软件”的三个层次，能给真实产品分类。\",\"goal\":\"会说清三种服务模式、你负责什么、厂商负责什么；正确分类 EC2、App Engine、Microsoft 365 等。\",\"cards\":[[\"云计算是什么\",\"P50\",\"像水电一样按需使用计算资源。\",\"通过网络把共享的计算、存储、网络和软件按需提供给用户，支持资源池化、弹性扩缩、按用量或订阅计费。\",\"云计算不是“所有数据一定在某一台云端电脑”，其基础是资源池与网络服务。\"],[\"云计算关键技术与特点\",\"P51–52\",\"虚拟化、分布式存储、弹性、容器编排。\",\"关键技术：虚拟化（物理资源抽象）、分布式存储、弹性伸缩、Docker/Kubernetes 容器与编排。课件五特点：虚拟化、弹性资源池、按需服务、网络接入、可靠与安全。\",\"虚拟化是 IaaS 核心基础之一，但 Docker ≠ 虚拟机。\"],[\"IaaS：Infrastructure as a Service\",\"P53–55\",\"租“毛坯机房”：厂商给硬件资源，你自己搭系统。\",\"提供虚拟机、计算能力、云存储、网络。服务商管理机房与物理基础设施；用户通常管理操作系统、运行环境、应用及数据。\",\"课件：Amazon EC2、S3。补充：Azure Virtual Machines；Google Compute Engine。\"],[\"PaaS：Platform as a Service\",\"P53、56\",\"租“装修好的厨房”：写代码、部署应用。\",\"云平台提供开发、测试、部署和运行应用的托管环境，包括运行时、中间件等；开发者重点维护自己的代码及数据，不必管理底层主机操作系统。\",\"课件：Google App Engine、微软 Azure 平台（历史笼统表述）。补充精准产品：Azure App Service、AWS Elastic Beanstalk。\"],[\"SaaS：Software as a Service\",\"P53、57\",\"直接“点外卖”：打开成品软件就用。\",\"厂商通过互联网提供完整应用，通常负责部署、更新与维护；用户主要进行使用、内容管理、权限设置与账号安全。\",\"课件：企业邮箱、百度云盘。补充：Microsoft 365、Google Workspace、Salesforce CRM。\"],[\"三种模式的本质比较\",\"P53–57\",\"从 IaaS → PaaS → SaaS，你越省心，底层控制越少。\",\"IaaS 买资源，你装系统；PaaS 买平台，你写应用；SaaS 买功能，你直接使用。区别不是“哪个都需要互联网”，而是供应商交付到哪一层。\",\"考试陷阱：用户能登录浏览器 ≠ 一定是 SaaS；云厂商的控制台也可能用于配置 IaaS。\"],[\"平台名称不是服务类型\",\"P54–57 · 例子补充\",\"AWS / Azure / 阿里云是一整个超市，不是一款具体商品。\",\"同一云平台可以同时提供 IaaS、PaaS、SaaS。应根据具体服务分类：Azure Virtual Machines 是 IaaS；Azure App Service 是 PaaS；Microsoft 365 是 SaaS。\",\"课件把“微软 Azure 平台”当 PaaS 示例来讲是历史教学简化；现代选择题优先认具体服务。\"],[\"AWS：EC2、S3、SQS\",\"P54–55\",\"亚马逊是一家云厂商，不是三个单词都表示一回事。\",\"EC2 = 弹性计算云（租虚拟服务器）；S3 = 简单存储服务（租对象存储）；SQS = 简单队列服务（托管消息队列）。\",\"本课件把 EC2、S3 放在 IaaS；SQS 是托管消息服务，通常不作为典型 IaaS 计算实例。\"],[\"云计算的集群系统\",\"P58–60\",\"把很多廉价计算机组织成一个整体。\",\"集群：多台有独立操作系统与存储的计算机通过网络协作。典型特点：横向扩容、软件冗余、高可用、数据分块、计算向数据靠拢。\",\"集群是技术架构，不等于三种云服务模式中的某一种。\"],[\"数据中心与 PUE\",\"P61–64\",\"PUE 衡量机房有多少额外耗电。\",\"数据中心包括服务器、网络、存储以及制冷配电等设施。PUE = 数据中心总能耗 ÷ IT 设备能耗；通常 ≥ 1，越接近 1，表示非 IT 能源开销越小。\",\"例：总能耗 150、IT 设备 100，则 PUE = 1.5。\"],[\"大数据与云计算是什么关系\",\"P65\",\"大数据需要算力；云计算提供可租的资源底座。\",\"云计算为海量数据提供弹性存储与计算，大数据分析也可反过来帮助云资源运营与调度决策。\",\"大数据 ≠ 云计算；一个是数据与处理问题，一个是计算资源的交付方式。\"]],\"quiz\":[[\"租一台云虚拟机，自己装 Linux 和数据库，属于？\",[\"SaaS\",\"PaaS\",\"IaaS\",\"物联网\"],2,\"IaaS 提供基础计算资源，客户控制操作系统和软件。\"],[\"只写业务代码，云平台提供部署和运行环境，属于？\",[\"IaaS\",\"PaaS\",\"SaaS\",\"HDFS\"],1,\"平台负责运行时与基础设施，开发者专注应用。\"],[\"打开 Microsoft 365 在线写文档，属于？\",[\"IaaS\",\"PaaS\",\"SaaS\",\"集群\"],2,\"直接使用厂商维护好的应用就是 SaaS。\"],[\"以下最准确的是？\",[\"AWS 整个平台只有 IaaS\",\"Azure 整个平台只有 PaaS\",\"云厂商可能同时提供多种服务模式\",\"浏览器里打开的都是 SaaS\"],2,\"云服务分类应精确到具体产品。\"],[\"PUE 为 1.2 和 1.8 的数据中心，其他条件相同哪个能效更好？\",[\"1.8\",\"1.2\",\"无法依据 PUE 分辨\",\"相同\"],1,\"PUE 越接近 1，非 IT 设备能耗占比越低。\"]]},{\"title\":\"AI、物联网、区块链与融合\",\"pages\":\"P66–72\",\"tag\":\"术语清单\",\"desc\":\"考前知道它们“是什么 + 核心技术 + 典型应用”即可。\",\"goal\":\"准确解释 AI、IoT、RFID、边缘计算、区块链、哈希与共识机制。\",\"cards\":[[\"人工智能 AI / 机器学习 / 深度学习\",\"P66–67\",\"AI 是大方向，ML 是一种方法，DL 是 ML 的重要分支。\",\"AI：让机器表现出感知、学习、推理、决策等智能能力；机器学习 ML：从数据中学习模式；深度学习 DL：基于多层神经网络学习表征。\",\"典型应用：智能助手、自动驾驶、医疗影像、风控、推荐。\"],[\"自然语言处理 NLP / 计算机视觉 CV\",\"P66–67\",\"NLP 管语言，CV 管图像与视频。\",\"自然语言处理：理解、翻译、生成人类语言；计算机视觉：理解图像、视频中的目标与场景。\",\"智能翻译→NLP；检测图片中的车辆→CV。\"],[\"物联网 IoT 与三层结构\",\"P68\",\"感知 → 网络 → 应用。\",\"物联网：物品借助传感器及网络进行信息采集、交换与智能管理。感知层收数据；网络层传数据；应用层处理数据提供服务。课件架构图另设“处理层/支撑平台”。\",\"类比人体：感知层是五官，网络层是神经，应用层是服务与行动。\"],[\"物联网关键技术\",\"P69\",\"传感器、RFID、低功耗通信、边缘计算。\",\"传感器：测温度、位置等；RFID：射频识别；NB-IoT、LoRa：低功耗广域网；边缘计算：靠近设备就地处理，降低延迟。\",\"应用：智能家居、工业物联网、智慧交通、智慧农业。\"],[\"区块链 Blockchain 的定义与特征\",\"P70\",\"大家共同保存、校验一个串成链的账本。\",\"用哈希和共识等技术连接记录区块，形成分布式账本。典型特征：去中心化（依具体链架构）、分布式存储、较难篡改、可追溯。\",\"不是“绝对不可能修改”；权限链、公链的去中心化程度不同。\"],[\"区块链核心技术与应用\",\"P71\",\"链式结构 + 哈希 + 共识 + 智能合约。\",\"哈希：数据指纹；共识机制：多个节点协同确认账本状态（如 PoW、PoS）；智能合约：满足条件自动执行的链上程序。\",\"应用：数字资产、供应链溯源、版权存证、政务数据共享。\"],[\"四项技术如何与大数据协同\",\"P72\",\"云供算力、IoT 供数据、AI 提价值、区块链增信任。\",\"云计算提供弹性算力与存储；物联网形成实时数据源；AI 从数据中训练和推理；区块链帮助实现可信记录与可追溯共享。\",\"这四句话就是整章结尾的高频概念总结。\"]],\"quiz\":[[\"物联网中负责采集温度和位置数据的是？\",[\"应用层\",\"感知层\",\"网络层\",\"SaaS 层\"],1,\"感知层有传感器、RFID、摄像头。\"],[\"RFID 指的是？\",[\"射频识别\",\"文档数据库\",\"机器学习\",\"图形编程\"],0,\"Radio Frequency Identification，非接触识别。\"],[\"“对数据计算数字指纹”对应区块链中的？\",[\"SQL\",\"哈希算法\",\"流处理\",\"网页浏览器\"],1,\"哈希用于提供数据摘要和完整性验证的依据。\"]]}],\"platforms\":[[\"Amazon EC2\",\"IaaS\",\"租云虚拟服务器\",\"P54–55 课件\"],[\"Amazon S3\",\"IaaS\",\"租对象存储（课件按基础设施资源归类）\",\"P54–55 课件\"],[\"Google App Engine\",\"PaaS\",\"上传应用代码，平台提供运行环境\",\"P56 课件\"],[\"企业邮箱（托管）\",\"SaaS\",\"直接使用现成的邮件软件\",\"P57 课件\"],[\"百度云盘（网盘应用）\",\"SaaS\",\"普通用户直接使用文件管理应用\",\"P57 课件\"],[\"Azure Virtual Machines\",\"IaaS\",\"云虚拟机，自行配置 OS 与应用\",\"官方补充例子\"],[\"Azure App Service\",\"PaaS\",\"托管网站和应用运行环境\",\"官方补充例子\"],[\"Microsoft 365\",\"SaaS\",\"在线办公与协作应用\",\"官方补充例子\"],[\"Google Workspace\",\"SaaS\",\"在线办公套件\",\"常见补充例子\"],[\"Salesforce CRM\",\"SaaS\",\"现成的云端客户关系管理软件\",\"常见补充例子\"],[\"AWS Elastic Beanstalk\",\"PaaS\",\"托管 Web 应用的部署和运行\",\"常见补充例子\"]]};\nconst CHAPTERS=DATA.chapters;\nconst PLATFORMS=DATA.platforms;\nconst $=id=>document.getElementById(id);\nconst store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};\nlet learned=new Set(store.get('bigdata_overview_learned_v1',[])),current='home',focus=false,chosenMode='IaaS',roundIndex=0,roundCorrect=0,roundAnswered=false,quizMode='short';\nconst LABEL=['A','B','C','D'];\nfunction safe(s){return String(s).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));}\nfunction questionHTML(q,i,prefix){return `\u003cdiv class=\"quiz-q\" data-question=\"${prefix}-${i}\">\u003ch4>${i+1}. ${safe(q[0])}\u003c/h4>\u003cdiv class=\"quiz-options\">${q[1].map((x,j)=>`\u003cbutton class=\"quiz-opt\" data-choice=\"${j}\" data-correct=\"${q[2]}\" data-answer-note=\"${safe(q[3])}\">${LABEL[j]}. ${safe(x)}\u003c/button>`).join('')}\u003c/div>\u003cdiv class=\"explain\" hidden>\u003c/div>\u003c/div>`;}\nfunction render(){\n $('side-chapters').innerHTML=CHAPTERS.map((c, iet{font-size:12px}.card{padding:19px}.permission-grid{grid-template-columns:1fr}.perm-col{padding:11px}.perm-col label{display:inline-flex;margin-right:16px}.deep-item summary{display:block}.deep-item summary small{margin-left:6px}.chapter-nav-footer button{min-width:0}.quiztitle{font-size:23px}.stat{border:0}}\n@media(max-width:800px){body aside.sidebar{z-index:61!important}}\n\u003c/style>\u003c/head>\n\u003cbody>\n\u003cdiv class=\"mobile-backdrop\" id=\"backdrop\">\u003c/div>\n\u003cdiv class=\"shell\">\n  \u003caside class=\"sidebar\" id=\"sidebar\" aria-label=\"课程目录\">\n    \u003ca class=\"brand\" href=\"#home\">\u003cdiv class=\"brandmark\">H\u003c/div>\u003cdiv class=\"brandname\">Hadoop · 一章通\u003csmall>65 页课件 · 交互式精讲\u003c/small>\u003c/div>\u003c/a>\n    \u003cdiv class=\"intro\">先用故事建立直觉，再看课件术语；每章单独学习，备考时可直接跳转。\u003c/div>\n    \u003cnav class=\"side-nav\" aria-label=\"章节导航\">\n      \u003ca class=\"navlink\" href=\"#home\">\u003cspan class=\"navnum\">⌂\u003c/span> 学习首页\u003c/a>\n      \u003cp class=\"side-overline\">按章节翻页 · 01—07\u003c/p>\u003cdiv id=\"chapter-nav\">\u003c/div>\n      \u003cp class=\"side-overline\">交互实验 · 立即实践\u003c/p>\n      \u003ca class=\"navlink\" href=\"#lab-hdfs\">\u003cspan class=\"navnum\">↗\u003c/span> HDFS 读取实验\u003c/a>\n      \u003ca class=\"navlink\" href=\"#lab-yarn\">\u003cspan class=\"navnum\">↗\u003c/span> YARN 七步调度\u003c/a>\n      \u003ca class=\"navlink\" href=\"#lab-hbase\">\u003cspan class=\"navnum\">↗\u003c/span> HBase 列族实验\u003c/a>\n      \u003ca class=\"navlink\" href=\"#lab-linux\">\u003cspan class=\"navnum\">↗\u003c/span> chmod / Shell 实验\u003c/a>\n      \u003cp class=\"side-overline\">考前复习\u003c/p>\n      \u003ca class=\"navlink\" href=\"#exam\">\u003cspan class=\"navnum\">✓\u003c/span> 章节即时自测\u003c/a>\n      \u003ca class=\"navlink\" href=\"#cheats\">\u003cspan class=\"navnum\">≡\u003c/span> 重点速记\u003c/a>\n      \u003ca class=\"navlink\" href=\"#coverage\">\u003cspan class=\"navnum\">▦\u003c/span> PDF 覆盖对照\u003c/a>\n    \u003c/nav>\n    \u003cdiv class=\"sidebottom\">\u003cdiv class=\"proglabels\">\u003cspan>知识点掌握进度\u003c/span>\u003cstrong id=\"learned\">0 / 46\u003c/strong>\u003c/div>\u003cdiv class=\"bar\">\u003cdiv id=\"progbar\">\u003c/div>\u003c/div>\u003csmall>掌握标记保存在本地浏览器\u003c/small>\u003c/div>\n  \u003c/aside>\n  \u003cdiv class=\"frame\">\u003cheader class=\"topbar\">\u003cdiv class=\"top-left\">\u003cbutton type=\"button\" class=\"menu\" id=\"menu\" aria-controls=\"sidebar\" aria-expanded=\"true\">☰ \u003cspan class=\"menutxt\">收起 / 展开目录\u003c/span>\u003c/button>\u003cspan class=\"crumb\" id=\"route-label\">HADOOP / 学习首页\u003c/span>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton type=\"button\" class=\"quiet\" id=\"theme\" title=\"切换深色模式\">◐ 主题\u003c/button>\u003ca class=\"pill-link\" href=\"#exam\">开始测验 ↗\u003c/a>\u003c/div>\u003c/header>\n  \u003cmain class=\"wrap\" id=\"main\">\n    \u003cdiv class=\"view\" id=\"view-home\">\n      \u003csection class=\"hero\">\u003cspan class=\"eyebrow\">LEARN THE SYSTEM · NOT THE SLIDES\u003c/span>\u003ch1>Hadoop，\u003cbr>\u003cem>这一章真正学懂。\u003c/em>\u003c/h1>\u003cp>把 65 页课件拆成清晰的学习路径：\u003cstrong>故事理解 → 准确术语 → 可操作示例 → 应试测验\u003c/strong>。不照搬长段文字，也不遗漏核心技术细节。\u003c/p>\u003cdiv class=\"cta\">\u003ca class=\"primary\" href=\"#chapter-google\">从第 1 章开始 →\u003c/a>\u003ca class=\"outline\" href=\"#chapter-linux\">直接学 Linux 命令\u003c/a>\u003ca class=\"outline\" href=\"#coverage\">核对 PDF 覆盖\u003c/a>\u003c/div>\u003cdiv class=\"stats\">\u003cdiv class=\"stat\">\u003cb>7\u003c/b>\u003cspan>独立学习板块\u003c/span>\u003c/div>\u003cdiv class=\"stat\">\u003cb id=\"card-count\">46\u003c/b>\u003cspan>知识卡片\u003c/span>\u003c/div>\u003cdiv class=\"stat\">\u003cb id=\"deep-count\">23\u003c/b>\u003cspan>进阶精讲\u003c/span>\u003c/div>\u003cdiv class=\"stat\">\u003cb id=\"quiz-count\">68\u003c/b>\u003cspan>考前习题\u003c/span>\u003c/div>\u003c/div>\u003c/section>\n      \u003csection class=\"section\">\u003cspan class=\"eyebrow\">THE BIG PICTURE\u003c/span>\u003ch2>先搞懂三个岗位，后面就不乱了\u003c/h2>\u003cp class=\"sub\">把 Hadoop 想象成一家公司。最重要的不是背缩写，而是知道“谁存、谁算、谁调度”。\u003c/p>\u003cdiv class=\"summaryline\">\u003carticle class=\"summarybox\">\u003cspan class=\"chip\">01 · HDFS\u003c/span>\u003cstrong>仓库管理员\u003c/strong>\u003cp>负责文件、块、位置与副本：NameNode 管目录，DataNode 放真货。\u003c/p>\u003c/article>\u003carticle class=\"summarybox\">\u003cspan class=\"chip\">02 · MapReduce\u003c/span>\u003cstrong>流水线工人\u003c/strong>\u003cp>先分工 Map，再 Shuffle 分拣，最后 Reduce 汇总。\u003c/p>\u003c/article>\u003carticle class=\"summarybox\">\u003cspan class=\"chip\">03 · YARN\u003c/span>\u003cstrong>资源调度中心\u003c/strong>\u003cp>ResourceManager 管预算，ApplicationMaster 管项目，NodeManager 管现场。\u003c/p>\u003c/article>\u003c/div>\u003c/section>\n      \u003csection class=\"section\">\u003cspan class=\"eyebrow\">LEARNING PATH\u003c/span>\u003ch2>7 个板块，随时独立复习\u003c/h2>\u003cp class=\"sub\">顺序学习更连贯；考试前也可以按知识点直接跳转。\u003c/p>\u003cdiv class=\"tiles\" id=\"chapter-shortcuts\">\u003c/div>\u003c/section>\n      \u003csection class=\"section\">\u003cspan class=\"eyebrow\">EXAM STRATEGY\u003c/span>\u003ch2>怎么复习效率最高？\u003c/h2>\u003cdiv class=\"three-cards\">\u003carticle class=\"tile\">\u003csmall>STEP 1\u003c/small>\u003ch3>先读本章卡片\u003c/h3>\u003cp>每张先给生动类比，再给考试表述；能说清“为什么”就勾选已掌握。\u003c/p>\u003c/article>\u003carticle class=\"tile\">\u003csmall>STEP 2\u003c/small>\u003ch3>难点展开精讲\u003c/h3>\u003cp>HBase 层级、YARN 流程、两份 XML、chmod 计算与 Linux 命令全都有详细解释。\u003c/p>\u003c/article>\u003carticle class=\"tile\">\u003csmall>STEP 3\u003c/small>\u003ch3>做题发现盲点\u003c/h3>\u003cp>68 道选择题可按章节抽取，立即判分并显示理由；临考再看速记清单。\u003c/p>\u003c/article>\u003c/div>\u003c/section>\n      \u003cdiv class=\"notice\">说明：内容以你上传的《大数据处理架构 Hadoop》65 页 PPT 为主。举例、分步演示与操作命令中的额外实践会明确标注“补充”；随 Hadoop 版本变化的配置不应当视为任何环境都通用的默认值。\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"view\" id=\"view-chapter\" hidden>\n      \u003csection class=\"chapter-hero\" id=\"chapter-header\">\u003c/section>\n      \u003cdiv class=\"controls\">\u003cinput class=\"search\" id=\"search\" type=\"search\" aria-label=\"搜索本章知识点\" placeholder=\"搜索本章知识点 / 术语 / 页码…\">\u003cdiv style=\"display:flex;align-items:center;flex-wrap:wrap;gap:12px\">\u003cbutton class=\"quiet\" id=\"focus\" type=\"button\">只看未掌握\u003c/button>\u003cspan class=\"count\" id=\"visible\">\u003c/span>\u003cspan class=\"count\" id=\"chapter-count\">\u003c/span>\u003c/div>\u003c/div>\n      \u003csection class=\"cards\" id=\"cards\" aria-label=\"课程知识卡片\">\u003c/section>\u003cp class=\"notice\" id=\"noresult\" hidden>没有匹配的知识卡片。清空搜索或点击“显示全部”。\u003c/p>\n      \u003csection class=\"deep-area\">\u003cdiv class=\"deep-head\">\u003cdiv>\u003cspan class=\"eyebrow\">DEEP DIVE\u003c/span>\u003ch2>考点精讲 · 点击展开\u003c/h2>\u003c/div>\u003c/div>\u003cp class=\"sub\">不必一次读完。优先展开觉得抽象、容易混淆或需要动手练的内容。\u003c/p>\u003cdiv id=\"deep-modules\">\u003c/div>\u003c/section>\n      \u003csection class=\"lab-area\" id=\"lab-hdfs\" hidden>\u003cspan class=\"eyebrow\">INTERACTIVE LAB · PDF P15\u003c/span>\u003cdiv class=\"lab\">\u003ch3>HDFS 读文件：找目录不等于搬文件\u003c/h3>\u003cp class=\"labdesc\">按顺序点击，理解 NameNode 与 DataNode 的实际分工。\u003c/p>\u003cdiv id=\"hdfs-flow\" class=\"flow\">\u003c/div>\u003cdiv class=\"labline\">\u003cspan class=\"count\" id=\"hdfs-count\">\u003c/span>\u003cbutton class=\"primary small\" id=\"hdfs-next\">下一阶段 →\u003c/button>\u003c/div>\u003cp class=\"lab-note\">演示抽象来自 P15 的架构图，流程步骤为教学展开。\u003c/p>\u003c/div>\u003c/section>\n      \u003csection class=\"lab-area\" id=\"lab-yarn\" hidden>\u003cspan class=\"eyebrow\">INTERACTIVE LAB · PDF P21–24\u003c/span>\u003cdiv class=\"lab\">\u003ch3>YARN 施工队 · 七步调度\u003c/h3>\u003cp class=\"labdesc\">先认角色，再走七步。点击步骤编号可直接跳看。\u003c/p>\u003cdiv id=\"role-tabs\" class=\"tabs\">\u003c/div>\u003cdiv id=\"role-content\" class=\"result\" aria-live=\"polite\">\u003c/div>\u003chr style=\"border:0;border-top:1px solid var(--line);margin:26px 0\">\u003cdiv class=\"progressdots\" id=\"yarn-dots\">\u003c/div>\u003cdiv id=\"yarn-step\" class=\"result\" style=\"margin-top:16px\" aria-live=\"polite\">\u003c/div>\u003cdiv class=\"labline\">\u003cbutton class=\"outline small\" id=\"yarn-prev\">← 上一步\u003c/button>\u003cbutton class=\"primary small\" id=\"yarn-next\">下一步 →\u003c/button>\u003c/div>\u003c/div>\u003c/section>\n      \u003csection class=\"lab-area\" id=\"lab-hbase\" hidden>\u003cspan class=\"eyebrow\">INTERACTIVE LAB · PDF P28–31\u003c/span>\u003cdiv class=\"lab\">\u003ch3>HBase：按“整行”看，还是按“列族”看？\u003c/h3>\u003cp class=\"labdesc\">切换视角，理解 RowKey 和 Store（列族存储）是不同的组织维度。\u003c/p>\u003clabel for=\"hbase-mode\" class=\"count\">查看角度：\u003c/label> \u003cselect id=\"hbase-mode\" class=\"search\" style=\"width:auto;min-width:190px\">\u003coption value=\"row\">按 RowKey 看整行\u003c/option>\u003coption value=\"family\">按列族分 Store 看\u003c/option>\u003c/select>\u003cdiv id=\"hbase-demo\" class=\"result\" style=\"margin-top:16px\" aria-live=\"polite\">\u003c/div>\u003cp class=\"lab-note\">微型数据为教学自编；不要把“列族存储”误认为所有列式 OLAP 数据库的相同物理实现。\u003c/p>\u003c/div>\u003c/section>\n      \u003csection class=\"lab-area\" id=\"lab-linux\" hidden>\u003cspan class=\"eyebrow\">INTERACTIVE LAB · PDF P55–64\u003c/span>\u003cdiv class=\"lab\">\u003ch3>Linux 权限计算器：看懂 chmod 754 / 644 / 755\u003c/h3>\u003cp class=\"labdesc\">勾选三类用户的 r、w、x 权限，观察数字与符号如何一一对应。\u003c/p>\u003cdiv class=\"permission-grid\">\u003cdiv class=\"perm-col\">\u003ch4>拥有者 u\u003c/h4>\u003clabel>\u003cinput type=\"checkbox\" data-perm=\"ur\" checked> r 读（4）\u003c/label>\u003clabel>\u003cinput type=\"checkbox\" data-perm=\"uw\" checked> w 写（2）\u003c/label>\u003clabel>\u003cinput type=\"checkbox\" data-perm=\"ux\" checked> x 执行（1）\u003c/label>\u003c/div>\u003cdiv class=\"perm-col\">\u003ch4>所属组 g\u003c/h4>\u003clabel>\u003cinput type=\"checkbox\" data-perm=\"gr\" checked> r 读（4）\u003c/label>\u003clabel>\u003cinput type=\"checkbox\" data-perm=\"gw\"> w 写（2）\u003c/label>\u003clabel>\u003cinput type=\"checkbox\" data-perm=\"gx\" checked> x 执行（1）\u003c/label>\u003c/div>\u003cdiv class=\"perm-col\">\u003ch4>其他人 o\u003c/h4>\u003clabel>\u003cinput type=\"checkbox\" data-perm=\"or\" checked> r 读（4）\u003c/label>\u003clabel>\u003cinput type=\"checkbox\" data-perm=\"ow\"> w 写（2）\u003c/label>\u003clabel>\u003cinput type=\"checkbox\" data-perm=\"ox\" checked> x 执行（1）\u003c/label>\u003c/div>\u003c/div>\u003cdiv class=\"perm-output\">\u003cspan id=\"perm-numeric\" hidden>755\u003c/span>\u003cspan id=\"perm-command\">chmod 755 filename\u003c/span>\u003cbr>\u003cb id=\"perm-symbol\">-rwxr-xr-x\u003c/b>\u003c/div>\u003cdiv class=\"labline\">\u003cspan class=\"count\">快速设置\u003c/span>\u003cdiv class=\"tabs\" id=\"perm-presets\">\u003cbutton class=\"tab\" data-preset=\"755\">755\u003c/button>\u003cbutton class=\"tab\" data-preset=\"644\">644\u003c/button>\u003cbutton class=\"tab\" data-preset=\"700\">700\u003c/button>\u003cbutton class=\"tab\" data-preset=\"777\">777\u003c/button>\u003c/div>\u003c/div>\u003cp class=\"lab-note\">注意：777 是教学演示，不应作为实际服务器文件的随意默认权限。\u003c/p>\u003c/div>\n      \u003cdiv class=\"lab\">\u003ch3>Shell 命令拆解实验\u003c/h3>\u003cp class=\"labdesc\">选一个常考命令，马上知道它在做什么；不是模拟真实系统执行，不会删除文件。\u003c/p>\u003cdiv class=\"terminalgrid\">\u003cdiv>\u003clabel class=\"count\" for=\"cmd-type\">选择命令：\u003c/label>\u003cselect id=\"cmd-type\">\u003coption value=\"ls\">ls -lR\u003c/option>\u003coption value=\"mkdir\">mkdir -p\u003c/option>\u003coption value=\"rm\">rm -R\u003c/option>\u003coption value=\"pipe\">管道 | 与 wc -l\u003c/option>\u003coption value=\"overwrite\">覆盖重定向 &gt;\u003c/option>\u003coption value=\"append\">追加重定向 &gt;&gt;\u003c/option>\u003coption value=\"input\">输入重定向 &lt;\u003c/option>\u003coption value=\"background\">后台 &amp;\u003c/option>\u003coption value=\"chmod\">chmod 644\u003c/option>\u003coption value=\"find\">find -name\u003c/option>\u003coption value=\"sort\">sort 排序\u003c/option>\u003coption value=\"cat\">cat 读取文件\u003c/option>\u003c/select>\u003cdiv class=\"result\" style=\"margin-top:12px\">\u003cstrong style=\"font-size:15px\">发生了什么？\u003c/strong>\u003cp id=\"cmd-explain\">\u003c/p>\u003c/div>\u003c/div>\u003cdiv>\u003clabel class=\"count\">示例命令：\u003c/label>\u003cdiv class=\"terminalpre\" style=\"min-height:132px\" id=\"cmd-example\">\u003c/div>\u003cp class=\"lab-note\">例子依据 P60–64 常用命令与管道、重定向知识整理。\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n      \u003cdiv class=\"chapter-nav-footer\">\u003cbutton class=\"outline\" id=\"prev-chapter\">← 上一板块\u003c/button>\u003ca class=\"quiet\" href=\"#exam\">去练习本章考点 →\u003c/a>\u003cbutton class=\"primary\" id=\"next-chapter\">下一板块 →\u003c/button>\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"view\" id=\"view-exam\" hidden>\u003cdiv class=\"chapter-hero\">\u003cdiv class=\"chapter-meta\">CHECK YOUR KNOWLEDGE\u003c/div>\u003ch1>章节自测 · 68 道题库\u003c/h1>\u003cp>每题即时反馈，题目来自 PPT 考点及同类延伸训练。可以整章混合测，也可以只测最弱的章节。\u003c/p>\u003c/div>\u003cdiv class=\"roundtop\">\u003cdiv class=\"quiztop\">\u003clabel for=\"quiz-filter\">\u003cstrong>题目范围\u003c/strong>\u003c/label>\u003cselect id=\"quiz-filter\">\u003c/select>\u003cbutton id=\"quiz-restart\" class=\"outline small\">重新开始 ↻\u003c/button>\u003c/div>\u003cdiv id=\"quiz-here\">\u003c/div>\u003c/div>\u003cdiv class=\"notice\">每题 4 个选项，回答后展示考点解析；题库是本页针对课件设计的自测题，不代表老师的原题试卷。\u003c/div>\u003c/div>\n\n    \u003cdiv class=\"view\" id=\"view-cheats\" hidden>\u003cdiv class=\"chapter-hero\">\u003cdiv class=\"chapter-meta\">LAST-MINUTE REVIEW\u003c/div>\u003ch1>考试前 10 分钟速记\u003c/h1>\u003cp>快速回忆最可能混淆的名词、流程、数字和命令。临考复习建议先看弱项，再回到精讲。\u003c/p>\u003c/div>\u003cdiv class=\"cheats\" id=\"cheats-grid\">\u003c/div>\u003c/div>\n\n    \u003cdiv class=\"view\" id=\"view-coverage\" hidden>\u003cdiv class=\"chapter-hero\">\u003cdiv class=\"chapter-meta\">SOURCE COVERAGE AUDIT\u003c/div>\u003ch1>65 页课件覆盖索引\u003c/h1>\u003cp>本网站按重要性重组课件，不逐页复刻重复文字。下表标明每一段 PPT 对应的学习入口。\u003c/p>\u003c/div>\u003cdiv class=\"coverage\">\u003ctable>\u003cthead>\u003ctr>\u003cth>PDF 页码\u003c/th>\u003cth>原课件主题及复习要点\u003c/th>\u003cth>对应网站章节\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"coverage-table\">\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"notice\">内容完整覆盖四大主题线：Google 技术背景、Hadoop 基础与 YARN、HBase/Hive 生态、安装与 Linux。截图型示例重写为可读代码，课件外补充的验证命令会明确标注。\u003c/div>\u003c/div>\n    \u003cfooter class=\"bottom\">Hadoop · 一章通 · 按上传的《大数据处理架构 Hadoop》（65页）编排。独立单文件，无外部依赖；离线可用。\u003cbr>专注学习与应试，不替代生产环境的 Hadoop 文档与系统管理员操作规范。\u003c/footer>\n  \u003c/main>\u003c/div>\n\u003c/div>\n\u003cscript type=\"application/json\" id=\"course-data\">{\"chapters\": [[\"google\", \"01\", \"Google 的大数据答案\", \"P4–8\", \"从“电脑装不下”讲起\"], [\"hadoop\", \"02\", \"Hadoop 的三大支柱\", \"P10–17\", \"存储、计算、调度别再混\"], [\"yarn\", \"03\", \"1.0 到 YARN 调度\", \"P18–25\", \"一场施工队的架构升级\"], [\"hbase\", \"04\", \"HBase 与分布式存储\", \"P26–32\", \"从行、列族到 Region / Store\"], [\"ecosystem\", \"05\", \"Hive、Spark 与生态工具\", \"P33–39\", \"一张地图分清谁负责什么\"], [\"install\", \"06\", \"Hadoop 配置实践\", \"P40–45\", \"两份 XML 怎么读、怎么改\"], [\"linux\", \"07\", \"Linux 实验与命令\", \"P46–65\", \"权限、管道、重定向能做题\"]], \"cards\": [{\"id\": \"c01\", \"chapter\": \"google\", \"title\": \"Google 面对两个大难题\", \"pages\": \"P4\", \"hook\": \"网页、图片规模巨大：单机既放不下，也算不动。\", \"analogy\": \"假如图书馆有上亿本书：一个仓库放不下，一个管理员也统计不过来。\", \"core\": \"Google 分别需要解决海量数据的分布式存储问题与大规模并行计算问题。\", \"trap\": \"把“存储问题”与“计算问题”混为一谈。\", \"expand\": \"存储：如何把数据安全放在许多机器上；计算：如何组织许多机器同时处理它们。\"}, {\"id\": \"c02\", \"chapter\": \"google\", \"title\": \"普通服务器 + 软件容错\", \"pages\": \"P5\", \"hook\": \"集群依靠大量普通机器，而不是完全依赖昂贵的单台巨型服务器。\", \"analogy\": \"很多普通小仓库组成仓库群；坏掉一座时通过备份与协调继续运转。\", \"core\": \"分布式并行集群的思路：低成本普通服务器、软件处理节点故障。\", \"trap\": \"普通机器不会坏？恰恰相反，架构把故障视为常态。\", \"expand\": \"高可用来源于冗余、监控和恢复机制，而不等于硬件不故障。\"}, {\"id\": \"c03\", \"chapter\": \"google\", \"title\": \"GFS、BigTable、MapReduce 三剑客\", \"pages\": \"P5–6\", \"hook\": \"三个系统分别回答：文件怎么放、结构化数据怎么管、计算怎么做。\", \"analogy\": \"GFS 是总仓库；BigTable 像索引清晰的大账本；MapReduce 是流水线加工车间。\", \"core\": \"GFS：分布式文件系统；BigTable：分布式数据管理；MapReduce：并行计算模型。\", \"trap\": \"MapReduce 不是数据库；BigTable 也不是文件系统的替代同义词。\", \"expand\": \"课件将 GFS + BigTable 列为存储管理，MapReduce 列为计算。\"}, {\"id\": \"c04\", \"chapter\": \"google\", \"title\": \"第一代架构 GFS 细节\", \"pages\": \"P6\", \"hook\": \"Master 管目录，ChunkServer 管真正的块。\", \"analogy\": \"总部告诉客户物资在哪些仓库；货车直接去仓库取货，不到总部搬货。\", \"core\": \"GFS 的 master–chunkserver 架构、64MB 大块、常见三副本；Master 管元数据，客户端直接与 ChunkServer 交换数据。\", \"trap\": \"Master 不承担实际文件内容的大规模传输。\", \"expand\": \"大块减少元数据管理开销；多副本提升故障情况下的数据可用性。\"}, {\"id\": \"c05\", \"chapter\": \"google\", \"title\": \"MapReduce：分而治之\", \"pages\": \"P6\", \"hook\": \"复杂的大任务拆成 Map 与 Reduce；Shuffle 在两者之间整理数据。\", \"analogy\": \"几百人先分别数各个书架（Map），按图书类别集中清单（Shuffle），总账员汇总（Reduce）。\", \"core\": \"Split / Map / Shuffle / Reduce 的批处理流水线；框架管理并行与容错。\", \"trap\": \"Shuffle 不是用户写的第三个独立 Map/Reduce 函数。\", \"expand\": \"数据按输入分片由多个 Map 并行处理，再汇集同一 key 交给 Reduce。\"}, {\"id\": \"c06\", \"chapter\": \"google\", \"title\": \"第二代 Colossus 与 Spark\", \"pages\": \"P7\", \"hook\": \"储存改进与内存计算改进分开看。\", \"analogy\": \"新仓储系统改进仓库成本与目录管理；新加工车间尽量把半成品留在工作台（内存）。\", \"core\": \"课件介绍 Colossus 的控制/数据解耦、纠删码与冷热分层；Spark 减少迭代磁盘 I/O。\", \"trap\": \"“Spark 快 10–100 倍”是课件举的场景化宣传量级，不是所有任务的固定倍率。\", \"expand\": \"Colossus 侧重存储；Spark 侧重计算。\"}, {\"id\": \"c07\", \"chapter\": \"google\", \"title\": \"Dataflow / Beam / Serverless\", \"pages\": \"P8\", \"hook\": \"批处理与流处理能用统一抽象组织，托管平台减少运维。\", \"analogy\": \"食堂不必为早餐和晚餐各建一套厨房；用统一菜谱交给弹性厨房执行。\", \"core\": \"课件用 Dataflow、Apache Beam 说明批流统一与 Serverless 托管。\", \"trap\": \"Beam 是编程模型，Dataflow 是托管执行服务，角色并不相同。\", \"expand\": \"Lambda 架构常有两套路径，统一批流旨在减少维护与一致性负担。\"}, {\"id\": \"c08\", \"chapter\": \"hadoop\", \"title\": \"Hadoop 从 Nutch 诞生\", \"pages\": \"P10–11\", \"hook\": \"原本为搜索引擎解决海量网页的存储与计算，后来独立成为开源框架。\", \"analogy\": \"给搜索引擎修仓库和流水线，发现别的公司也都需要，于是把基础设施单独开放。\", \"core\": \"Doug Cutting、Nutch、Google 的 GFS/MapReduce 论文、2006 年 Hadoop 独立。\", \"trap\": \"不要误记 Hadoop 是 Google 直接发布的开源软件。\", \"expand\": \"Google 的论文提供设计思想，Hadoop 是相关思想的开源实现。\"}, {\"id\": \"c09\", \"chapter\": \"hadoop\", \"title\": \"Hadoop 核心六大优势\", \"pages\": \"P12\", \"hook\": \"主要优势：可扩展、容错、可靠、高效、低成本、灵活。\", \"analogy\": \"仓库可增加分店，坏一间有备份，工作由多店分担，而且所用设备便宜。\", \"core\": \"Scalability、Fault Tolerance、Reliability、Efficiency、Cost-Effectiveness、Flexibility。\", \"trap\": \"可靠性侧重数据，容错性侧重故障之后服务或任务的恢复；二者相关但侧重不同。\", \"expand\": \"考试可按关键词匹配：增加节点 → 扩展；副本恢复 → 可靠；任务重试 → 容错。\"}, {\"id\": \"c10\", \"chapter\": \"hadoop\", \"title\": \"Hadoop 三大核心组件\", \"pages\": \"P14\", \"hook\": \"用一句话区分：HDFS 存，MapReduce 算，YARN 管。\", \"analogy\": \"仓库（HDFS）+ 加工流水线（MapReduce）+ 物业与资源调配中心（YARN）。\", \"core\": \"HDFS = 分布式文件系统；MapReduce = 并行计算框架；YARN = 集群资源调度系统。\", \"trap\": \"YARN 本身不执行 Map/Reduce 业务逻辑。\", \"expand\": \"用户提问“任务没有 CPU/内存由谁分配？”是 YARN；“文件的块在哪？”是 HDFS。\"}, {\"id\": \"c11\", \"chapter\": \"hadoop\", \"title\": \"NameNode 与 DataNode\", \"pages\": \"P15\", \"hook\": \"一个管理文件目录和块位置，一个真的保存文件块。\", \"analogy\": \"NameNode 像图书目录管理员，不直接抱着所有书；DataNode 才是放书的库房。\", \"core\": \"NameNode 维护命名空间和文件元数据；DataNode 存储/读取 Block 并执行副本指令。\", \"trap\": \"NameNode 不是“存放用户文件完整内容”的机器。\", \"expand\": \"客户端先找 NameNode 问块位置，再与 DataNode 直接传输文件数据。\"}, {\"id\": \"c12\", \"chapter\": \"hadoop\", \"title\": \"HDFS 设计：多副本、大吞吐\", \"pages\": \"P15\", \"hook\": \"偏向大文件、顺序访问、写一次读多次。\", \"analogy\": \"一次把很多纸箱运到各地仓库，然后经常整批取用。\", \"core\": \"高吞吐、PB 级扩展、多副本故障恢复、适合离线批处理。\", \"trap\": \"“吞吐量高”不等于“每次小读写的延迟低”。\", \"expand\": \"流式访问适合大量读写，不是所有随机事务工作负载都最优。\"}, {\"id\": \"c13\", \"chapter\": \"hadoop\", \"title\": \"HDFS 2.0：HA 与 Federation\", \"pages\": \"P16\", \"hook\": \"一个解决 NameNode 失效问题，一个解决单一命名空间问题。\", \"analogy\": \"HA：目录管理员请一位热备；Federation：多位管理员分别管理不同馆区。\", \"core\": \"HDFS HA：Active/Standby NameNode 以缓解单点故障；Federation：多个独立命名空间。\", \"trap\": \"HA ≠ Federation；前者偏可用性，后者偏扩展及资源隔离。\", \"expand\": \"易出判断题：“Federation 就是两个 NameNode 互为主备”是错误的。\"}, {\"id\": \"c14\", \"chapter\": \"hadoop\", \"title\": \"MapReduce 工作流水线\", \"pages\": \"P17\", \"hook\": \"一次拆分、各做各的、归类、汇总。\", \"analogy\": \"每个工人加工不同批次，分拣中心按客户归堆，会计做总账。\", \"core\": \"Input Split → Map → Shuffle → Reduce → HDFS 输出。\", \"trap\": \"MapReduce 不负责替代 HDFS 的文件存储职责。\", \"expand\": \"下一节课的详细 Shuffle 属于计算侧，不是资源管理侧。\"}, {\"id\": \"c15\", \"chapter\": \"yarn\", \"title\": \"MapReduce 1.0：JobTracker / TaskTracker\", \"pages\": \"P18\", \"hook\": \"JobTracker 一个人承担管理、调度、监控；TaskTracker 接任务执行。\", \"analogy\": \"总部总经理连招人、排班、项目检查都亲自做，工地主管只接命令干活。\", \"core\": \"JobTracker 负责资源与作业调度，TaskTracker 执行具体 Map/Reduce 任务。\", \"trap\": \"JobTracker 不是 MapReduce 2.0 的标准组件名称。\", \"expand\": \"认识版本：1.0 是 JobTracker / TaskTracker；2.0 改用 YARN 的 RM / AM / NM。\"}, {\"id\": \"c16\", \"chapter\": \"yarn\", \"title\": \"1.0 的五个缺点\", \"pages\": \"P19\", \"hook\": \"一个人管太多、坏了瘫痪、固定 Map/Reduce 槽浪费资源。\", \"analogy\": \"办公室划死了“打包区”和“装车区”：一边闲着，另一边也不能借位。\", \"core\": \"单点故障；职责过重；资源开销大；Map/Reduce slot 静态隔离；按槽数而非实际 CPU/内存需求分配。\", \"trap\": \"不能把 Slot 固定分配与 Container 动态资源分配说成同一种机制。\", \"expand\": \"选择题线索：JobTracker 过载和 slot 不灵活 → 1.0 缺陷。\"}, {\"id\": \"c17\", \"chapter\": \"yarn\", \"title\": \"YARN 设计思想：管理和计算拆开\", \"pages\": \"P20–21\", \"hook\": \"JobTracker 的一部分职责被拆给更专业的角色。\", \"analogy\": \"集团总部只管资源预算；每个项目自带项目经理；现场主管管理各自工地。\", \"core\": \"YARN 专注资源管理调度；MapReduce 2.0 在 YARN 上运行，计算逻辑不等于资源调度。\", \"trap\": \"YARN 不是只能运行 MapReduce。\", \"expand\": \"一个集群可供 Spark 等其他计算框架共享资源。\"}, {\"id\": \"c18\", \"chapter\": \"yarn\", \"title\": \"RM / AM / NM / Container 四角色\", \"pages\": \"P21–22\", \"hook\": \"把谁管“全局”、谁管“一个项目”、谁管“本机”一次区分。\", \"analogy\": \"RM 总调度中心；AM 项目经理；NM 现场主管；Container 临时划给项目的工位和资源包。\", \"core\": \"RM：全局资源；AM：应用级协调、申请资源与监控；NM：本机资源和容器启动；Container：CPU/内存资源封装。\", \"trap\": \"Container 不是 DataNode；AM 本身也需要 Container 运行。\", \"expand\": \"1 个集群可以有多个 AM：每个应用拥有自己的 AM。\"}, {\"id\": \"c19\", \"chapter\": \"yarn\", \"title\": \"YARN 的七步作业流程\", \"pages\": \"P24\", \"hook\": \"客户递申请、总部给项目经理工位、项目经理申请更多资源、各工地开工、完成报备。\", \"analogy\": \"从施工队的工作票流转来记住 Client → RM → AM → NM → Container → Task。\", \"core\": \"客户端提交 → RM 启动 AM → AM 申请 → RM 分配 → AM 联系 NM 启动任务 → 运行汇报 → 完成注销。\", \"trap\": \"通常 RM 负责分配资源，不亲自启动每个 MapTask；NM 负责启动本机任务。\", \"expand\": \"考流程顺序：一定是先分配 AM 的 Container，再由 AM 向 RM 申请任务资源。\"}, {\"id\": \"c20\", \"chapter\": \"yarn\", \"title\": \"YARN 为什么更省资源\", \"pages\": \"P25\", \"hook\": \"项目经理各自承担任务监控，总部不用事无巨细。\", \"analogy\": \"让每个项目的项目经理记录进度，总部只负责协调大局。\", \"core\": \"Container 按需求动态分配；每应用独立 AM；多计算框架共享集群。\", \"trap\": \"不能把“多个 AM”理解成“一个任务必须在多个 AM 上运行”。\", \"expand\": \"考试对比：1.0 固定 slot；YARN 动态 Container。\"}, {\"id\": \"c21\", \"chapter\": \"hbase\", \"title\": \"Hive 和 HBase 名字像，工作不同\", \"pages\": \"P26–27\", \"hook\": \"Hive 方便批量分析，HBase 方便随机快速读写。\", \"analogy\": \"Hive 像统计报表部门；HBase 像随时能查某个客户详细资料的柜台。\", \"core\": \"Hive：数据仓库与 HQL；HBase：建立在 HDFS 之上的列族式 NoSQL 数据库。\", \"trap\": \"Hive 与 HBase 不可互换；前者不擅长低延迟单条查询。\", \"expand\": \"课件有同时介绍 Hive/HBase，随后对两者分别展开。\"}, {\"id\": \"c22\", \"chapter\": \"hbase\", \"title\": \"HBase：稀疏、多维、有序映射\", \"pages\": \"P28\", \"hook\": \"不同人的信息字段可以不一样；空值不一定占据单元格。\", \"analogy\": \"通讯录里小王只有手机号，小李还有邮箱、地址——不用为所有人预留所有字段。\", \"core\": \"HBase 逻辑模型：按 RowKey 定位行，列族约束同表结构，列限定符可动态扩展。\", \"trap\": \"一张表各行的列族定义相同，不等于每行实际包含的列限定符相同。\", \"expand\": \"一行拥有相同列族框架，但各行写入的具体列可不同。\"}, {\"id\": \"c23\", \"chapter\": \"hbase\", \"title\": \"HBase：RowKey 与 Region\", \"pages\": \"P29\", \"hook\": \"按行键范围把数据拆成多个 Region，分散给 RegionServer。\", \"analogy\": \"按客户编号范围分成 A 柜台、B 柜台、C 柜台，查号时先确定归哪个柜台。\", \"core\": \"Region 是 HBase 表的水平分片/管理与服务单位。\", \"trap\": \"Region 不是 HDFS 的 Block；二者处在不同层。\", \"expand\": \"考例：A00001 与 B00003 可能属于不同 Region，但都属于同一逻辑表。\"}, {\"id\": \"c24\", \"chapter\": \"hbase\", \"title\": \"Region → Store → MemStore / StoreFile\", \"pages\": \"P30\", \"hook\": \"Region 按列族组织 Store；新数据先在内存，落盘后成为文件。\", \"analogy\": \"每个柜台有多个分类抽屉（Store），先放暂存盒（MemStore），再整理进永久档案（StoreFile）。\", \"core\": \"一个 Store 对应一个列族；Store 含内存 MemStore 与磁盘 StoreFile（HFile 存在 HDFS）。\", \"trap\": \"MemStore 在内存，StoreFile/HFile 在磁盘 HDFS，不能说反。\", \"expand\": \"多个 StoreFile 可能存在，形成更复杂的存储层次。\"}, {\"id\": \"c25\", \"chapter\": \"hbase\", \"title\": \"行式存储 vs 列族存储\", \"pages\": \"P31\", \"hook\": \"按“一个人的全部信息”读取或按“同类字段”组织，两种目标不同。\", \"analogy\": \"行式像整张体检报告按人装订，列式像身高表、血压表各自装订。\", \"core\": \"课件对比行式：整行连续；列式/列族：相关列集中，减少不需要字段的读取开销。\", \"trap\": \"HBase 是列族存储，不应简单等同所有分析型列式数据库的物理列存。\", \"expand\": \"行式适合读取一条完整记录；按列只读取部分属性或压缩有其优势。\"}, {\"id\": \"c26\", \"chapter\": \"hbase\", \"title\": \"HBase 五个特点和 WAL\", \"pages\": \"P32\", \"hook\": \"大规模、列族、稀疏、并发、可靠；写之前先记日志。\", \"analogy\": \"像柜台登记：先在日志簿记下一笔，才放入待归档箱；停电后凭日志恢复。\", \"core\": \"海量存储、列族、稀疏表、MVCC、WAL（先记日志再更新 MemStore），底层 HDFS 副本。\", \"trap\": \"WAL 不是数据已经全部刷入 HFile 的意思。\", \"expand\": \"WAL 与复制机制为不同层次的可靠性提供保障。\"}, {\"id\": \"c27\", \"chapter\": \"ecosystem\", \"title\": \"数据库和数据仓库\", \"pages\": \"P33\", \"hook\": \"业务记录在变，分析仓库保留历史并做 ETL。\", \"analogy\": \"收银系统不断收新订单；总部分析仓库周期性整合各门店历史数据做统计。\", \"core\": \"数据库偏事务业务；数据仓库为分析决策组织历史数据，常经 Extract/Transform/Load。\", \"trap\": \"不要绝对化为“所有数据库都只有原始数据 / 所有仓库完全静止”。\", \"expand\": \"课件强调分析与业务用途的差异，做题先按场景判断。\"}, {\"id\": \"c28\", \"chapter\": \"ecosystem\", \"title\": \"Hive 查询四步\", \"pages\": \"P34\", \"hook\": \"写类 SQL 的 HQL，不必手写底层 MapReduce。\", \"analogy\": \"你说“帮我按省份统计销售额”，报表系统把请求翻译为底层计算任务。\", \"core\": \"用户发 HQL → Hive 编译/优化制订计划 → 转为执行任务 → 在 Hadoop 上运行。\", \"trap\": \"课件示例写 MapReduce；现代 Hive 也可能使用 Tez/Spark，这里与 PPT 的流程区分。\", \"expand\": \"HiveQL 并不是直接从磁盘一次就返回答案，底层要执行计算。\"}, {\"id\": \"c29\", \"chapter\": \"ecosystem\", \"title\": \"Hive 的优缺点\", \"pages\": \"P35\", \"hook\": \"好上手、适合大规模离线报表，但响应较慢。\", \"analogy\": \"写报表需求省事，但用它处理“点开某用户立刻显示余额”并不合适。\", \"core\": \"优点：类 SQL、UDF、自动转任务；局限：高延迟、小数据不占优势、迭代及细粒度调优困难。\", \"trap\": \"Hive 不是优先用于毫秒级在线事务处理。\", \"expand\": \"对实时性要求不高的统计分析优先想到 Hive。\"}, {\"id\": \"c30\", \"chapter\": \"ecosystem\", \"title\": \"Spark 为什么适合迭代\", \"pages\": \"P36\", \"hook\": \"反复用同一份数据时，尽可能复用内存中的中间结果。\", \"analogy\": \"烘焙反复处理面团：每次把面团搬去冷库很慢，留在工作台继续加工更高效。\", \"core\": \"课件从磁盘 I/O、计算阶段、迭代复用解释 Spark 相较 MapReduce 的优势。\", \"trap\": \"内存也有限；“每次都快 100 倍以上”不是严谨通用结论。\", \"expand\": \"RDD、DataFrame 和 DAG 是 Spark 的常见概念，此课件这里只作概述。\"}, {\"id\": \"c31\", \"chapter\": \"ecosystem\", \"title\": \"Flume / ZooKeeper / Ambari\", \"pages\": \"P37\", \"hook\": \"日志进仓、分布式协调、可视化运维。\", \"analogy\": \"Flume 运输车；ZooKeeper 协调广播站；Ambari 集群管家仪表盘。\", \"core\": \"Flume：采集日志；ZooKeeper：分布式协调；Ambari：部署/监控。\", \"trap\": \"ZooKeeper 本身不是数据仓库。\", \"expand\": \"看到日志采集选 Flume；一致性协调选 ZooKeeper。\"}, {\"id\": \"c32\", \"chapter\": \"ecosystem\", \"title\": \"Sqoop / Flink / Kafka\", \"pages\": \"P38\", \"hook\": \"数据库迁移、实时流处理、消息缓冲层。\", \"analogy\": \"Sqoop 像两类仓库间的搬运工；Flink 是实时加工车间；Kafka 是可靠的消息传送带。\", \"core\": \"Sqoop：RDBMS 与 Hadoop 之间导入/导出；Flink：有状态低延迟流处理；Kafka：消息队列。\", \"trap\": \"Flink 不是只做离线批处理，Sqoop 也不是分布式文件系统。\", \"expand\": \"Flink 关键词：流式、有状态、Exactly-once（课件）。\"}, {\"id\": \"c33\", \"chapter\": \"ecosystem\", \"title\": \"Pig / Oozie / Mahout / 整体生态\", \"pages\": \"P38–39\", \"hook\": \"把具体任务映射到合适的工具，别只记名字。\", \"analogy\": \"Pig 写批处理流程；Oozie 排先后任务；Mahout 管机器学习；底层 HDFS/YARN 提供存储和资源。\", \"core\": \"Pig Latin/ETL、Oozie 工作流、Mahout 机器学习；HDFS 下层 + YARN 调度 + 计算引擎。\", \"trap\": \"工具不是严格唯一层级：生态图是概念组合示意，不是唯一拓扑。\", \"expand\": \"建议速记：采集 Flume，搬运 Sqoop，协调 ZooKeeper，调度 Oozie，运维 Ambari。\"}, {\"id\": \"c34\", \"chapter\": \"install\", \"title\": \"Linux 系统选择\", \"pages\": \"P41\", \"hook\": \"课件建议 Ubuntu 或 CentOS；实验平台使用 Ubuntu。\", \"analogy\": \"操作系统是大楼地基，Hadoop 服务架设其上。\", \"core\": \"掌握 Ubuntu/CentOS 两个发行版与环境差异，默认在 Linux Shell 下操作。\", \"trap\": \"课件版本相关命令需根据实际系统发行版与 Hadoop 版本调整。\", \"expand\": \"不会安装时先检查 Java 与 Hadoop 环境是否已由教学平台提供。\"}, {\"id\": \"c35\", \"chapter\": \"install\", \"title\": \"三种 Hadoop 运行模式\", \"pages\": \"P42\", \"hook\": \"本地模式一台机器单进程，伪分布式一台机器模拟多角色，完全分布式多台机器。\", \"analogy\": \"一人在自己桌上处理（本地）／一间办公室里模拟仓库+总部（伪分布式）／多个城市实际协作（分布式）。\", \"core\": \"Local 非分布式；Pseudo-distributed 单节点既有 NameNode 又有 DataNode，读取 HDFS；Fully distributed 多节点集群。\", \"trap\": \"伪分布式不是多机器；本地模式一般也不需要从 HDFS 读取。\", \"expand\": \"判断题：NameNode 与 DataNode 在同一物理节点可属于伪分布式。\"}, {\"id\": \"c36\", \"chapter\": \"install\", \"title\": \"core-site.xml 管什么\", \"pages\": \"P43\", \"hook\": \"告诉系统默认找哪个文件系统、临时文件放哪里。\", \"analogy\": \"core-site 像给每个仓库工人发一张“总仓地址和临时工作区”地图。\", \"core\": \"hadoop.tmp.dir = 本地临时目录；fs.defaultFS = 默认文件系统 URI，课件为 hdfs://localhost:9000。\", \"trap\": \"localhost:9000 是课件示例值，不是所有集群固定地址。\", \"expand\": \"目录应存在且进程有权限访问；无集群环境不要直接照抄并声称已启动。\"}, {\"id\": \"c37\", \"chapter\": \"install\", \"title\": \"hdfs-site.xml 管什么\", \"pages\": \"P44\", \"hook\": \"规定 HDFS 的副本数量与 NN/DN 数据在本机的存储位置。\", \"analogy\": \"一份货要复印几份（replication），索引档案放哪（name.dir），货箱放哪（data.dir）。\", \"core\": \"dfs.replication=1（课件伪分布式）；dfs.namenode.name.dir 存 NN 元数据；dfs.datanode.data.dir 存块数据。\", \"trap\": \"replication=1 只适合单机实验，不能误认它有冗余容错。\", \"expand\": \"文件夹路径是本机磁盘路径，不是 HDFS 内的 /user 目录。\"}, {\"id\": \"c38\", \"chapter\": \"install\", \"title\": \"实验安装的合理顺序\", \"pages\": \"P43–45\", \"hook\": \"先检查环境，再改配置，最后初始化与验证。\", \"analogy\": \"盖仓库前准备地址与施工许可，建好档案柜，才能开门营业。\", \"core\": \"P43–44 给出了配置文件示例；P45 提出选做部署实验，具体启动验证命令属于本页补充实践。\", \"trap\": \"format 会初始化 NameNode 元数据；已有重要数据的 HDFS 不要重复格式化。\", \"expand\": \"先检查 java -version / hadoop version，再检查配置中的端口、权限、路径。\"}, {\"id\": \"c39\", \"chapter\": \"linux\", \"title\": \"Linux 的特点与组成\", \"pages\": \"P49–51\", \"hook\": \"操作系统不只有图形窗口，内核、Shell、文件系统各司其职。\", \"analogy\": \"内核是发动机；Shell 是操作台；文件系统是档案柜。\", \"core\": \"开源、多用户多任务、POSIX、稳定与权限；组成：Kernel、Shell、文件系统。\", \"trap\": \"Shell 是解释命令的接口，不等于 Linux 内核。\", \"expand\": \"Linux 可以通过命令行操作，Hadoop 实验主要依赖 Shell。\"}, {\"id\": \"c40\", \"chapter\": \"linux\", \"title\": \"Linux 目录：哪里放什么\", \"pages\": \"P52\", \"hook\": \"根目录 / 是所有路径的起点，不等于 root 用户的家。\", \"analogy\": \"城市道路树：/ 是总入口，/home 是住户区，/etc 是政策文档区。\", \"core\": \"/home 用户目录；/root root 家目录；/etc 配置；/tmp 临时；/var/log 日志；/dev 设备；/usr 程序工具。\", \"trap\": \"“/”与“/root”不同；相对路径和绝对路径也不同。\", \"expand\": \"常问目录：配置文件 /etc，第三方安装 /opt，设备 /dev。\"}, {\"id\": \"c41\", \"chapter\": \"linux\", \"title\": \"用户、组和 /etc/passwd\", \"pages\": \"P53\", \"hook\": \"Linux 支持多用户，各用户有自己的权限和归属组。\", \"analogy\": \"公司的员工都有工号，部门是组；root 是系统管理员。\", \"core\": \"/etc/passwd 按冒号分隔用户属性（UID/GID、家目录、Shell）；/etc/group 存组信息。\", \"trap\": \"文件名带 passwd 不代表实际密码明文就存这里，密码字段常以 x 占位。\", \"expand\": \"su 用户名切用户；sudo command 用授权机制以更高权限运行单个命令。\"}, {\"id\": \"c42\", \"chapter\": \"linux\", \"title\": \"rwx 权限的 10 个字符\", \"pages\": \"P54–55\", \"hook\": \"第 1 位是文件类型，后三组三位依次是 u/g/o。\", \"analogy\": \"门禁卡：屋主、部门同事、外来访客各有读/写/执行权限。\", \"core\": \"ls -l 的 -rwxr-xr-- 可拆为类型 - + u=rwx + g=r-x + o=r--。\", \"trap\": \"目录上的 x 更接近“允许进入/遍历”，不等于“执行目录文件内容”。\", \"expand\": \"r=4、w=2、x=1，为 chmod 数字计算做准备。\"}, {\"id\": \"c43\", \"chapter\": \"linux\", \"title\": \"chmod 字母形式与数字形式\", \"pages\": \"P56–58\", \"hook\": \"符号形式给某一类人增删权限，数字形式一次设定三组。\", \"analogy\": \"给屋主添加写权限写 u+w；按三组配置成 755 则相当于 rwx/r-x/r-x。\", \"core\": \"chmod u+x file；chmod g-w file；chmod 644 file；chmod -R 递归（谨慎）。\", \"trap\": \"chmod 777 允许所有人写/执行，不等于安全或最佳默认值。\", \"expand\": \"644→rw-r--r--；755→rwxr-xr-x；700→rwx------。\"}, {\"id\": \"c44\", \"chapter\": \"linux\", \"title\": \"Linux 文件与目录命令\", \"pages\": \"P59–62\", \"hook\": \"把常见命令看作“找、看、新建、搬、删”。\", \"analogy\": \"pwd 看当前地址；ls 看里面有什么；mkdir 建房间；cp 复印；mv 搬家；rm 扔掉。\", \"core\": \"ls, pwd, cd, mkdir, touch, cat, cp, mv, rm, find, grep, wc, sort, tar, gzip 等。\", \"trap\": \"rm -R 递归删除，-f 强制；对重要目录谨慎执行。\", \"expand\": \"ls -lR 可以递归查看并列出详细属性；mkdir -p 一次创建多层目录。\"}, {\"id\": \"c45\", \"chapter\": \"linux\", \"title\": \"管道、重定向和后台运行\", \"pages\": \"P63–64\", \"hook\": \"用 | 接力数据，用 > 覆盖输出，用 >> 追加，用 \u003c 换输入。\", \"analogy\": \"水管左边的输出直接流到右边；> 倒空瓶子重新装，>> 从原液面继续加。\", \"core\": \"cmd1 | cmd2：标准输出接标准输入；> 覆盖；>> 追加；\u003c 输入文件；\u003c\u003c 文档标记；& 后台启动。\", \"trap\": \"| 不等于“两个命令同时计算”；> 不等于追加，尤其容易考。\", \"expand\": \"cat /etc/passwd | wc -l 按行计数；grep root \u003c\\/etc/passwd 从文件输入。\"}, {\"id\": \"c46\", \"chapter\": \"linux\", \"title\": \"实验环境与作业要求\", \"pages\": \"P48、65\", \"hook\": \"实验平台已有环境，可通过浏览器操作；结尾要求提交实验结果截图。\", \"analogy\": \"像上机教室给你配好电脑和软件，重点是执行、观察、提交记录。\", \"core\": \"课件 P48 提供校内/VPN 实验平台；P65 要求提交实验结果图和完成相应测试。\", \"trap\": \"账号密码与课程链接应以当前教学平台为准；不要把课件的初始密码公开使用。\", \"expand\": \"可在已有平台上验证所有 Linux 命令，不要误把课件示例当作必须在自己电脑上装完整集群。\"}], \"deep\": [{\"chapter\": \"google\", \"title\": \"Google 三代技术路线总览\", \"pages\": \"P4–8\", \"desc\": \"考点是“存储与计算谁负责”，不是背营销数字。\", \"body\": \"\u003cp>图书馆越来越大，第一步不是买一台巨型电脑，而是把书分放多座仓库、让许多人并行处理。Google 的技术线索可以按两条线记：\u003c\\/p>\u003ctable>\u003ctr>\u003cth>时期\u003c\\/th>\u003cth>存储 / 管理\u003c\\/th>\u003cth>计算\u003c\\/th>\u003c\\/tr>\u003ctr>\u003ctd>第一代\u003c\\/td>\u003ctd>GFS、BigTable\u003c\\/td>\u003ctd>MapReduce\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>后续演进\u003c\\/td>\u003ctd>Colossus、纠删码、冷热分层\u003c\\/td>\u003ctd>Spark 的内存复用\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>统一服务\u003c\\/td>\u003ctd>多源数据与管道\u003c\\/td>\u003ctd>Beam/Dataflow 批流一体\u003c\\/td>\u003c\\/tr>\u003c\\/table>\u003cp>\u003cstrong>应试：\u003c\\/strong>GFS/Colossus 是存储；MapReduce/Spark 是计算；BigTable 处理数据组织与管理；Beam 是编程模型而不是存储引擎。\u003c\\/p>\"}, {\"chapter\": \"google\", \"title\": \"GFS 为什么“先问目录，直接去仓库”？\", \"pages\": \"P6\", \"desc\": \"一次记住元数据与真正文件内容的区别。\", \"body\": \"\u003col>\u003cli>客户端询问 Master：文件的块在何处？\u003c\\/li>\u003cli>Master 回答相关 ChunkServer 的位置（元数据）。\u003c\\/li>\u003cli>客户端直接联系 ChunkServer，读取或写入数据。\u003c\\/li>\u003c\\/ol>\u003cp>这样 Master 不会成为每次大文件传输的数据中转站。课件描述 GFS 分块约 \u003cstrong>64MB\u003c\\/strong>，配多副本。\u003cstrong>不要\u003c\\/strong>把这个数和后面 MapReduce 课程的 HDFS 128MB 常见默认值混淆。\u003c\\/p>\"}, {\"chapter\": \"hadoop\", \"title\": \"三大组件：同一个用户操作触发谁？\", \"pages\": \"P14–17\", \"desc\": \"用场景判断，比定义记忆更快。\", \"body\": \"\u003ctable>\u003ctr>\u003cth>问题\u003c\\/th>\u003cth>负责者\u003c\\/th>\u003cth>为什么\u003c\\/th>\u003c\\/tr>\u003ctr>\u003ctd>文件 a.txt 在哪些节点？\u003c\\/td>\u003ctd>NameNode（HDFS）\u003c\\/td>\u003ctd>知道块的位置和文件目录\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>读取 a.txt 的真实字节？\u003c\\/td>\u003ctd>DataNode（HDFS）\u003c\\/td>\u003ctd>真正保存块数据\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>某个 WordCount 如何统计？\u003c\\/td>\u003ctd>MapReduce\u003c\\/td>\u003ctd>执行 Map / Shuffle / Reduce\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>给计算任务分内存、CPU？\u003c\\/td>\u003ctd>YARN\u003c\\/td>\u003ctd>分配和调度计算资源\u003c\\/td>\u003c\\/tr>\u003c\\/table>\u003cp>名字易混：\u003cstrong>NameNode/DataNode 是 HDFS 的存储角色\u003c\\/strong>；\u003cstrong>RM/AM/NM 是 YARN 的资源调度角色\u003c\\/strong>。它们可以共处一台机器，但职责不一样。\u003c\\/p>\"}, {\"chapter\": \"hadoop\", \"title\": \"HDFS 文件读取的典型故事\", \"pages\": \"P15–16\", \"desc\": \"NameNode 不是文件传输的中转站。\", \"body\": \"\u003col>\u003cli>客户端请求打开一个 HDFS 文件。\u003c\\/li>\u003cli>NameNode 告诉客户端对应 Block 的 DataNode 位置。\u003c\\/li>\u003cli>客户端选合适的 DataNode 直接读取。\u003c\\/li>\u003cli>若某节点不可用，尝试可用副本。\u003c\\/li>\u003c\\/ol>\u003cp>\u003cstrong>考题：\u003c\\/strong>“NameNode 直接向客户端传输所有文件数据” → 错。课件着重强调它管命名空间和元数据。\u003c\\/p>\u003cp class=\\\"source-note\\\">以上步骤是基于课件 P15 的架构图展开的教学说明。\u003c\\/p>\"}, {\"chapter\": \"yarn\", \"title\": \"JobTracker 为什么在 1.0 会堵？\", \"pages\": \"P18–21\", \"desc\": \"记住职责堆叠与 slot 的浪费。\", \"body\": \"\u003cp>旧公司只有一个总部岗位 JobTracker，既批预算又亲自跟每个项目进度。问题不只是累，而是出了故障全部项目受影响。\u003c\\/p>\u003ctable>\u003ctr>\u003cth>MapReduce 1.0\u003c\\/th>\u003cth>Hadoop 2.x / YARN\u003c\\/th>\u003c\\/tr>\u003ctr>\u003ctd>JobTracker 管资源、调度、故障\u003c\\/td>\u003ctd>RM 管全局，AM 管单应用\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>TaskTracker 接任务执行\u003c\\/td>\u003ctd>NM 管本机 Container\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>Map slot、Reduce slot 分开\u003c\\/td>\u003ctd>Container 动态划拨资源\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>仅服务 MapReduce 框架\u003c\\/td>\u003ctd>多引擎共享资源\u003c\\/td>\u003c\\/tr>\u003c\\/table>\u003cp>\u003cstrong>易错：\u003c\\/strong>JobTracker 与 ResourceManager 并非只是“改了名称”，而是拆分了职责。\u003c\\/p>\"}, {\"chapter\": \"yarn\", \"title\": \"YARN 七步从头到尾：考试版\", \"pages\": \"P24\", \"desc\": \"点击交互实验后，再用这段正式语言巩固。\", \"body\": \"\u003col>\u003cli>\u003cstrong>提交\u003c\\/strong>：客户端提交应用与资源需求到 RM。\u003c\\/li>\u003cli>\u003cstrong>启动 AM\u003c\\/strong>：RM 找一个 NM，为 AM 提供第一个 Container。\u003c\\/li>\u003cli>\u003cstrong>申请\u003c\\/strong>：AM 注册并向 RM 申请更多 Container。\u003c\\/li>\u003cli>\u003cstrong>分配\u003c\\/strong>：RM 依调度策略分配资源。\u003c\\/li>\u003cli>\u003cstrong>启动\u003c\\/strong>：AM 找对应 NM 启动任务。\u003c\\/li>\u003cli>\u003cstrong>执行/监控\u003c\\/strong>：任务运行、汇报状态。\u003c\\/li>\u003cli>\u003cstrong>完成\u003c\\/strong>：AM 注销，资源释放。\u003c\\/li>\u003c\\/ol>\u003cp>这套七步与下一章 MapReduce 课件 P45 的框架调度流程相互呼应。本课件尤其强调 \u003cstrong>“资源申请→分配→联系 NM 启动”\u003c\\/strong> 的先后顺序。\u003c\\/p>\"}, {\"chapter\": \"yarn\", \"title\": \"一张表彻底分清四个缩写\", \"pages\": \"P21–24\", \"desc\": \"少背长段定义，多问“谁管哪一层”。\", \"body\": \"\u003ctable>\u003ctr>\u003cth>角色\u003c\\/th>\u003cth>控制范围\u003c\\/th>\u003cth>直接做什么\u003c\\/th>\u003c\\/tr>\u003ctr>\u003ctd>ResourceManager\u003c\\/td>\u003ctd>整个集群\u003c\\/td>\u003ctd>全局资源分配、应用接入\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>ApplicationMaster\u003c\\/td>\u003ctd>单个应用\u003c\\/td>\u003ctd>申请资源、协调任务、监控\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>NodeManager\u003c\\/td>\u003ctd>单台工作节点\u003c\\/td>\u003ctd>管理/启动 Container，上报资源\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>Container\u003c\\/td>\u003ctd>一个资源份额\u003c\\/td>\u003ctd>提供 CPU / 内存等给任务运行\u003c\\/td>\u003c\\/tr>\u003c\\/table>\u003cp>特别注意：\u003cstrong>Container 是逻辑资源封装单位\u003c\\/strong>，不是一台真实服务器。\u003c\\/p>\"}, {\"chapter\": \"hbase\", \"title\": \"HBase 表：一行为什么可以有不同字段？\", \"pages\": \"P28–29\", \"desc\": \"看一个真实形状的微型例子。\", \"body\": \"\u003cp>设表包含列族 \u003ccode>info\u003c\\/code> 和 \u003ccode>contact\u003c\\/code>。它们在表模式中统一定义，但各行写入的具体列不同。\u003c\\/p>\u003cpre>RowKey   info:name   info:city   contact:phone   contact:email\\nA00001   张三        上海        13800000000      （未写入）\\nA00002   李四        （未写入）  （未写入）       li@example.com\u003c\\/pre>\u003cp>比传统关系表更容易表示\u003cstrong>稀疏字段\u003c\\/strong>。RowKey 标识行，列族在建表时定义，列限定符可以灵活变化。\u003c\\/p>\u003cp class=\\\"source-note\\\">例子为帮助理解课件模型而新编，并非 PPT 原始数据。\u003c\\/p>\"}, {\"chapter\": \"hbase\", \"title\": \"Region、Store、MemStore、HFile 位置关系\", \"pages\": \"P29–30\", \"desc\": \"极易出“谁包含谁”的选择题。\", \"body\": \"\u003cdiv class=\\\"hierarchy\\\">\u003cdiv>HBase 表\u003c\\/div>\u003cdiv>↳ Region（按 RowKey 范围分片）\u003c\\/div>\u003cdiv>　↳ Store（每个列族对应一个 Store）\u003c\\/div>\u003cdiv>　　 ↳ MemStore：内存中的最近更新\u003c\\/div>\u003cdiv>　　 ↳ StoreFile：磁盘文件，HFile 形式保存于 HDFS\u003c\\/div>\u003c\\/div>\u003cp>\u003cstrong>记忆：\u003c\\/strong>表拆区（Region），区按列族设仓库（Store），仓库先放暂存盒（MemStore），最终保存货架档案（HFile）。\u003c\\/p>\"}, {\"chapter\": \"hbase\", \"title\": \"为什么 WAL 要先写日志？\", \"pages\": \"P32\", \"desc\": \"软件故障时怎样让“已确认的写入”有恢复依据。\", \"body\": \"\u003cp>你刚向 HBase 更新一条数据，可能还在内存 MemStore、尚未生成 HFile。如果这时机器崩溃怎么办？\u003c\\/p>\u003col>\u003cli>先记录 \u003cstrong>WAL\u003c\\/strong>（Write-Ahead Log）。\u003c\\/li>\u003cli>再把更新维护到内存结构 MemStore。\u003c\\/li>\u003cli>之后再 Flush 到 HFile / StoreFile。\u003c\\/li>\u003cli>发生故障后可根据日志回放未落盘操作。\u003c\\/li>\u003c\\/ol>\u003cp>严格记住：\u003cstrong>日志先行，内存更新，持久文件随后生成\u003c\\/strong>。副本机制与 WAL 是不同的保护手段。\u003c\\/p>\"}, {\"chapter\": \"hbase\", \"title\": \"行式、列式、列族：考试怎么判断？\", \"pages\": \"P31–32\", \"desc\": \"课堂讲法与专业精确说法分开记。\", \"body\": \"\u003cp>行式：读取某一行全部字段很方便。按列组织：只分析“全班语文成绩”时，不必读取所有人的电话地址，压缩也有优势。\u003c\\/p>\u003cp>课件用“行式 vs 列式”理解 HBase 的\u003cstrong>列族式存储\u003c\\/strong>，但技术上 HBase 不是面向 OLAP 的纯列式数据库；它按列族组织磁盘文件，RowKey 仍很重要。\u003c\\/p>\u003cp>\u003cstrong>考试按照 PPT：\u003c\\/strong>HBase 列族、稀疏表、对随机按 RowKey 读写友好；别机械推出“任意大聚合比所有列式分析数据库快”。\u003c\\/p>\"}, {\"chapter\": \"ecosystem\", \"title\": \"Hive 与 HBase，放在同一业务里对比\", \"pages\": \"P27–35\", \"desc\": \"同一份销售业务，哪个系统适合哪一步？\", \"body\": \"\u003ctable>\u003ctr>\u003cth>需求\u003c\\/th>\u003cth>选择\u003c\\/th>\u003cth>原因\u003c\\/th>\u003c\\/tr>\u003ctr>\u003ctd>按月统计所有门店营业额\u003c\\/td>\u003ctd>Hive\u003c\\/td>\u003ctd>离线批量统计 + HQL\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>按客户编号迅速读取某人资料\u003c\\/td>\u003ctd>HBase\u003c\\/td>\u003ctd>基于 RowKey 的低延迟访问\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>反复运行迭代式算法\u003c\\/td>\u003ctd>Spark\u003c\\/td>\u003ctd>可复用内存中间结果\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>持续接收日志流\u003c\\/td>\u003ctd>Flume / Kafka\u003c\\/td>\u003ctd>日志采集或消息流入口\u003c\\/td>\u003c\\/tr>\u003c\\/table>\u003cp>\u003cstrong>注意：\u003c\\/strong>Hive 不必永远执行 MapReduce，但 PPT P34 的例子是 HQL → MapReduce。\u003c\\/p>\"}, {\"chapter\": \"ecosystem\", \"title\": \"Hive HQL 执行流水线\", \"pages\": \"P33–35\", \"desc\": \"如果题目问“用户直接写 MapReduce 吗”，回答不是。\", \"body\": \"\u003cpre>用户提交 HQL（SQL-like）\\n        ↓\\nHive 解析语句、生成并优化计划\\n        ↓\\n转换成执行任务（课件：MapReduce）\\n        ↓\\n集群执行计算、读取 HDFS 数据\\n        ↓\\n用户获得查询结果\u003c\\/pre>\u003cp>Hive 的省力之处是\u003cstrong>用 SQL-like 操作描述要什么\u003c\\/strong>，而不是直接编码每一个 Mapper/Reducer。但执行延迟较高，偏离线分析。\u003c\\/p>\"}, {\"chapter\": \"ecosystem\", \"title\": \"八种工具一口气分清\", \"pages\": \"P37–39\", \"desc\": \"按“数据从哪来、怎么计算、怎么管理”背工具。\", \"body\": \"\u003ctable>\u003ctr>\u003cth>功能\u003c\\/th>\u003cth>工具\u003c\\/th>\u003cth>一句话\u003c\\/th>\u003c\\/tr>\u003ctr>\u003ctd>日志采集\u003c\\/td>\u003ctd>Flume\u003c\\/td>\u003ctd>把零散日志运进平台\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>数据库搬运\u003c\\/td>\u003ctd>Sqoop\u003c\\/td>\u003ctd>RDBMS ↔ Hadoop\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>消息通道\u003c\\/td>\u003ctd>Kafka\u003c\\/td>\u003ctd>高吞吐发布订阅\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>流计算\u003c\\/td>\u003ctd>Flink\u003c\\/td>\u003ctd>持续处理实时数据\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>分布式协调\u003c\\/td>\u003ctd>ZooKeeper\u003c\\/td>\u003ctd>配置/命名/锁等\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>集群管理\u003c\\/td>\u003ctd>Ambari\u003c\\/td>\u003ctd>安装、监控和运维\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>作业工作流\u003c\\/td>\u003ctd>Oozie\u003c\\/td>\u003ctd>按依赖安排任务\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>数据分析 / ML\u003c\\/td>\u003ctd>Pig / Mahout\u003c\\/td>\u003ctd>查询脚本 / 机器学习\u003c\\/td>\u003c\\/tr>\u003c\\/table>\"}, {\"chapter\": \"install\", \"title\": \"三种运行模式比较：读数据位置如何不同\", \"pages\": \"P41–42\", \"desc\": \"考试常把本地模式和伪分布式说反。\", \"body\": \"\u003ctable>\u003ctr>\u003cth>模式\u003c\\/th>\u003cth>计算资源\u003c\\/th>\u003cth>文件系统\u003c\\/th>\u003cth>用途\u003c\\/th>\u003c\\/tr>\u003ctr>\u003ctd>单机 Local\u003c\\/td>\u003ctd>本机\u003c\\/td>\u003ctd>本地文件系统\u003c\\/td>\u003ctd>快速开发验证\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>伪分布式\u003c\\/td>\u003ctd>同一台机器模拟集群角色\u003c\\/td>\u003ctd>HDFS\u003c\\/td>\u003ctd>学习 HDFS/各服务交互\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>完全分布式\u003c\\/td>\u003ctd>多台机器\u003c\\/td>\u003ctd>跨机器 HDFS\u003c\\/td>\u003ctd>真实集群运行\u003c\\/td>\u003c\\/tr>\u003c\\/table>\u003cp>在伪分布式下，NameNode 和 DataNode 可能在同一台机器上，\u003cstrong>但两种进程的角色没有合并\u003c\\/strong>。\u003c\\/p>\"}, {\"chapter\": \"install\", \"title\": \"core-site.xml 逐行读懂\", \"pages\": \"P43\", \"desc\": \"课件 XML 原值 + 每个字段的意义。\", \"body\": \"\u003cpre>&lt;configuration&gt;\\n  &lt;property&gt;\\n    &lt;name&gt;hadoop.tmp.dir&lt;/name&gt;\\n    &lt;value&gt;file:/usr/local/hadoop/tmp&lt;/value&gt;\\n  &lt;/property&gt;\\n  &lt;property&gt;\\n    &lt;name&gt;fs.defaultFS&lt;/name&gt;\\n    &lt;value&gt;hdfs://localhost:9000&lt;/value&gt;\\n  &lt;/property&gt;\\n&lt;/configuration&gt;\u003c\\/pre>\u003cp>\u003ccode>configuration\u003c\\/code> 包含配置项；每个 \u003ccode>property\u003c\\/code> 是一组设置；\u003ccode>name\u003c\\/code> 为属性名；\u003ccode>value\u003c\\/code> 为属性值。\u003c\\/p>\u003cp>\u003cstrong>hadoop.tmp.dir\u003c\\/strong> 是临时文件目录；\u003cstrong>fs.defaultFS\u003c\\/strong> 指默认访问哪个文件系统。课件用 \u003ccode>localhost:9000\u003c\\/code> 演示单节点服务地址，真实环境应查看配置。\u003c\\/p>\"}, {\"chapter\": \"install\", \"title\": \"hdfs-site.xml 逐行读懂\", \"pages\": \"P44\", \"desc\": \"副本数 + NN 元数据位置 + DN 数据位置。\", \"body\": \"\u003cpre>&lt;configuration&gt;\\n  &lt;property&gt;\\n    &lt;name&gt;dfs.replication&lt;/name&gt;\\n    &lt;value&gt;1&lt;/value&gt;\\n  &lt;/property&gt;\\n  &lt;property&gt;\\n    &lt;name&gt;dfs.namenode.name.dir&lt;/name&gt;\\n    &lt;value&gt;file:/usr/local/hadoop/tmp/dfs/name&lt;/value&gt;\\n  &lt;/property&gt;\\n  &lt;property&gt;\\n    &lt;name&gt;dfs.datanode.data.dir&lt;/name&gt;\\n    &lt;value&gt;file:/usr/local/hadoop/tmp/dfs/data&lt;/value&gt;\\n  &lt;/property&gt;\\n&lt;/configuration&gt;\u003c\\/pre>\u003cp>伪分布式一台机器，所以例子设副本数 \u003cstrong>1\u003c\\/strong>；\u003ccode>namenode.name.dir\u003c\\/code> 存元数据（fsimage 等）；\u003ccode>datanode.data.dir\u003c\\/code> 存实际 Block。\u003c\\/p>\u003cp>\u003cstrong>易错：\u003c\\/strong>设置 1 副本不会自动具备多副本抗故障能力。\u003c\\/p>\"}, {\"chapter\": \"install\", \"title\": \"安装、初始化和 HDFS 命令一条条解释\", \"pages\": \"P41–45（补充实践）\", \"desc\": \"课件给出 XML，下面补充一套常见演示命令，便于真正操作。\", \"body\": \"\u003cp>\u003cstrong>仅适用于全新、无重要数据的练习环境。\u003c\\/strong> 命令不是 PPT 的逐字原文，而是基于其配置项补充的最小验证步骤；不同版本可能需要调整路径或 YARN 配置。\u003c\\/p>\u003cpre>java -version\\nhadoop version\\nmkdir -p /usr/local/hadoop/tmp/dfs/name\\nmkdir -p /usr/local/hadoop/tmp/dfs/data\\nhdfs namenode -format\\nstart-dfs.sh\\njps\\nhdfs dfs -mkdir -p /user/$USER/input\\nprintf 'hello hadoop\\n' &gt; hello.txt\\nhdfs dfs -put -f hello.txt /user/$USER/input/\\nhdfs dfs -ls /user/$USER/input\\nhdfs dfs -cat /user/$USER/input/hello.txt\u003c\\/pre>\u003ctable>\u003ctr>\u003cth>命令\u003c\\/th>\u003cth>为什么要做\u003c\\/th>\u003c\\/tr>\u003ctr>\u003ctd>java -version / hadoop version\u003c\\/td>\u003ctd>检查环境已经安装、命令能调用\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>mkdir -p\u003c\\/td>\u003ctd>创建配置中使用的本地目录\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>hdfs namenode -format\u003c\\/td>\u003ctd>只对新集群初始化 HDFS 元数据\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>start-dfs.sh / jps\u003c\\/td>\u003ctd>启动并检查 Java 守护进程\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>hdfs dfs -put\u003c\\/td>\u003ctd>本地文件上传到 HDFS\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>hdfs dfs -ls / -cat\u003c\\/td>\u003ctd>列目录与读取文件内容\u003c\\/td>\u003c\\/tr>\u003c\\/table>\u003cp>\u003cstrong>JAR 与本章：\u003c\\/strong>本 PPT 主要讲 HDFS 配置和 Linux，不包含完整 \u003ccode>hadoop jar\u003c\\/code> 提交练习；它在后续 MapReduce 编程章节详细使用。JAR 是提交已打包 Java 程序或 Hadoop Streaming 工具的入口，不要误写成“安装 Hadoop 必须每次执行的命令”。\u003c\\/p>\"}, {\"chapter\": \"linux\", \"title\": \"Linux 文件目录：考点地图\", \"pages\": \"P49–53\", \"desc\": \"看到路径，就知道是家目录、配置还是设备。\", \"body\": \"\u003ctable>\u003ctr>\u003cth>目录\u003c\\/th>\u003cth>通常用途\u003c\\/th>\u003cth>记忆\u003c\\/th>\u003c\\/tr>\u003ctr>\u003ctd>/\u003c\\/td>\u003ctd>整个文件系统的根\u003c\\/td>\u003ctd>总入口\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>/root\u003c\\/td>\u003ctd>root 用户的家目录\u003c\\/td>\u003ctd>管理员办公室\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>/home\u003c\\/td>\u003ctd>普通用户家目录\u003c\\/td>\u003ctd>员工宿舍区\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>/etc\u003c\\/td>\u003ctd>系统配置\u003c\\/td>\u003ctd>规章制度\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>/tmp\u003c\\/td>\u003ctd>临时数据\u003c\\/td>\u003ctd>临时桌面\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>/var/log\u003c\\/td>\u003ctd>系统日志\u003c\\/td>\u003ctd>工作记录\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>/dev\u003c\\/td>\u003ctd>设备文件\u003c\\/td>\u003ctd>硬件入口\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>/opt\u003c\\/td>\u003ctd>第三方安装\u003c\\/td>\u003ctd>额外软件区\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>/usr\u003c\\/td>\u003ctd>用户程序工具资源\u003c\\/td>\u003ctd>应用程序与共享资源\u003c\\/td>\u003c\\/tr>\u003c\\/table>\"}, {\"chapter\": \"linux\", \"title\": \"/etc/passwd 一行字段怎么看\", \"pages\": \"P53\", \"desc\": \"熟悉冒号分隔，不把 x 误解成真实密码。\", \"body\": \"\u003cpre>alice:x:1001:1001:Alice:/home/alice:/bin/bash\\n  ①   ② ③    ④     ⑤      ⑥         ⑦\u003c\\/pre>\u003cp>①用户名 ②密码占位标记（通常为 x）③UID ④主组 GID ⑤备注 ⑥家目录 ⑦登录 Shell。\u003cstrong>/etc/group\u003c\\/strong> 记录组相关资料。\u003c\\/p>\u003cp class=\\\"source-note\\\">字段说明依据 P53，示例账户是为讲解虚构的。\u003c\\/p>\"}, {\"chapter\": \"linux\", \"title\": \"chmod 为什么 755？亲手算一遍\", \"pages\": \"P55–58\", \"desc\": \"数位是三组权重相加，不是 7=读、5=写。\", \"body\": \"\u003cp>每组三个权限按权重 \u003cstrong>r=4、w=2、x=1\u003c\\/strong> 相加。\u003c\\/p>\u003ctable>\u003ctr>\u003cth>数字\u003c\\/th>\u003cth>计算\u003c\\/th>\u003cth>符号\u003c\\/th>\u003c\\/tr>\u003ctr>\u003ctd>7\u003c\\/td>\u003ctd>4+2+1\u003c\\/td>\u003ctd>rwx\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>6\u003c\\/td>\u003ctd>4+2\u003c\\/td>\u003ctd>rw-\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>5\u003c\\/td>\u003ctd>4+1\u003c\\/td>\u003ctd>r-x\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>4\u003c\\/td>\u003ctd>4\u003c\\/td>\u003ctd>r--\u003c\\/td>\u003c\\/tr>\u003ctr>\u003ctd>0\u003c\\/td>\u003ctd>0\u003c\\/td>\u003ctd>---\u003c\\/td>\u003c\\/tr>\u003c\\/table>\u003cp>\u003ccode>chmod 755 script.sh\u003c\\/code> → 拥有者 rwx、组 r-x、其他 r-x。\u003ccode>chmod 644 report.txt\u003c\\/code> → 拥有者 rw-、组 r--、其他 r--。\u003c\\/p>\u003cp>\u003cstrong>提醒：\u003c\\/strong>对目录来说 x 是“可遍历/进入”，不应照搬成“启动一个目录程序”。\u003c\\/p>\"}, {\"chapter\": \"linux\", \"title\": \"Linux 命令从输入到输出：五个可模仿例子\", \"pages\": \"P60–64\", \"desc\": \"把符号讲明白，再逐条操作。\", \"body\": \"\u003cpre>pwd                         # 查看当前工作目录\\nls -lR /home                 # 递归列出详细信息\\nmkdir -p test2/test22       # 一次创建多层目录\\ncat /etc/passwd | wc -l     # 把内容交给 wc 统计行数\\ngrep root &lt; /etc/passwd     # 输入从文件而不是键盘来\\nprintf 'first\\n' &gt; a.txt   # 覆盖写文件\\nprintf 'second\\n' &gt;&gt; a.txt # 追加写文件\\ncat a.txt                   # 显示两行\u003c\\/pre>\u003cp>\u003cstrong>拆解：\u003c\\/strong>\u003ccode>|\u003c\\/code> 把左边标准输出接到右边标准输入；\u003ccode>&gt;\u003c\\/code> 覆盖；\u003ccode>&gt;&gt;\u003c\\/code> 追加；\u003ccode>&lt;\u003c\\/code> 指定输入；\u003ccode>&amp;\u003c\\/code> 放到后台。\u003c\\/p>\u003cp>\u003cstrong>安全：\u003c\\/strong>课件的 \u003ccode>rm -R test\u003c\\/code> 是递归删除，不建议不看路径就运行；\u003ccode>rm -rf\u003c\\/code> 更需要谨慎。\u003c\\/p>\"}, {\"chapter\": \"linux\", \"title\": \"ls -l 与 chmod 的真实关系\", \"pages\": \"P55–58\", \"desc\": \"看一个输出，知道哪部分是权限。\", \"body\": \"\u003cpre>$ ls -l hosts\\n-rw-r--r-- 1 user group 158 Oct 26 09:00 hosts\\n└─────────┘\\n 文件类型与三组 rwx\u003c\\/pre>\u003cp>第 1 个字符 \u003ccode>-\u003c\\/code> 表示普通文件，后面分三组三字符：\u003ccode>rw-\u003c\\/code>（u）、\u003ccode>r--\u003c\\/code>（g）、\u003ccode>r--\u003c\\/code>（o）。所以是 \u003cstrong>644\u003c\\/strong>。\u003c\\/p>\u003cp>运行 \u003ccode>chmod u+x hosts\u003c\\/code> 后，变成 \u003ccode>-rwxr--r--\u003c\\/code>；如果运行 \u003ccode>chmod 755 hosts\u003c\\/code>，三组一次设置为 \u003ccode>rwx / r-x / r-x\u003c\\/code>。\u003c\\/p>\"}], \"quiz\": [{\"chapter\": \"google\", \"question\": \"Google 最初面临的两类核心大数据问题是？\", \"opts\": [\"存储与计算\", \"只需增加屏幕\", \"只有安全\", \"只有数据可视化\"], \"answer\": 0, \"why\": \"课件 P4 明确区分海量数据存储与计算。\"}, {\"chapter\": \"google\", \"question\": \"GFS 中 Master 主要保存什么？\", \"opts\": [\"元数据\", \"每次都传输所有文件内容\", \"Reduce 输出\", \"Java 代码 me、Sqoop、Flink、生态工具\", \"ecosystem\"], [\"P40–45\", \"部署模式、core-site.xml、hdfs-site.xml、实验配置\", \"install\"], [\"P46–53\", \"Linux 环境、组成、目录树、用户与组\", \"linux\"], [\"P54–58\", \"Linux 文件权限、chmod 符号与 644/755\", \"linux\"], [\"P59–65\", \"基本命令、管道/重定向、作业与实验提示\", \"linux\"]], \"steps\": [[\"Client\", \"客户提交订单\", \"向 RM 提交应用所需代码、输入和基本资源信息。\", \"先提交，RM 才能安排。\"], [\"RM + NM\", \"总部给项目经理工位\", \"RM 在某节点分配首个 Container，由 NM 启动 ApplicationMaster。\", \"AM 也占 Container。\"], [\"AM → RM\", \"项目经理申请工位\", \"AM 注册后向 RM 申请执行任务所需的额外 Container。\", \"AM 负责申请，不亲自造资源。\"], [\"RM\", \"总部统一分配\", \"根据集群状况与调度策略分配 Container。\", \"RM 负责全局资源。\"], [\"AM → NM\", \"现场主管叫工人开工\", \"AM 联系对应 NM，在分配的 Container 内启动 Task。\", \"NM 管本机容器与启动。\"], [\"Task + AM\", \"施工并持续汇报\", \"任务运行；AM 跟踪执行状态，发现失败可协调重试。\", \"监控是 AM 的职责之一。\"], [\"AM → RM\", \"完工注销释放工位\", \"任务结束，AM 退出并向 RM 注销，资源回收。\", \"Container 会释放，不永远占用。\"]], \"roles\": [[\"RM\", \"总调度中心\", \"全局 CPU/内存资源分配，决定给谁工位\", \"不具体执行每个 MapTask\"], [\"AM\", \"单个项目经理\", \"申请资源、协调/监控该应用任务\", \"不是集群唯一 AM\"], [\"NM\", \"现场主管\", \"管理本机资源，启动、停止容器\", \"不是 NameNode\"], [\"Container\", \"工位 + 资源配额\", \"封装 CPU/内存等供任务或 AM 运行\", \"不是一台独立机器\"]]}\u003c/script>\u003cscript>'use strict';\nconst DATA=JSON.parse(document.getElementById('course-data').textContent);\nconst $=id=>document.getElementById(id);\nconst esc=s=>String(s).replace(/[&\u003c>\"']/g,x=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[x]));\nconst read=(key,fall)=>{try{return JSON.parse(localStorage.getItem(key))??fall}catch{return fall}};\nconst save=(key,obj)=>{try{localStorage.setItem(key,JSON.stringify(obj))}catch{}};\nlet learned=new Set(read('hadoop-course-learned',[]));\nlet focused=false,onlySearch='';\nlet yarnStep=0,yarnRole=0,hdfsStep=0;\nlet quizPool=[],quizIndex=0,quizAnswers={},quizCorrect=0;\nlet currChapter='google',currView='home';\nconst chapters=DATA.chapters.map(([id,num,title,pages,tag])=>({id,num,title,pages,tag}));\nconst byId=id=>chapters.find(c=>c.id===id);\nconst counts=()=>[DATA.cards.length,DATA.deep.length,DATA.quiz.length];\nfunction progress(){const n=DATA.cards.filter(c=>learned.has(c.id)).length;$('learned').textContent=`${n} / ${DATA.cards.length}`;$('progbar').style.width=`${(n/DATA.cards.length)*100}%`}\nfunction navigation(){ $('chapter-nav').innerHTML=chapters.map(c=>`\u003ca class=\"navlink\" href=\"#chapter-${c.id}\" data-branch=\"${c.id}\">\u003cspan class=\"navnum\">${c.num}\u003c/span>${esc(c.title)}\u003c/a>`).join(''); $('chapter-shortcuts').innerHTML=chapters.map(c=>`\u003ca class=\"tile\" href=\"#chapter-${c.id}\">\u003csmall>${c.num} / ${esc(c.pages)}\u003c/small>\u003ch3>${esc(c.title)}\u003c/h3>\u003cp>${esc(c.tag)} →\u003c/p>\u003c/a>`).join(''); $('quiz-filter').innerHTML=`\u003coption value=\"all\">综合自测 · 全部章节\u003c/option>`+chapters.map(c=>`\u003coption value=\"${c.id}\">${esc(c.title)}\u003c/option>`).join(''); $('card-count').textContent=DATA.cards.length;$('deep-count').textContent=DATA.deep.length;$('quiz-count').textContent=DATA.quiz.length; progress();}\nfunction coverage(){ $('coverage-table').innerHTML=DATA.coverage.map(([pages,topic,c])=>`\u003ctr>\u003ctd>${esc(pages)}\u003c/td>\u003ctd>${esc(topic)}\u003c/td>\u003ctd>\u003ca href=\"#chapter-${c}\">进入章节 ↗\u003c/a>\u003c/td>\u003c/tr>`).join(''); }\nfunction renderChapter(c){currChapter=c.id;\n $('chapter-header').innerHTML=`\u003cdiv class=\"chapter-meta\">${esc(c.num)} / 07 · 对应课件 ${esc(c.pages)} · ${DATA.cards.filter(x=>x.chapter===c.id).length} 个要点\u003c/div>\u003ch1>${esc(c.title)}\u003c/h1>\u003cp>${esc(c.tag)}。先读卡片，再按需展开精讲或做互动练习。\u003c/p>`;\n $('chapter-count').textContent=`本章：${DATA.cards.filter(x=>x.chapter===c.id&&learned.has(x.id)).length} / ${DATA.cards.filter(x=>x.chapter===c.id).length} 已掌握`;\n const cards=DATA.cards.filter(x=>x.chapter===c.id).map(x=>`\u003carticle class=\"card\" data-id=\"${x.id}\" data-search=\"${esc([x.title,x.pages,x.hook,x.analogy,x.core,x.trap,x.expand].join(' ').toLowerCase())}\">\u003cdiv class=\"card-head\">\u003cspan class=\"page-tag\">PDF ${esc(x.pages)}\u003c/span>\u003cbutton type=\"button\" class=\"mark ${learned.has(x.id)?'done':''}\" data-check=\"${x.id}\" aria-pressed=\"${learned.has(x.id)}\">${learned.has(x.id)?'✓ 已掌握':'○ 标为掌握'}\u003c/button>\u003c/div>\u003ch3>${esc(x.title)}\u003c/h3>\u003cp class=\"hook\">${esc(x.hook)}\u003c/p>\u003cdiv class=\"analogy\">\u003cb>💡 生动类比\u003c/b>\u003cp>${esc(x.analogy)}\u003c/p>\u003c/div>\u003cdiv class=\"definition\">\u003cb>◎ 考试准确表述\u003c/b>\u003cp>${esc(x.core)}\u003c/p>\u003c/div>\u003cdetails>\u003csummary>查看易错点与知识拓展\u003c/summary>\u003cp class=\"warning\">\u003cb>易错：\u003c/b>${esc(x.trap)}\u003c/p>\u003cp>\u003cb>再讲一句：\u003c/b>${esc(x.expand)}\u003c/p>\u003c/details>\u003c/article>`).join('');\n $('cards').innerHTML=cards;\n const deeps=DATA.deep.filter(x=>x.chapter===c.id).map(x=>`\u003cdetails class=\"deep-item\">\u003csummary>\u003cstrong>${esc(x.title)}\u003c/strong>\u003csmall>PDF ${esc(x.pages)}\u003c/small>\u003cspan>${esc(x.desc)}\u003c/span>\u003c/summary>\u003cdiv class=\"deep-body\">${x.body}\u003c/div>\u003c/details>`).join('');\n $('deep-modules').innerHTML=deeps;\n document.querySelectorAll('[data-check]').forEach(b=>b.addEventListener('click',()=>{if(learned.has(b.dataset.check))learned.delete(b.dataset.check);else learned.add(b.dataset.check);save('hadoop-course-learned',[...learned]);b.classList.toggle('done',learned.has(b.dataset.check));b.textContent=learned.has(b.dataset.check)?'✓ 已掌握':'○ 标为掌握';b.setAttribute('aria-pressed',learned.has(b.dataset.check));progress();$('chapter-count').textContent=`本章：${DATA.cards.filter(x=>x.chapter===c.id&&learned.has(x.id)).length} / ${DATA.cards.filter(x=>x.chapter===c.id).length} 已掌握`;applyFilter();}));\n ['yarn','hdfs','hbase','linux'].forEach(name=>{$(`lab-${name}`).hidden=!((name==='yarn'&&c.id==='yarn')||(name==='hdfs'&&c.id==='hadoop')||(name==='hbase'&&c.id==='hbase')||(name==='linux'&&c.id==='linux'))});\n const i=chapters.indexOf(c);$('prev-chapter').disabled=i===0;$('next-chapter').disabled=i===chapters.length-1;$('prev-chapter').onclick=()=>location.hash='#chapter-'+chapters[i-1].id;$('next-chapter').onclick=()=>location.hash='#chapter-'+chapters[i+1].id; $('search').value='';onlySearch='';applyFilter();}\nfunction applyFilter(){const query=$('search').value.trim().toLowerCase();let shown=0;document.querySelectorAll('.card').forEach(card=>{const show=(!focused||!learned.has(card.dataset.id))&&(!query||card.dataset.search.includes(query));card.hidden=!show;if(show)shown++;});$('visible').textContent=`显示 ${shown} / ${DATA.cards.filter(c=>c.chapter===currChapter).length} 张卡片`;$('noresult').hidden=shown!==0;}\nfunction route(){const hash=decodeURIComponent(location.hash.replace('#',''))||'home';document.querySelectorAll('.view').forEach(x=>x.hidden=true);let routeTitle='学习首页',view='home',scrollTo=null;\n if(hash.startsWith('chapter-')&&byId(hash.slice(8))){currChapter=hash.slice(8);view='chapter';routeTitle=byId(currChapter).title;renderChapter(byId(currChapter));}\n else if(hash==='exam'){view='exam';routeTitle='章节自测';}\n else if(hash==='cheats'){view='cheats';routeTitle='考前速记';}\n else if(hash==='coverage'){view='coverage';routeTitle='课件覆盖检查';}\n else if(hash.startsWith('lab-')){const dest={ 'lab-yarn':'yarn','lab-hdfs':'hadoop','lab-hbase':'hbase','lab-linux':'linux'}[hash];if(dest){view='chapter';currChapter=dest;routeTitle=byId(dest).title;renderChapter(byId(dest));scrollTo=hash;}}\n currView=view;$('view-'+view).hidden=false;$('route-label').textContent='HADOOP / '+routeTitle;\n document.querySelectorAll('.navlink').forEach(a=>{a.classList.toggle('active',a.getAttribute('href')==='#'+hash||(view==='chapter'&&a.dataset.branch===currChapter))});\n if(window.innerWidth\u003c=800){document.body.classList.remove('mobile-open');}\n setTimeout(()=>{if(scrollTo){document.getElementById(scrollTo)?.scrollIntoView({behavior:'smooth',block:'start'});}else window.scrollTo({top:0,behavior:'instant'});},20);\n}\nfunction setupTop(){const menu=$('menu');menu.onclick=()=>{if(window.innerWidth\u003c=800){document.body.classList.toggle('mobile-open')}else{document.body.classList.toggle('sidebar-collapsed');save('hadoop-sidebar-closed',document.body.classList.contains('sidebar-collapsed'))}menu.setAttribute('aria-expanded',!document.body.classList.contains('sidebar-collapsed'))};$('backdrop').onclick=()=>document.body.classList.remove('mobile-open');if(window.innerWidth>800&&read('hadoop-sidebar-closed',false))document.body.classList.add('sidebar-collapsed');$('theme').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;save('hadoop-theme',next)};document.documentElement.dataset.theme=read('hadoop-theme','light');$('focus').onclick=()=>{focused=!focused;$('focus').textContent=focused?'显示全部':'只看未掌握';$('focus').style.color=focused?'var(--blue)':'';applyFilter()};$('search').oninput=applyFilter; window.addEventListener('hashchange',route);window.addEventListener('resize',()=>{if(window.innerWidth>800)document.body.classList.remove('mobile-open')});}\nfunction showYarn(){const step=DATA.steps[yarnStep];$('yarn-dots').innerHTML=DATA.steps.map((s,i)=>`\u003cbutton class=\"dot ${i===yarnStep?'active':''}\" type=\"button\" aria-label=\"步骤${i+1}\" data-ystep=\"${i}\">${i+1}\u003c/button>`).join('');$('yarn-step').innerHTML=`\u003cdiv class=\"chapter-meta\">第 ${yarnStep+1} / 7 步 · ${esc(step[0])}\u003c/div>\u003cstrong>${esc(step[1])}\u003c/strong>\u003cp>🎬 故事：${esc(step[2])}\u003c/p>\u003cp class=\"actual\">\u003cb>应试记忆：\u003c/b>${esc(step[3])}\u003c/p>`;$('yarn-prev').disabled=yarnStep===0;$('yarn-next').textContent=yarnStep===6?'重新学习 ↻':'下一步 →';document.querySelectorAll('[data-ystep]').forEach(b=>b.onclick=()=>{yarnStep=+b.dataset.ystep;showYarn()});}\nfunction showRoles(){$('role-tabs').innerHTML=DATA.roles.map((r,i)=>`\u003cbutton class=\"tab ${i===yarnRole?'active':''}\" data-r=\"${i}\">${esc(r[0])}\u003c/button>`).join(
