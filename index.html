e':\"printf 'hello\\\\n' > a.txt\",'append':\"printf 'world\\\\n' >> a.txt\",'input':'grep root \u003c /etc/passwd','background':'sleep 5 &','chmod':'chmod 644 hosts', 'find':'find /home -name \"*.txt\"', 'sort':'sort file.txt','cat':'cat a.txt'};\nconst cmdDesc={ls:'-l 列权限/大小；-R 递归扫描目录。',mkdir:'-p 遇到不存在的中间目录会自动创建。',rm:'-R 递归删目录及内容，危险，先确认路径。',pipe:'| 把 cat 的输出传给 wc；-l 只统计行数。',overwrite:'> 用新内容覆盖原文件。',append:'>> 将内容加在文件末尾，不清空旧内容。',input:'\u003c 把文件内容作为 grep 的标准输入。',background:'& 让命令在后台运行，不等同进程永不退出。',chmod:'6=rw-,4=r--,4=r--；修改三组权限。',find:'-name 按文件名模式匹配查找。',sort:'文本逐行排序，不会统计每个 key。',cat:'显示文件内容。'};\nfunction showLinux(){const k=$('cmd-type').value;$('cmd-example').textContent=cmdSamples[k];$('cmd-explain').textContent=cmdDesc[k];}\nfunction initLabs(){showRoles();showYarn();showHdfs();showHbase();showLinux();$('yarn-prev').onclick=()=>{yarnStep=Math.max(0,yarnStep-1);showYarn()};$('yarn-next').onclick=()=>{yarnStep=(yarnStep+1)%DATA.steps.length;showYarn()};$('hdfs-next').onclick=()=>{hdfsStep=(hdfsStep+1)%4;showHdfs()};$('hbase-mode').onchange=showHbase;$('cmd-type').onchange=showLinux;document.querySelectorAll('[data-perm]').forEach(input=>input.onchange=perms);$('perm-presets').querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{const code=b.dataset.preset;['u','g','o'].forEach((g,i)=>[['r',4],['w',2],['x',1]].forEach(([p,n])=>{document.querySelector(`[data-perm=\"${g}${p}\"]`).checked=(+code[i]&n)!==0}));perms()});perms();}\nfunction permuted(q,i){const offsets=[(i*3+1)%4,(i*3+2)%4,(i*3+3)%4,(i*3)%4];const options=offsets.map(k=>q.opts[k]);return {...q,opts:options,answer:offsets.indexOf(q.answer)};}\nfunction startQuiz(){const chapter=$('quiz-filter').value;const original=DATA.quiz.filter(x=>chapter==='all'||x.chapter===chapter);quizPool=original.map((x,i)=>permuted(x,i));quizIndex=0;quizAnswers={};quizCorrect=0;showQuiz();}\nfunction showQuiz(){if(!quizPool.length){$('quiz-here').innerHTML='\u003cp>题库为空，请选择其他章节。\u003c/p>';return}const q=quizPool[quizIndex];const key=quizIndex, chosen=quizAnswers[key];$('quiz-here').innerHTML=`\u003cdiv class=\"quiztop\">\u003cspan class=\"chapter-meta\">QUESTION ${quizIndex+1} / ${quizPool.length} · ${esc(byId(q.chapter)?.title||'综合')}\u003c/span>\u003cspan class=\"count\" id=\"quiz-score\">当前答对 ${Object.keys(quizAnswers).filter(k=>quizAnswers[k]===quizPool[+k].answer).length} 题\u003c/span>\u003c/div>\u003ch2 class=\"quiztitle\">${esc(q.question)}\u003c/h2>\u003cdiv class=\"exam-options\">${q.opts.map((s,i)=>`\u003cbutton class=\"option ${chosen!==undefined?(i===q.answer?'good':i===chosen?'bad':''):''}\" data-answer=\"${i}\" ${chosen!==undefined?'disabled':''}>\u003cb>${'ABCD'[i]}.\u003c/b> ${esc(s)}\u003c/button>`).join('')}\u003c/div>\u003cdiv id=\"answer-feedback\">${chosen===undefined?'':`\u003cdiv class=\"feedback\">\u003cstrong>${chosen===q.answer?'✓ 回答正确':'× 回答错误，正确选项为 '+ 'ABCD'[q.answer]}\u003c/strong>\u003cp>${esc(q.why)}\u003c/p>\u003c/div>`}\u003c/div>\u003cdiv class=\"quiznav\">\u003cbutton class=\"outline small\" id=\"q-prev\" ${quizIndex===0?'disabled':''}>← 上一题\u003c/button>\u003cbutton class=\"primary small\" id=\"q-next\">${quizIndex===quizPool.length-1?'重新开始 ↻':'下一题 →'}\u003c/button>\u003c/div>`;\n $('quiz-here').querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{quizAnswers[quizIndex]=+b.dataset.answer;showQuiz()});$('q-prev').onclick=()=>{quizIndex=Math.max(0,quizIndex-1);showQuiz()};$('q-next').onclick=()=>{if(quizIndex===quizPool.length-1)startQuiz();else{quizIndex++;showQuiz()}};\n}\nfunction cheats(){const cs=[\n ['必背三大支柱','HDFS 负责存；MapReduce 负责算；YARN 负责分配资源。','P14'],\n ['存储角色','NameNode 管元数据/目录；DataNode 保存实际 Block。','P15'],\n ['HDFS 2.0 改进','HA = 高可用 Active/Standby；Federation = 多命名空间。','P16'],\n ['1.0 与 YARN','JobTracker/TaskTracker → RM/AM/NM/Container；固定 slot → 动态 Container。','P18–25'],\n ['YARN 四角色','RM 管全局；AM 管一个应用；NM 管本机；Container 是 CPU/内存资源封装。','P21–24'],\n ['HBase 层级','RowKey → Region → 每列族一个 Store → MemStore + StoreFile/HFile。','P28–30'],\n ['WAL 与 MemStore','先写 WAL 日志，再维护内存 MemStore，之后刷盘到 HFile。','P32'],\n ['Hive / HBase / Spark','Hive 离线 HQL；HBase 低延迟随机访问；Spark 复用内存加速迭代。','P27–36'],\n ['工具匹配','Flume 采日志；Sqoop 搬数据库；Flink 流计算；ZooKeeper 协调；Oozie 工作流；Ambari 运维。','P37–39'],\n ['配置文件','core-site.xml: tmp.dir / fs.defaultFS；hdfs-site.xml: replication / namenode.name.dir / datanode.data.dir。','P43–44'],\n ['Linux 目录','/ 是文件系统根，/root 是管理员家，/etc 配置，/home 普通用户，/var/log 日志。','P52'],\n ['权限和符号','r=4,w=2,x=1；644=rw-r--r--；755=rwxr-xr-x；| 管道，> 覆盖，>> 追加，\u003c 输入。','P55–64']];\n $('cheats-grid').innerHTML=cs.map(([title,text,p])=>`\u003carticle class=\"cheat\">\u003cspan class=\"page-tag\">${p}\u003c/span>\u003ch3>${esc(title)}\u003c/h3>\u003cp>${esc(text)}\u003c/p>\u003c/article>`).join('');}\nfunction init(){navigation();coverage();cheats();setupTop();initLabs();$('quiz-filter').onchange=startQuiz;$('quiz-restart').onclick=startQuiz;startQuiz();route();}\ndocument.addEventListener('DOMContentLoaded',init);\n\u003c/script>\n\u003c/body>\u003c/html>\n","\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cmeta name=\"theme-color\" content=\"#f7f9fc\">\n\u003cmeta name=\"description\" content=\"HDFS 77页课件，一章通：快递仓库类比、可交互模拟、按章翻页、完整考点、即时测验。单文件离线可用。\">\n\u003ctitle>HDFS · 一章通 | 交互式自学\u003c/title>\n\u003cstyle>\n:root{--bg:#f7f9fc;--surface:#fff;--sidebar:#fdfefe;--text:#192638;--muted:#64748b;--soft:#8592a3;--line:#e4eaf1;--blue:#255cc9;--blue-soft:#eaf1ff;--purple:#7b55be;--purple-soft:#f2ecff;--green:#167c65;--green-soft:#e7f7f2;--orange:#a15b18;--orange-soft:#fff4e8;--shadow:0 7px 32px rgba(40,64,106,.055);--radius:17px;--sans:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}\nhtml[data-theme=dark]{--bg:#101724;--surface:#172335;--sidebar:#142033;--text:#ebf1fa;--muted:#a1aec1;--soft:#8d9ba t-size:42px}.hero p{font-size:16px}.hero-stats{gap:27px}.home-card-grid{grid-template-columns:1fr 1fr}.two-lanes,.lessons-grid{grid-template-columns:1fr}.chapter-head{padding-top:28px}.chapter-line h2{font-size:28px}.chapter-no{font-size:27px}.lesson{padding:19px 19px}.lab-box,.quiz-box,.exam-box{padding:17px}.lab-grid{grid-template-columns:1fr}.nodes{grid-template-columns:repeat(2,1fr)}.quiz-options{grid-template-columns:1fr}.coverage th,.coverage td{padding:8px}.screen.active{animation:none}}\n@media(max-width:490px){.home-card-grid{grid-template-columns:1fr}.page-tag{font-size:10px;padding:4px 8px}.chapter-line{gap:8px}.chapter-line h2{font-size:24px}.step-tape{gap:4px}.step-tape button{padding:8px 0}.hero h1{font-size:38px}.hero-stats{gap:19px}.stat b{font-size:23px}}\n@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"app-shell\">\n\u003caside class=\"sidebar\" id=\"sidebar\" aria-label=\"课程导航\">\u003cdiv class=\"brand\">\u003cdiv class=\"brand-icon\">H·D\u003c/div>\u003cdiv class=\"brand-txt\">HDFS \u003csmall>一章通 · 77 页翻页版\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"side-intro\">9 个知识板块 · 可按顺序学或随时跳\u003cbr>用快递仓库的故事记住分布式存储。\u003c/div>\u003cnav class=\"side-nav\" aria-label=\"知识目录\">\u003cbutton class=\"nav-link\" data-go=\"home\">\u003cspan class=\"nav-num\">⌂\u003c/span> 学习首页\u003c/button>\u003cp class=\"nav-overline\">按章节学习 · 01—09\u003c/p>\u003cdiv id=\"chapter-nav\">\u003c/div>\u003cp class=\"nav-overline\">专项练习\u003c/p>\u003cbutton class=\"nav-link\" data-go=\"exam\">\u003cspan class=\"nav-num\">✓\u003c/span> 考前综合测验\u003c/button>\u003cbutton class=\"nav-link\" data-go=\"cheats\">\u003cspan class=\"nav-num\">≡\u003c/span> 全章速记 · 原课件对照\u003c/button>\u003c/nav>\u003cdiv class=\"side-footer\">\u003cdiv class=\"progress-info\">\u003cspan>卡片已掌握\u003c/span>\u003cstrong id=\"progress-count\">0 / 0\u003c/strong>\u003c/div>\u003cdiv class=\"track\">\u003cdiv id=\"progress-bar\">\u003c/div>\u003c/div>\u003csmall>勾选后自动保存在当前浏览器\u003c/small>\u003c/div>\u003c/aside>\n\u003cdiv class=\"page-frame\">\u003cheader class=\"topbar\">\u003cbutton class=\"icon-button sidebar-toggle\" id=\"menu-btn\" type=\"button\" aria-label=\"打开或收起目录\" aria-expanded=\"true\">☰ \u003cspan id=\"menu-text\">收起目录\u003c/span>\u003c/button>\u003cdiv class=\"crumb\" id=\"crumb\">HDFS \u003cb>/\u003c/b> 学习首页\u003c/div>\u003cdiv class=\"top-actions\">\u003cbutton class=\"quiet\" type=\"button\" id=\"focus-btn\">专注未掌握\u003c/button>\u003cbutton class=\"icon-button\" type=\"button\" id=\"theme-btn\" aria-label=\"切换深浅色\">◐\u003c/button>\u003cbutton class=\"top-chip\" type=\"button\" data-go=\"exam\">开始测验 ↗\u003c/button>\u003c/div>\u003c/header>\u003cmain id=\"main\">\n\u003csection class=\"screen active\" id=\"screen-home\">\u003cdiv class=\"hero\">\u003cspan class=\"eyebrow\">LEARN SMARTER · NOT LONGER\u003c/span>\u003ch1>HDFS，\u003cbr>\u003cem>一章就讲明白。\u003c/em>\u003c/h1>\u003cp>把课件中的 77 页变成\u003cstrong>能翻页、能动手、能做题\u003c/strong>的学习地图。故事背景只有一个：\u003cstrong>你经营一座超大型快递仓库\u003c/strong>，一个仓库存不下，就把包裹分散到很多仓库。\u003c/p>\u003cdiv class=\"hero-actions\">\u003cbutton class=\"btn-primary\" data-go=\"chapter-0\">从第一章开始 →\u003c/button>\u003cbutton class=\"btn-outline\" data-go=\"chapter-7\">直接演练：写入数据\u003c/button>\u003c/div>\u003cdiv class=\"hero-stats\">\u003cdiv class=\"stat\">\u003cb>9\u003c/b>\u003csmall>独立知识板块\u003c/small>\u003c/div>\u003cdiv class=\"stat\">\u003cb id=\"home-count\">—\u003c/b>\u003csmall>精讲学习卡片\u003c/small>\u003c/div>\u003cdiv class=\"stat\">\u003cb id=\"home-quiz-count\">—\u003c/b>\u003csmall>考点小测题\u003c/small>\u003c/div>\u003cdiv class=\"stat\">\u003cb>10\u003c/b>\u003csmall>可操作互动实验\u003c/small>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"eyebrow\">THE BIG PICTURE\u003c/div>\u003ch2 class=\"section-title\">整章内容，先记住这两条主线\u003c/h2>\u003cdiv class=\"two-lanes\">\u003carticle class=\"lane lane-blue\">\u003cspan class=\"lane-tag\">仓库管理 · 谁管什么\u003c/span>\u003ch3>Client → NameNode → DataNode\u003c/h3>\u003cp>顾客要寄件，问总调度在哪里存/在哪里取；真正的货在各分仓。\u003c/p>\u003cdiv class=\"path\">客户 → 总台查地址 → 分仓搬包裹\u003c/div>\u003c/article>\u003carticle class=\"lane lane-purple\">\u003cspan class=\"lane-tag\">数据流转 · 怎么传文件\u003c/span>\u003ch3>切 Block → 放副本 → 顺序读写\u003c/h3>\u003cp>超大货物拆成标准包裹，每个包裹留几份备份。写入像接力，读取就近取。\u003c/p>\u003cdiv class=\"path\">拆包 → 分仓备份 → 就近读 / 接力写\u003c/div>\u003c/article>\u003c/div>\n\u003cdiv class=\"home-section\">\u003cdiv class=\"eyebrow\">STORY FIRST\u003c/div>\u003ch2 class=\"section-title\">先认识仓库里的四个角色\u003c/h2>\u003cp class=\"subtitle\">点选角色，看看谁负责下令、谁真正干活。\u003c/p>\u003cdiv class=\"lab-box\">\u003cdiv class=\"btn-row\" id=\"role-buttons\">\u003c/div>\u003cdiv class=\"result-panel\" id=\"role-detail\">\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"home-section\">\u003cdiv class=\"eyebrow\">CHOOSE YOUR PATH\u003c/div>\u003ch2 class=\"section-title\">想学哪部分，就翻到哪一章\u003c/h2>\u003cdiv class=\"home-card-grid\" id=\"home-chapters\">\u003c/div>\u003c/div>\n\u003cdiv class=\"home-section\">\u003cdiv class=\"note\">\u003cstrong>怎么使用：\u003c/strong>左侧目录随时跳章；每章最下面可以做题并翻到下一章；卡片上的「标记掌握」记进度；顶部「☰」可收起侧栏。直接双击本 HTML 即可离线打开，也能原封不动上传 GitHub Pages。\u003c/div>\u003c/div>\u003c/section>\n\u003cdiv id=\"chapters-mount\">\u003c/div>\n\u003csection class=\"screen\" id=\"screen-exam\">\u003cdiv class=\"chapter-head\">\u003cdiv class=\"eyebrow\">EXAM MODE · 考前实战\u003c/div>\u003cdiv class=\"chapter-line\">\u003cspan class=\"chapter-no\">✓\u003c/span>\u003ch2>全章综合测验\u003c/h2>\u003c/div>\u003cp class=\"chapter-description\">从每章提取经典考点，题目全部是单选。选项提交后立刻显示解析；最后给出得分与需要回看的知识板块。\u003c/p>\u003c/div>\u003cdiv class=\"lab-box\">\u003cdiv class=\"btn-row\">\u003cbutton class=\"chip-btn selected\" id=\"exam-twelve\">精选 12 题\u003c/button>\u003cbutton class=\"chip-btn\" id=\"exam-all\">全量题库\u003c/button>\u003cbutton class=\"chip-btn\" id=\"exam-restart\">重新出题 ↻\u003c/button>\u003c/div>\u003cp class=\"footnote\" id=\"exam-desc\">已选择精选 12 题，覆盖所有 9 章。\u003c/p>\u003c/div>\u003cdiv class=\"exam-box\">\u003cdiv id=\"exam-questions\">\u003c/div>\u003cdiv id=\"exam-score\" class=\"exam-score\">\u003c/div>\u003c/div>\u003cdiv class=\"chapter-footer\">\u003cbutton class=\"btn-outline\" data-go=\"chapter-8\">← 回到命令章节\u003c/button>\u003cbutton class=\"btn-primary\" data-go=\"cheats\">看最后的考点速记 →\u003c/button>\u003c/div>\u003c/section>\n\u003csection class=\"screen\" id=\"screen-cheats\">\u003cdiv class=\"chapter-head\">\u003cdiv class=\"eyebrow\">CHEAT SHEET · LAST REVIEW\u003c/div>\u003cdiv class=\"chapter-line\">\u003cspan class=\"chapter-no\">≡\u003c/span>\u003ch2>全章速记与页码核对\u003c/h2>\u003c/div>\u003cp class=\"chapter-description\">考试前 10 分钟先扫这张表。如果要回去核对课件，按右侧入口跳转即可。\u003c/p>\u003c/div>\u003cdiv class=\"lab-box\">\u003ch3 class=\"chapter-sub\" style=\"margin-top:0\">一眼看明白的易错点\u003c/h3>\u003cdiv class=\"scroll-table\">\u003ctable class=\"command-guide\">\u003cthead>\u003ctr>\u003cth>题型关键词\u003c/th>\u003cth>一句话答案\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>NameNode\u003c/td>\u003ctd>管理命名空间、块位置和副本；\u003cstrong>不直接存实际数据块\u003c/strong>。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DataNode\u003c/td>\u003ctd>真实存储 Block，处理读写，发 Heartbeat、BlockReport。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Secondary NN\u003c/td>\u003ctd>检查点合并 FSImage + EditLog；\u003cstrong>不是热备\u003c/strong>。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Standby NN\u003c/td>\u003ctd>HA 中负责热备/接管；对比 Secondary NN 常考。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>FSImage / EditLog\u003c/td>\u003ctd>前者是目录等元数据的「存量快照」，后者是「增量变更流水账」。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Heartbeat / BlockReport\u003c/td>\u003ctd>前者报平安、携带状态；后者报「我有哪些块」。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Block\u003c/td>\u003ctd>常用 128 MiB；文件按块拆；小文件不足一块不强占整块空间。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>副本策略\u003c/td>\u003ctd>通常 3 份，\u003ccode>dfs.replication\u003c/code>；同块副本应位于不同 DataNode。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>读文件\u003c/td>\u003ctd>\u003ccode>open → 查块位置 → 就近连接 DN → read → 下一块 → close\u003c/code>。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>写文件\u003c/td>\u003ctd>\u003ccode>create → 权限检查 → write → DN1→DN2→DN3 → ACK 反向 → close\u003c/code>。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Federation / HA\u003c/td>\u003ctd>前者解决单 NameNode \u003cstrong>扩展瓶颈\u003c/strong>，后者解决\u003cstrong>单点故障\u003c/strong>。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>快照\u003c/td>\u003ctd>只读时间点视图，主要保存元数据差异，通常不立即完整复制所有块。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Shell\u003c/td>\u003ctd>\u003ccode>put\u003c/code> 本地→HDFS；\u003ccode>get\u003c/code> HDFS→本地；\u003ccode>hdfs dfs -cat\u003c/code> 查看。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cdiv class=\"coverage-wrap\">\u003ch3 class=\"chapter-sub\">77 页课件 · 完整知识区间对照\u003c/h3>\u003cdiv class=\"scroll-table\">\u003ctable class=\"coverage\">\u003cthead>\u003ctr>\u003cth>PDF 页\u003c/th>\u003cth>知识内容\u003c/th>\u003cth>本页入口\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"coverage-body\">\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"footnote\">分隔页及重复讲解会合并到知识卡片中，实际概念、流程、命令、易错点均归入对应章节。\u003c/p>\u003c/div>\n\u003cdiv class=\"note warning\">\u003cstrong>课件与实际实现有出入：\u003c/strong>例如 PDF P42 对第三副本机架的描述，与 Apache HDFS 常见默认策略不同；P50 的 HDFS 全局 \u003ccode>.crc\u003c/code> 文件、P55 的 \u003ccode>dfs.balance.threshold\u003c/code> 自动触发机制，以及 P75 的 \u003ccode>/usr/$USER\u003c/code> 路径也有不严谨之处。对应章节均有提醒，考试看课件表述，实际操作以 Apache 文档为准。\u003c/div>\n\u003cp class=\"footnote\">可选延伸核对：\u003ca href=\"https://hadoop.apache.org/docs/current/hadoop-project-dist/hadoop-hdfs/HdfsDesign.html\" target=\"_blank\" rel=\"noopener\">Apache HDFS 架构文档\u003c/a> · \u003ca href=\"https://hadoop.apache.org/docs/current/hadoop-project-dist/hadoop-hdfs/HDFSCommands.html\" target=\"_blank\" rel=\"noopener\">HDFS 管理命令\u003c/a> · \u003ca href=\"https://hadoop.apache.org/docs/current/hadoop-project-dist/hadoop-common/FileSystemShell.html\" target=\"_blank\" rel=\"noopener\">FileSystem Shell\u003c/a>。学习页本身无须联网。\u003c/p>\u003cdiv class=\"chapter-footer\">\u003cbutton class=\"btn-outline\" data-go=\"home\">← 回学习首页\u003c/button>\u003cbutton class=\"btn-primary\" data-go=\"exam\">再做一遍综合测验 →\u003c/button>\u003c/div>\u003c/section>\n\u003c/main>\u003c/div>\u003c/div>\n\u003cscript>\n'use strict';\nconst CHAPTERS=[\n{title:'认识 HDFS：为什么要分仓',pages:'P4–8',desc:'从普通文件系统走到分布式文件系统，知道它擅长什么、不擅长什么。',goal:'分清 FS、DFS、HDFS；记住 HDFS 的特点与局限。',lab:'none',cover:'普通文件系统、分布式文件系统、优缺点'},\n{title:'Block、四大角色与心跳',pages:'P10–24',desc:'把一个巨型文件拆成小包裹，交给分仓保管；总台靠心跳得知仓库是否在线。',goal:'掌握 Block、Client、NameNode、DataNode、Secondary NN、Heartbeat、BlockReport。',lab:'blocks',cover:'块大小、组件职责、主从架构、心跳配置与误区'},\n{title:'元数据：仓库总账如何维护',pages:'P25–34',desc:'一张仓库全景图配一本当天流水账，解释 FSImage / EditLog / Checkpoint。',goal:'能说出 FSImage、EditLog、块位置内存映射以及检查点 3 步。',lab:'checkpoint',cover:'命名空间、FSImage、EditLog、Checkpoint、检查点阈值'},\n{title:'Federation 与副本机架',pages:'P35–43',desc:'一个主管忙不过来，就设多个相互独立的主管；每件货还要放在不同机架上备份。',goal:'区分横向扩展与副本冗余；理解机架感知策略。',lab:'rack',cover:'Federation、块池、三副本、Rack Awareness'},\n{title:'高可用与故障修复',pages:'P44–52',desc:'仓库断联、经理请假、包裹破损时，系统怎样顶上去或补货？',goal:'区分 HA、Secondary NN、Standby NN；掌握故障检测和校验。',lab:'failure',cover:'Active/Standby、故障恢复、校验和、blk.meta'},\n{title:'负载均衡与快照',pages:'P53–57',desc:'有的仓库爆满，有的空置；按下快门保存仓库的某一时刻。',goal:'懂容量均衡器、热点与快照，并识别课件易混说法。',lab:'snapshot',cover:'节点负载均衡、快照机制'},\n{title:'读数据：顾客如何取包裹',pages:'P58–64',desc:'客户端先向总台要地址，再到最近的仓库取货；整个过程按顺序读。',goal:'牢记 6 步读取流程、FSDataInputStream 和故障重试。',lab:'read',cover:'流机制、读策略、open/read/close、6 步流程'},\n{title:'写数据：三仓接力存包裹',pages:'P65–70',desc:'Client 把货发给 1 号仓，1 号仓转给 2 号，2 号转给 3 号；回执反向回来。',goal:'牢记 7 步写入流程、Pipeline、Packet、ACK、close。',lab:'write',cover:'写入与复制、输出流、Pipeline、Packet 和 ACK'},\n{title:'HDFS 命令：自己操作一遍',pages:'P71–77',desc:'把课件里的 ls / mkdir / put / get / rm / cat 变成可模拟的终端操作。',goal:'熟悉 HDFS Shell 语法、路径和本地文件与 HDFS 的区别。',lab:'terminal',cover:'hdfs dfs / hadoop fs、常用 shell 命令与例题'}\n];\n// lesson = [标题,PDF页,一句抓手,类比记忆,准确概念,易错/考点]\nconst L=[\n[\n['FS 在管什么','P4–5','文件系统 = 给文件编号、分类、保管的管理员。','一间普通仓库：有货架目录、柜号，还负责入库、取货、权限检查。','文件系统组织空间、存储、保护、检索文件；目录树和绝对/相对路径定位文件。','绝对路径从根目录起，相对路径从当前目录起。'],\n['为什么要 DFS','P6','单间仓库放不下，就建多仓并用一套系统管理。','货分布在上海、苏州、杭州，但顾客只需要一个下单入口。','DFS 通过网络在多台主机分布式存储；对用户尽可能表现为统一文件系统（透明性）。','DFS 是大类，HDFS 是 Hadoop 的具体分布式文件系统。'],\n['HDFS 最适合的工作','P7','大文件、批处理、高吞吐量。','一辆辆货车批量装卸很擅长；但每分钟来一个小包裹要求立刻出库不划算。','支持海量大文件、可扩展普通服务器、流式访问、多副本容错；适合一次写入、多次读取。','高吞吐量 ≠ 低延迟；批处理不是实时交互。'],\n['HDFS 的三类局限','P8','低延迟、小文件、随机改写 —— 都不擅长。','仓库要为每件商品建目录卡片：百万个针头比几十箱整货更难管。','不适合毫秒级访问；很多小文件使 NameNode 元数据内存压力大；通常不允许多个写入者同时改同一文件或随机覆盖写。','“小文件不占满一个完整数据块”不代表小文件完全没有额外管理成本。'],\n['为什么是“文件系统”而非数据库','P4–8','HDFS 的目标是可靠地存取海量文件，不负责 SQL 查询本身。','仓库保证“货在哪、能取到”，数据分析由仓库外的加工车间完成。','HDFS 是底层分布式存储；MapReduce/Spark 等计算系统可读取 HDFS 数据进行处理。','NameNode 不负责执行 MapReduce 计算任务。']\n],\n[\n['Block：文件被切成标准包裹','P10–12','先切块，才能跨机器存储和并行处理。','300 MiB 文件像一卷 300 米的布，每卷最多 128 米：128 + 128 + 44。','块大小常见为 128 MiB（课程写 128MB）；HDFS1.x 历史常见 64MiB；默认值依版本与集群配置而定。','块数 = ceil(文件大小/块大小)。最后一块可以不足一个标准块。'],\n['块不能太小，也不能太大','P11–12','太小：登记成本高；太大：并行颗粒度粗。','小成米粒需要上万张物流单，整船一包又没法多仓同时分工。','小块令 NameNode 维护更多元数据；过大可能降低任务并行度、增大故障重传量；可用 dfs.blocksize 配置。','块是逻辑拆分单位；不等于每个块必然占满整个配置容量。'],\n['NameNode = 总调度 / 地址总账','P13、19','总台告诉你去哪取，不亲自把货搬出来。','客户问“报告.docx在哪？”总台查货品目录与各分仓的货架位置。','管理命名空间、目录/权限、文件→块、块→DataNode 映射、创建与删除、存储节点监控和副本调度。','问“文件数据存在哪里？”→ DataNode；问“数据块位置谁知道？”→ NameNode。'],\n['DataNode = 真正的分仓','P15、20','它是真的存货的地方。','每个仓库保存实际箱子，按总台要求上架、删除或复制，并回应客户来取货。','在本地磁盘保存实际数据块，处理 Client 的数据读写；向 NameNode 发送心跳和块报告。','DataNode 不主导全局命名空间，不负责下达整体存放策略。'],\n['Client = 寄件与取件的人','P18','客户端发起流程，并直接连接 DataNode 传输数据。','客户先找总台要地点，拿到地址后直接去仓库取；不经过总台转运所有包裹。','Client 通过 Shell 或 API 发起请求；写时将文件按块发送，读时按返回的位置直接访问 DataNode。','重点：NameNode 通常只走控制/元数据路径，不是全部文件数据的中转站。'],\n['Secondary NameNode = 会计','P14','它负责定期整理账本，不是总经理替补。','经理写当天流水账太长，会计定期把“旧账 + 新账”合成一版新总账。','SNN 负责检查点合并 FSImage 和 EditLog；不承接主 NameNode 故障时的正常服务。','Secondary ≠ Standby；看见“第二名称节点是热备”应判错。'],\n['心跳 vs 块报告','P21–24','心跳报“我活着”，块报告报“我有哪些货”。','分仓每隔几秒说“我在线”；还会寄一份货架清单。','Heartbeat 反映存活和资源状态，默认间隔常为 3 秒；BlockReport 维护块所在节点映射。失联需持续超时才判故障。','心跳不传用户文件内容；偶尔丢一次心跳不等于立刻宕机。']\n],\n[\n['Namespace = 目录树','P25–26','用户用文件名，NameNode 将它译成存储位置。','顾客说“仓库/财务/报表”，总台沿目录找到这一单关联哪些箱子和分仓。','目录、文件名、权限、修改时间、块列表等是元数据；名字定位文件后，再查各块的存放位置。','文件名和真实数据块不一定在同一台机器。'],\n['FSImage = 某一时刻的总账快照','P27–28','存“已有的目录状态”，不是原始文件内容。','每晚拍一张“全部货位清单”的照片；新变化不会立即改这张旧照片。','持久化保存命名空间和文件到块等关键元数据，启动时用于恢复目录状态。','很重要：块→DataNode 的动态位置映射通常由运行期报告重建，不是固定写进 FSImage。'],\n['EditLog = 新增操作流水','P27、30','只记变化，写一行就行。','“8:00 新增文件；8:05 重命名；8:10 删除”，不用为每个操作重印一本总账。','在 NameNode 上持久记录元数据事务；创建、删除、改名、改副本数等变动会被追加记录。','EditLog 不存文件本体；操作日志越长，启动重放越费时。'],\n['NameNode 重启与安全模式','P29、31','先把旧快照和新流水合并进内存，再等分仓汇报。','总台停电重启，先读旧货单和当天流水，再听每个分仓说明“我还有哪些箱子”。','启动加载 FSImage、重放 EditLog，接收 DataNode 的心跳/块报告，恢复块位置；安全模式限制常规写入与复制。','课件把启动重放和 checkpoint 合在一起解释；严格说启动重放不等于每次重启都生成新 FSImage。'],\n['Checkpoint = 合账而不是备份接班','P31–32','每隔一段时间，把快照 + 流水账合为新快照。','把昨天账本和今天所有增量登记重新生成“一本最新总账”，旧流水便可归档清理。','检查点减少需要重放的 EditLog 量，降低后续恢复成本；SNN 是经典部署中的检查点组件。','Checkpoint 不会取代真正的 HA；它不能保证主 NN 宕机后不间断服务。'],\n['检查点的具体动作和参数','P32–34','切日志 → 拉取合并 → 把新账交回去。','t₁ 总台换一本新流水账，会计拿走旧快照与旧流水；t₂ 会计归还合并版，总台继续用新流水。','课件示例：时间触发 3600 秒、事务数触发 100 万；参数 dfs.namenode.checkpoint.period / dfs.namenode.checkpoint.txns。','合并期间产生的新事务在新日志里；不能误以为新快照自动包含 t₁ 之后全部操作。']\n],\n[\n['Federation：多个“独立总台”','P35–36','为解决一个 NameNode 的吞吐和内存瓶颈。','业务太多，总公司分设食品、服装两位仓库总调度，各管自己的目录。','多个 NameNode 分别管理独立命名空间与块池，底层可共享 DataNode 资源，支持横向扩展和业务隔离。','Federation 重点是扩展性；不是 NameNode 的主备热切换。'],\n['什么是块池 Block Pool','P35','每位总台只管自己的箱子编号。','食品总台的 001 号箱，与服装总台的 001 号箱属于不同仓储系统。','块池是特定命名空间管理下的数据块集合，DataNode 可为多个块池存储块并向相关 NN 报告。','多个 NN 之间不是共同编辑同一份目录树。'],\n['三个副本究竟是什么意思','P38–39','一个 Block 造 3 份，不是把整个文件只备 3 个节点。','文件切成 A、B、C 三箱，每箱都有 A1/A2/A3、B1/B2/B3……分别放到不同仓库。','默认复制系数常为 3；可由 dfs.replication 配置，通过 hdfs dfs -setrep 改已有文件副本数。','文件 300MiB，副本因子 3：理想逻辑块数 3、物理块副本数 9、数据载荷约 900MiB，不含元数据等开销。'],\n['Rack = 同一组交换机下的仓库排','P40–41','同排传输快，跨排更费网络资源。','一个园区分多个仓库区域，某排交换机坏掉会让整排离线。','机架感知根据 DataNode 的网络拓扑位置分配副本，权衡读取局部性、跨机架容灾、带宽与写入成本。','三副本通常至少跨两个机架，三份不等于必须占三机架。'],\n['前三副本放在哪：重点纠错','P42–43','第一份本地；第二份远端；第三份通常同第二份机架的不同节点。','发货人近处留一份、异地园区留两份，减少跨园区来回运输。','Apache 典型默认策略（写入方在 DataNode 上）：第 1 副本在本机，第 2 副本在另一机架，第 3 副本在第 2 副本所在机架的另一台 DataNode。','⚠ 课件 P42 写“第三份与第一份同机架”，和 Apache HDFS 常见默认放置策略有出入。考试核对老师口径。'],\n['为什么不把三份都放一起','P39–43','抗故障、读就近、分散负载。','一整排仓库停电，如果三份备份都在那里，就全部完了。','多副本支持坏节点后重复制，也让客户端挑近的副本读；机架感知减少机架级共同故障。','副本多也意味着更高磁盘容量和写入开销；并非副本越多越好。']\n],\n[\n['NameNode 单点故障','P44–46','总台失联，货可能还在，但客户不知道去哪找。','所有货箱仍在各分仓，唯一的地址总账停摆，正常文件系统服务受影响。','传统单 NN 是元数据服务的单点故障；HDFS HA 用 Active / Standby 两个 NameNode 形成高可用。','NN 宕机不等于 DataNode 的全部实际块瞬间被物理删除。'],\n['HA：Active + Standby','P46–47','真正能接班的是 Standby NN。','总经理主班工作；副经理同步账本并准备接班，配合协调机制避免双主。','Active 对外服务、Standby 维护同步状态；发生故障时通过 HA 协调机制执行 failover。','Standby 与 Secondary NN 两回事，后者是旧式检查点角色。'],\n['谁能接班：对照题','P47','Standby 接班；Secondary 合账。','副经理随时接业务；兼职会计只管合账，不接待顾客。','Standby 具备热备与故障转移能力；Secondary NN 专做元数据检查点，无法提供热切换。','看到“Secondary NameNode 解决单点故障”→ 错。'],\n['DataNode 宕机如何恢复','P48','靠超时检测，再由 NameNode 安排补副本。','仓库连续失联，总台把这仓的包裹标记不可用，再找其他分仓复制缺的箱子。','DN 定期发心跳（常见 3 秒）；NN 持续无法收到后判故障并停止向它分配请求；检查欠复制块并重新复制。','课件示例超时约 10 分钟；真实失效判定参数会随版本和配置变化。'],\n['校验和：防止货箱坏了却没人知道','P49','读到损坏的数据，可以改从别的副本取。','收到包裹先核对封条与清单；损坏就从另一家仓库调货。','HDFS 针对数据块保存校验信息；客户端/存储层校验失败会转读其他副本，并向 NameNode 报告损坏以便修复。','Checksum 用于发现数据损坏；多副本用于拿到另一份正确数据，两者配合。'],\n['blk.meta 与 .crc：课件说法要分清','P50–52','真实 HDFS 常见是 DN 本地的块元数据文件。','每箱旁有本地封条检验记录；不能混成集群里必定有一份“.文件名.crc”总检验本。','DataNode 本地块文件 blk_\u003cid> 配对应 blk_\u003cid>_\u003cgenstamp>.meta 等元信息用于校验。\u003ccode>.filename.crc\u003c/code> 常见于 Hadoop 的 ChecksumFileSystem（如本地 FS）侧车文件。','⚠ 课件 P50 将独立 .crc 文件描述为 HDFS 全局通用机制并不准确；不要当成所有 HDFS 文件必有隐藏 .crc。']\n],\n[\n['容量不均衡：有的仓满有的仓空','P53–55','均衡器把部分数据块搬到更空的节点。','A 仓使用率 95%，B 仓只有 20%，移动一批货让容量更均匀。','HDFS 提供 balancer，按各 DataNode 存储使用率相对集群平均值的偏差进行块迁移。','并不是“任意两节点空闲率差大于阈值就自动开工”，通常需要运行或调度 balancer。'],\n['阈值与命令：不要死背错参数','P55','-threshold 10 表示容量均衡容忍区间（百分点）。','仓库有容量允许误差，不必所有仓的箱子数绝对相等。','常见命令 \u003ccode>hdfs balancer -threshold 10\u003c/code>。阈值比较节点利用率和集群平均利用率。','⚠ 课件的 dfs.balance.threshold 与自动触发示例不是常见的官方标准用法。'],\n['访问热点 ≠ 磁盘容量不均','P54–56','“仓里东西多”和“来取货的人多”是两种不同问题。','一个节点空间不满，但热门影片都在这里，网络依然拥堵。','容量 balancer 主要解决空间利用率不均；访问热点通常还需应用层缓存、调度、扩副本等机制。','⚠ 课件把热点自动扩副本写成通用机制；标准 HDFS 不保证无配置地按热度自动加副本。'],\n['Snapshot：拍一张只读快照','P57','快照保存“那一刻的目录和文件视图”。','10:00 给仓库目录拍照；11:00 删除文件，10:00 的快照视图仍可供恢复参照。','HDFS 快照是特定目录下时间点一致的只读视图；使用元数据与块共享等机制节省额外存储，不立即全量复制数据。','快照 ≠ 三副本，也不等于异地完整备份；删除源目录前应关注快照保留和快照操作限制。']\n],\n[\n['读取的第一句话：两段路','P58–61','先问 NN “在哪”，再找 DN “给我数据”。','顾客先问客服“这箱货在哪个分仓”，然后开车到最近分仓取货。','客户端调用 open，通过 NameNode 获取块与副本地址，按邻近程度选 DN 直接读取流。','读到数据的是 DN → Client，不是 NN → Client。'],\n['流（Stream）是什么','P59–60','按字节有序流动的数据通道。','水从管道一端顺序流到另一端，流不能一会儿当进水又当出水。','输入流负责读，输出流负责写；HDFS 按块组织文件，但应用通常像顺序读文件一样操作。','HDFS 不适合任意位置随机改写；顺序读写与 seek 定位读取概念不要混淆。'],\n['读 API：open/read/close','P62','打开输入流，再持续 read，最后 close。','拿到提货单、分批领完货、交回提货单。','\u003ccode>DistributedFileSystem.open()\u003c/code> 返回 \u003ccode>FSDataInputStream\u003c/code>，客户端 \u003ccode>read()\u003c/code>，全部完成后 \u003ccode>close()\u003c/code>。','课件还写 getBlockLocations 获取后续块位置；其归属/调用细节属于内部实现概括，考试抓逻辑。'],\n['读取的 6 个步骤','P63–64','打开 → 找位置 → 连接 → 读块 → 读下块 → 关流。','顾客办取件、客服查货位、近仓交货、拿完当前箱去下一仓，最后完成签收。','①open 文件；②NN 返回起始块位置和按距离排序的副本列表；③选择附近 DN；④read 当前块；⑤逐块继续；⑥close。','NN 初次通常不必一次性给出整个超大文件的所有块地址。'],\n['某个 DN 读坏了怎么办','P61–64','换另一个持有同块副本的节点。','一号仓断联或封条损坏，就按备选地址到二号仓拿同一箱。','客户端遇网络错误或校验失败，可尝试其他副本；NameNode 继续维护健康副本信息。','不是将文件重新写入后才能继续读；已有副本就是故障兜底。']\n],\n[\n['写入的第一句话：先创建元数据','P65–67','Client 向 NameNode 申请 create，不是直接往任意 DN 放。','寄件者先找总台登记包裹，确认你有权限且名称没有冲突。','调用 \u003ccode>DistributedFileSystem.create()\u003c/code>；NameNode 检查文件名、权限并登记创建状态；返回可写输出流。','新建文件的校验与写入阶段不要混为同一步。'],\n['写 API：create/write/close','P66–68','创建输出流 → 写字节 → 关闭并完成。','寄件者开单后按箱发货，最终确认全单完成。','\u003ccode>FSDataOutputStream\u003c/code> 作为写接口，内部管线负责管理 Packet、DN 连接及响应；应用调用 write/close。','输出流与输入流分别用于写/读，不要把 read() 记在写入流程中。'],\n['Packet 与 Block 不是一回事','P68–69','文件按 Block 逻辑切分，写 Block 又分成多个 Packet。','一整箱货是 Block；路上为了装卸又分成一批批小包 Packet。','客户端把字节流封装为 Packet 并排入发送队列；多个 Packet 组成一块数据的传输。','经典易混：Block 是文件存储单位，Packet 是写入管线传输单位。'],\n['Pipeline：数据单向接力','P65、68–69','Client → DN1 → DN2 → DN3。','客户把货交一号仓；一号仓存下并转二号，二号再转三号。','NameNode 为块挑选节点，客户端建立写入管线；数据包顺序经过所有副本目标 DN。','并非 Client 对 3 个 DN 分别并行发送 3 份完整数据。'],\n['ACK：确认方向相反','P67–70','DN3 → DN2 → DN1 → Client。','三号仓签收回执先交二号、再交一号、最后回客户手里。','管线下游完成处理后向上游回 ACK；客户端收到确认后可移除待确认队列中对应 Packet。','最容易考的方向题：数据正向、ACK 反向。'],\n['完整写入 7 步','P67–70','创建 → 登记 → write → 管道传输 → ACK → close → 完成。','寄件登记、仓库派单、依次转仓、回执回传、最后结单。','①create；②NN 检查并创建元数据；③write、准备 Packet/管线；④Packet 正向传；⑤ACK 反向回；⑥close；⑦文件完成并更新元数据。','写入失败时会处理管线重建/失败恢复，课件主要要求记住正常 7 步。']\n],\n[\n['为什么 Shell 命令和 Linux 很像','P71–73','HDFS 是远程集群文件系统，不是本机硬盘。','本地命令像在家里整理箱子；hdfs dfs 命令像在跨城物流系统里调货。','常见入口 \u003ccode>hdfs dfs\u003c/code> / \u003ccode>hadoop fs\u003c/code>，后面跟 \u003ccode>-ls\u003c/code>、\u003ccode>-put\u003c/code> 等子命令。','Linux ls 直接看当前本机目录；hdfs dfs -ls 查看 HDFS。'],\n['命令格式：别漏连接符','P73–74','hdfs dfs -命令 参数。','一条物流指令至少要写动作和地址。','如 \u003ccode>hdfs dfs -ls /\u003c/code>、\u003ccode>hdfs dfs -mkdir -p /user/student/data\u003c/code>；\u003ccode>hadoop fs\u003c/code> 也常用。','课件列 hadoop dfs 为历史形式；实际应优先记 hdfs dfs / hadoop fs。'],\n['mkdir / ls / cat / tail','P74–77','建目录、列清单、看内容、看尾巴。','建货架、盘点、打开箱子看看、只看最后几件。','\u003ccode>-mkdir -p\u003c/code> 建嵌套目录；\u003ccode>-ls\u003c/code> 列路径；\u003ccode>-cat\u003c/code> 查看内容；\u003ccode>-tail\u003c/code> 通常显示文件末尾字节。','课件“cat | head 显示前 1000 字节”不准确：head 默认通常显示前 10 行；若要字节数需指定参数。'],\n['put 与 get 谁往哪走','P75–76','put 上传；get 下载。','put = 家里寄到大仓；get = 从大仓取回家。','\u003ccode>hdfs dfs -put README.txt /user/student/\u003c/code>：本地→HDFS；\u003ccode>-get /user/student/README.txt ./\u003c/code>：HDFS→本地。','两个命令的本地源和远程目标方向完全相反。'],\n['rm、setrep、help','P39、74–77','删文件、改副本、看使用方法。','注销包裹、加减备份仓、查询物流操作手册。','\u003ccode>hdfs dfs -rm 路径\u003c/code>、\u003ccode>-rm -r 目录\u003c/code>；\u003ccode>-setrep 2 文件\u003c/code>；\u003ccode>-help ls\u003c/code>。','删除 HDFS 文件不等于删除本地同名文件。'],\n['默认目录与相对路径纠错','P75–77','相对路径相对于 HDFS 的工作目录。','你说“把箱子放这里”，指的是用户在 HDFS 的默认目录，不是 Linux 的家目录。','标准惯例的 HDFS 用户家目录一般为 \u003ccode>/user/$USER\u003c/code>。实际是否存在需在系统中创建；\u003ccode>.\u003c/code> 指当前 HDFS 工作目录。','⚠ 课件 P75 一处写 /usr/$USER，另一处用 /user/root；通常正确示例是 /user/$USER。']\n]\n];\nconst Q=[\n[\n['HDFS 最擅长哪类任务？',['超低延迟随机查询','一次写入、多次读取的大文件批处理','多人同时随机覆盖写文件','高频更新海量小文件'],1,'HDFS 优先吞吐量、流式访问和容错，不追求毫秒级随机更新。'],\n['DFS 的“透明性”指什么？',['物理磁盘完全不需要网络','用户尽可能像用普通文件系统一样访问分布在多台主机的文件','任何机器出错都不会造成影响','NameNode 保存所有文件内容'],1,'透明性强调用户访问体验统一，不是网络或故障完全消失。'],\n['为什么海量小文件是 HDFS 的弱项？',['任何小文件强制占 128 MiB','NameNode 要维护大量文件与块元数据','DataNode 无法保存小于 128 MiB 的文件','副本不能用于小文件'],1,'文件并不强占整块空间，但每个文件仍有元数据成本。'],\n['以下哪项一般不适合 HDFS？',['PB 级批处理原始数据','大视频归档','频繁毫秒级随机修改小记录','机器故障可容忍的分布式存储'],2,'低延迟随机更新是 HDFS 典型弱项。']\n],\n[\n['300 MiB 文件按 128 MiB 分块，需要几个 Block？',['2','3','4','300'],1,'ceil(300/128)=3，分别为 128、128、44 MiB。'],\n['真正保存 HDFS 文件字节数据的是谁？',['NameNode','Secondary NameNode','DataNode','YARN ResourceManager'],2,'DataNode 保存块，NameNode 维护目录与块位置元数据。'],\n['心跳和 BlockReport 的正确对应是？',['心跳记录完整文件内容，块报告传客户端输入','心跳报节点存活，块报告报持有的块','两者完全相同','只在 NameNode 重启时发送'],1,'心跳=报平安；块报告=块清单。'],\n['以下关于 Secondary NameNode 的表述正确的是？',['作为 Active NN 的自动故障接管节点','主要负责 FSImage + EditLog 的检查点合并','保存全部实际文件块','只有客户端能访问'],1,'Secondary NameNode 不是 HA 中的 Standby NameNode。']\n],\n[\n['FSImage 主要记录哪种信息？',['全部实际文件字节数据','某时刻的命名空间等元数据状态','实时网络包','用户命令的最终输出'],1,'FSImage 是元数据镜像，不是文件内容。'],\n['HDFS 运行时“块在具体哪个 DN”的位置一般从哪里恢复？',['从 HDFS 每个文件的 .txt 里读出','由 DataNode 的块报告重建','由 Checkpoint 随机推算','由 Linux 用户名决定'],1,'块→DataNode 位置映射通常保留在运行内存，并由块报告重建。'],\n['EditLog 不断增长为什么需要 Checkpoint？',['让 Block 大小自动减半','避免每次恢复重放非常长的增量日志','使 3 副本变 6 副本','替代全部 DataNode'],1,'把镜像和操作流水合并为新检查点能降低恢复成本。'],\n['检查点合并期间新发生的元数据操作应怎么处理？',['直接抛弃','继续写入新滚动的日志','立刻停掉整个集群','写入数据文件的尾部'],1,'滚动日志可以确保旧日志参与合并时新事务仍有记录。']\n],\n[\n['Federation 主要解决什么？',['单 NN 的扩展性/隔离性瓶颈','给每个块添加 CRC','让客户端不用联网','消除所有磁盘故障'],0,'多个独立命名空间和 NameNode 提升扩展性。'],\n['一个 300 MiB 文件分成 3 块，副本系数为 3，总共多少份块副本？',['3','6','9','128'],2,'3 个逻辑块 × 3 份副本 = 9 个块副本。'],\n['为什么三副本通常要跨机架？',['增加文件名长度','降低整机架故障导致的共同失效风险','让所有副本在同一节点','为了让读数据都经过 NN'],1,'同机架可能受到共同交换机/断电故障影响。'],\n['按 System.create()，通过 RPC 向 NameNode 发起创建请求。','Client → NameNode：请求建立文件'],\n['NameNode 检查并建立元数据','校验文件是否已经存在、当前用户有无权限；登记创建状态，返回输出流。','NameNode → Client：允许创建 + 输出流'],\n['write：切成 Packet、组建管线','应用 write() 写入字节；内部将数据排成 Packet 队列，并向 NameNode 获取一组适合保存副本的 DataNode。','Client：Packet1 / Packet2 / Packet3 ...'],\n['数据包顺序传递','首个 DN 收到 Packet 后保存并转发，下一个继续转发，直到管线末端。','Client → DN1 → DN2 → DN3'],\n['ACK 逆向确认','当末端和中间节点完成接收，确认沿同一管线反向回到 Client；对应 Packet 从待确认队列移除。','DN3 → DN2 → DN1 → Client'],\n['close：写入结束','持续处理所有 Packet 与 ACK，应用调用 close()，等待完成必要的写入与确认。','FSDataOutputStream.close()'],\n['最终完成：元数据更新','NameNode 完成文件状态确认/块记录更新，后续客户端可按正常流程读取。','NameNode 记录文件完成状态']\n];\nconst safeStore={get(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};\nlet learned=new Set(safeStore.get('hdfs_learned_v1',[]));let focus=!!safeStore.get('hdfs_focus_v1',false);let cur='home';\nconst $=id=>document.getElementById(id);\nfunction textEsc(v){return String(v).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}\nconst goAttr=id=>`data-go=\"${id}\"`;\nfunction updateProgress(){const total=L.flat().length; $('progress-count').textContent=`${learned.size} / ${total}`;$('progress-bar').style.width=`${Math.min(100,100*learned.size/total)}%`;safeStore.set('hdfs_learned_v1',[...learned]);}\nfunction renderLessons(i){return L[i].map((l,j)=>{const id=`l${i}-${j}`;return `\u003carticle class=\"lesson ${learned.has(id)?'learned':''}\" id=\"${id}\">\u003cdiv class=\"lesson-head\">\u003cspan class=\"lesson-pages\">${l[1]}\u003c/span>\u003cbutton class=\"mark-btn\" type=\"button\" data-mark=\"${id}\">${learned.has(id)?'✓ 已掌握':'○ 标记掌握'}\u003c/button>\u003c/div>\u003ch3>${l[0]}\u003c/h3>\u003cp class=\"hook\">${l[2]}\u003c/p>\u003cp class=\"analogy\">\u003cspan class=\"inline-label\">🌟 这样记\u003c/span>${l[3]}\u003c/p>\u003cp class=\"truth\">\u003cspan class=\"inline-label\">准确说法\u003c/span>${l[4]}\u003c/p>\u003cp class=\"trap\">\u003cb>考点 / 易错：\u003c/b>${l[5]}\u003c/p>\u003c/article>`}).join('')}\nfunction quizMarkup(chIdx,prefix){return Q[chIdx].map((q,idx)=>`\u003cdiv class=\"quiz-q\" data-qch=\"${chIdx}\" data-qi=\"${idx}\" data-prefix=\"${prefix}\">\u003ch4>${idx+1}. ${textEsc(q[0])}\u003c/h4>\u003cdiv class=\"quiz-options\">${q[1].map((opt,k)=>`\u003cbutton type=\"button\" class=\"quiz-opt\" data-answer=\"${k}\">\u003cb>${'ABCD'[k]}.\u003c/b> ${textEsc(opt)}\u003c/button>`).join('')}\u003c/div>\u003cdiv class=\"explain\" hidden>\u003c/div>\u003c/div>`).join('')}\nfunction renderChapters(){let nav='',cards='',content='',coverage='';CHAPTERS.forEach((c,i)=>{nav+=`\u003cbutton class=\"nav-link\" type=\"button\" data-go=\"chapter-${i}\">\u003cspan class=\"nav-num\">${String(i+1).padStart(2,'0')}\u003c/span>${c.title}\u003c/button>`;cards+=`\u003cbutton type=\"button\" class=\"home-card\" data-go=\"chapter-${i}\">\u003cspan class=\"num\">CHAPTER ${String(i+1).padStart(2,'0')}\u003c/span>\u003ch3>${c.title}\u003c/h3>\u003cp>${c.desc}\u003c/p>\u003csmall>${c.pages} · ${L[i].length} 张学习卡片 →\u003c/small>\u003c/button>`;coverage+=`\u003ctr>\u003ctd>${c.pages}\u003c/td>\u003ctd>${c.cover}\u003c/td>\u003ctd>\u003ca href=\"#chapter-${i}\" data-go=\"chapter-${i}\">第 ${i+1} 章 →\u003c/a>\u003c/td>\u003c/tr>`;content+=`\u003csection class=\"screen\" id=\"screen-chapter-${i}\">\u003cdiv class=\"chapter-head\">\u003cdiv class=\"eyebrow\">CHAPTER ${String(i+1).padStart(2,'0')} / 09 · INTERACTIVE COURSE\u003c/div>\u003cdiv class=\"chapter-line\">\u003cspan class=\"chapter-no\">${String(i+1).padStart(2,'0')}\u003c/span>\u003ch2>${c.title}\u003c/h2>\u003cspan class=\"page-tag\">${c.pages}\u003c/span>\u003c/div>\u003cp class=\"chapter-description\">${c.desc}\u003c/p>\u003cdiv class=\"chapter-goal\">\u003cstrong>这一章学会什么？\u003c/strong> ${c.goal}\u003c/div>\u003c/div>\u003cdiv class=\"lessons-grid\">${renderLessons(i)}\u003c/div>\u003ch3 class=\"chapter-sub\">动手试一试\u003c/h3>\u003cdiv class=\"lab-box\" id=\"lab-${i}\">${renderLab(i)}\u003c/div>\u003ch3 class=\"chapter-sub\">本章 4 题 · 立刻检验\u003c/h3>\u003cdiv class=\"quiz-box\" id=\"quiz-${i}\">${quizMarkup(i,`ch${i}`)}\u003c/div>\u003cdiv class=\"chapter-footer\">\u003cbutton type=\"button\" class=\"btn-outline\" data-go=\"${i===0?'home':`chapter-${i-1}`}\">← ${i===0?'回首页':'上一章'}\u003c/button>\u003cbutton type=\"button\" class=\"btn-primary\" data-go=\"${i===8?'exam':`chapter-${i+1}`}\">${i===8?'去做综合测验':'下一章 →'}\u003c/button>\u003c/div>\u003c/section>`});$('chapter-nav').innerHTML=nav;$('home-chapters').innerHTML=cards;$('chapters-mount').innerHTML=content;$('coverage-body').innerHTML=coverage;$('home-count').textContent=L.flat().length;$('home-quiz-count').textContent=Q.flat().length;updateProgress()}\nfunction renderLab(i){switch(i){case 0:return `\u003cp class=\"lab-intro\">先选出最适合 HDFS 的情景：它不是“任何文件都更快”的魔法硬盘。\u003c/p>\u003cdiv class=\"btn-row\">\u003cbutton class=\"chip-btn\" data-compare=\"archive\">每天写一次的 500 GiB 日志\u003c/button>\u003cbutton class=\"chip-btn\" data-compare=\"chat\">每秒更新上万次的小聊天记录\u003c/button>\u003cbutton class=\"chip-btn\" data-compare=\"video\">海量视频冷归档\u003c/button>\u003c/div>\u003cdiv class=\"result-panel\" id=\"compare-out\">点击一种业务，看是否适合 HDFS。\u003c/div>`;\ncase 1:return `\u003cp class=\"lab-intro\">真实的 Block 数量计算。输入文件大小、块大小、副本数，直接看分块图和总存储量。\u003c/p>\u003cdiv class=\"lab-grid\">\u003clabel class=\"ctrl\">文件大小（MiB）\u003cinput type=\"number\" id=\"file-size\" min=\"1\" max=\"100000\" value=\"300\" inputmode=\"numeric\">\u003c/label>\u003clabel class=\"ctrl\">块大小（MiB）\u003cselect id=\"block-size\">\u003coption>64\u003c/option>\u003coption selected>128\u003c/option>\u003coption>256\u003c/option>\u003c/select>\u003c/label>\u003clabel class=\"ctrl\">副本系数\u003cselect id=\"rep-factor\">\u003coption>1\u003c/option>\u003coption>2\u003c/option>\u003coption selected>3\u003c/option>\u003coption>4\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003cdiv id=\"block-out\" class=\"result-panel\">\u003c/div>`;\ncase 2:return `\u003cp class=\"lab-intro\">把 FSImage 当作“上一次总账”，EditLog 当作“新发生的操作”。点按钮记流水，再执行一次 Checkpoint。\u003c/p>\u003cdiv class=\"btn-row\">\u003cbutton class=\"chip-btn\" data-log=\"新增 report.txt\">+ 创建文件\u003c/button>\u003cbutton class=\"chip-btn\" data-log=\"重命名 report.txt→final.txt\">↺ 重命名\u003c/button>\u003cbutton class=\"chip-btn\" data-log=\"删除 old.txt\">− 删除文件\u003c/button>\u003cbutton class=\"chip-btn selected\" id=\"checkpoint-btn\">合并 Checkpoint →\u003c/button>\u003c/div>\u003cdiv id=\"cp-out\" class=\"result-panel\">\u003c/div>`;\ncase 3:return `\u003cp class=\"lab-intro\">同一个数据块的三份副本，通常怎样摆放？切换「课件 P42 的描述」与「Apache 常见默认策略」，看不同在哪。\u003c/p>\u003cdiv class=\"btn-row\">\u003cbutton class=\"chip-btn selected\" data-rack=\"apache\">Apache 常见默认\u003c/button>\u003cbutton class=\"chip-btn\" data-rack=\"slides\">课件 P42 说法\u003c/button>\u003c/div>\u003cdiv id=\"rack-out\" class=\"result-panel\">\u003c/div>`;\ncase 4:return `\u003cp class=\"lab-intro\">一个 DataNode 心跳暂时丢失、持续超时、真正故障，处理方式不一样。\u003c/p>\u003cdiv class=\"btn-row\">\u003cbutton class=\"chip-btn selected\" data-failure=\"ok\">全部正常\u003c/button>\u003cbutton class=\"chip-btn\" data-failure=\"lost\">只丢 1 次心跳\u003c/button>\u003cbutton class=\"chip-btn\" data-failure=\"down\">DN3 持续超时\u003c/button>\u003cbutton class=\"chip-btn\" data-failure=\"repair\">重新复制缺失副本\u003c/button>\u003c/div>\u003cdiv id=\"failure-out\" class=\"result-panel\">\u003c/div>`;\ncase 5:return `\u003cp class=\"lab-intro\">模拟对目录拍快照：修改当前文件，旧快照依然对应当时的内容。\u003c/p>\u003cdiv class=\"btn-row\">\u003cbutton class=\"chip-btn selected\" id=\"shot-btn\">📸 创建快照 s1\u003c/button>\u003cbutton class=\"chip-btn\" id=\"modify-btn\">✏ 修改当前文件\u003c/button>\u003cbutton class=\"chip-btn\" id=\"reset-shot\">↺ 重置目录\u003c/button>\u003c/div>\u003cdiv id=\"snapshot-out\" class=\"result-panel\">\u003c/div>`;\ncase 6:return renderStepper('read',READ_STEPS);\ncase 7:return renderStepper('write',WRITE_STEPS);\ncase 8:return `\u003cp class=\"lab-intro\">下面是真正的 Shell 语法，但执行过程仅在本网页模拟，不会操作你电脑或真实 HDFS 集群。试着先建目录，再上传、查看、下载、删除。\u003c/p>\u003cdiv class=\"btn-row\">\u003cbutton class=\"chip-btn\" data-cmd=\"hdfs dfs -mkdir -p /user/student/data\">mkdir\u003c/button>\u003cbutton class=\"chip-btn\" data-cmd=\"hdfs dfs -put README.txt /user/student/data/\">put\u003c/button>\u003cbutton class=\"chip-btn\" data-cmd=\"hdfs dfs -ls /user/student/data\">ls\u003c/button>\u003cbutton class=\"chip-btn\" data-cmd=\"hdfs dfs -cat /user/student/data/README.txt\">cat\u003c/button>\u003cbutton class=\"chip-btn\" data-cmd=\"hdfs dfs -get /user/student/data/README.txt ./\">get\u003c/button>\u003cbutton class=\"chip-btn\" data-cmd=\"hdfs dfs -rm /user/student/data/README.txt\">rm\u003c/button>\u003c/div>\u003cdiv class=\"btn-row\" style=\"margin-top:14px\">\u003cinput class=\"terminal-input\" id=\"terminal-input\" aria-label=\"模拟终端命令\" value=\"hdfs dfs -ls /\" spellcheck=\"false\">\u003cbutton class=\"btn-primary\" id=\"run-cmd\">模拟执行 ↵\u003c/button>\u003c/div>\u003cdiv class=\"terminal\" id=\"terminal-out\" aria-live=\"polite\">$ hdfs dfs -ls /\nFound 1 items\ndrwxr-xr-x  - student supergroup     0 /user\n\n输入命令或点击上面的示例按钮。\u003c/div>\u003cp class=\"footnote\">本地已有 README.txt（示例内容：\"Hello HDFS!\"）。该终端不会访问网络，支持本文出现的常用子命令、列目录与方向演示。\u003c/p>`;\ndefault:return ''}}\nfunction renderStepper(which,steps){return `\u003cp class=\"lab-intro\">按顺序点数字，也可以跳到任何一步。重点观察\u003cstrong>${which==='write'?'数据和 ACK 是相反方向':'元数据与真实数据走的是两条不同路径'}\u003c/strong>。\u003c/p>\u003cdiv class=\"step-tape\" id=\"${which}-tape\">${steps.map((_,i)=>`\u003cbutton type=\"button\" data-${which}-step=\"${i}\" class=\"${i===0?'selected':''}\" aria-label=\"第 ${i+1} 步\">${i+1}\u003c/button>`).join('')}\u003c/div>\u003cdiv class=\"step-panel\" id=\"${which}-detail\">\u003c/div>\u003cdiv class=\"step-ctrl\">\u003cbutton class=\"btn-outline\" id=\"${which}-prev\">← 上一步\u003c/button>\u003cspan class=\"footnote\" id=\"${which}-count\">1 / ${steps.length}\u003c/span>\u003cbutton class=\"btn-primary\" id=\"${which}-next\">下一步 →\u003c/button>\u003c/div>`}\nlet roleIndex=0,stepRead=0,stepWrite=0,checkpointEvents=[],checkpointNumber=0,rackMode='apache',failureMode='ok',shotCurrent='报告 v1：本周销售额 100',shotSaved=null,examMode='short',examList=[],examAnswered={};\nfunction roleView(i){roleIndex=i;document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('selected',Number(b.dataset.role)===i));const x=ROLES[i];$('role-detail').innerHTML=`\u003ch4>${x.icon} ${x.name}\u003c/h4>\u003cp>\u003cstrong>${x.short}\u003c/strong> · ${x.desc}\u003c/p>\u003cp class=\"footnote\">容易混淆：${x.trap}\u003c/p>`}\nfunction calcBlock(){let n=Number($('file-size').value),bs=Number($('block-size').value),rep=Number($('rep-factor').value);if(!Number.isFinite(n)||n\u003c=0||n>100000){$('block-out').textContent='请输入 1～100000 之间的文件大小（MiB）。';return}const blocks=Math.ceil(n/bs),last=n-(blocks-1)*bs,totalCopies=blocks*rep,physical=n*rep;let chunks='';for(let i=0;i\u003cMath.min(blocks,18);i++){let size=i===blocks-1?last:bs;chunks+=`\u003cdiv class=\"block-piece\">Block ${i+1}\u003cbr>${Number(size.toFixed(2))} MiB\u003c/div>`}if(blocks>18)chunks+=`\u003cdiv class=\"block-piece\">还有 ${blocks-18} 块…\u003c/div>`;$('block-out').innerHTML=`\u003ch4>结果：${blocks} 个逻辑块、${totalCopies} 份块副本\u003c/h4>\u003cp>公式：\u003cstrong>ceil(${n} ÷ ${bs}) = ${blocks}\u003c/strong> 个 Block。最后一块实际大小为 \u003cstrong>${Number(last.toFixed(2))} MiB\u003c/strong>。\u003c/p>\u003cdiv class=\"block-track\">${chunks}\u003c/div>\u003cp>如果每块保存 ${rep} 份副本，数据载荷的理论总量约 \u003cstrong>${Number(physical.toFixed(2))} MiB\u003c/strong>（不计校验信息等开销）。注意不能把最后一块硬算成 ${bs} MiB。\u003c/p>`}\nfunction showCheckpoint(){const log=checkpointEvents.length?checkpointEvents.map((x,i)=>`${i+1}. ${textEsc(x)}`).join('\u003cbr>'):'（暂无新事务）';$('cp-out').innerHTML=`\u003ch4>🗂 FSImage · 第 ${checkpointNumber} 版检查点\u003c/h4>\u003cp>代表此前已归档的命名空间元数据状态。\u003c/p>\u003ch4 style=\"margin-top:15px\">🧾 EditLog · ${checkpointEvents.length} 条新增操作\u003c/h4>\u003cp>${log}\u003c/p>\u003cp class=\"footnote\">点击合并后，模拟生成新 FSImage 并清空本轮增量操作。真实系统还需要日志滚动和并发协调。\u003c/p>`}\nfunction showRack(mode){rackMode=mode;document.querySelectorAll('[data-rack]').forEach(b=>b.classList.toggle('selected',b.dataset.rack===mode));const apache=mode==='apache';$('rack-out').innerHTML=`\u003ch4>${apache?'Apache HDFS 常见默认策略':'课件 P42 写法（仅供对照）'}\u003c/h4>\u003cdiv class=\"nodes\">\u003cdiv class=\"node live\">\u003cstrong>🏬\u003c/strong>\u003cb>机架 A · DN1\u003c/b>\u003cem>副本 ①\u003c/em>\u003c/div>\u003cdiv class=\"node ${apache?'':'live'}\">\u003cstrong>🏬\u003c/strong>\u003cb>机架 A · DN2\u003c/b>\u003cem>${apache?'暂无该块':'副本 ③'}\u003c/em>\u003c/div>\u003cdiv class=\"node live\">\u003cstrong>🏬\u003c/strong>\u003cb>机架 B · DN3\u003c/b>\u003cem>副本 ②\u003c/em>\u003c/div>\u003cdiv class=\"node ${apache?'live':''}\">\u003cstrong>🏬\u003c/strong>\u003cb>机架 B · DN4\u003c/b>\u003cem>${apache?'副本 ③':'暂无该块'}\u003c/em>\u003c/div>\u003c/div>\u003cp>\u003cstrong>${apache?'默认策略：A1 → B3 → B4':'课件所写：A1 → B3 → A2'}\u003c/strong>，两种描述都将副本分散到两个机架，但具体第三副本位置不同。\u003c/p>\u003cp class=\"footnote\">Apache 默认策略对客户端是否位于 DataNode、拓扑、存储类型等还有条件；上图针对写入方位于机架 A 的数据节点这一典型情形。\u003c/p>`}\nfunction showFailure(mode){failureMode=mode;document.querySelectorAll('[data-failure]').forEach(b=>b.classList.toggle('selected',b.dataset.failure===mode));const down=mode==='down',repair=mode==='repair',lost=mode==='lost';const third=(down||repair)?'DN3 · 故障':'DN3 · 运行中';$('failure-out').innerHTML=`\u003cdiv class=\"nodes\">\u003cdiv class=\"node live\">\u003cstrong>✅\u003c/strong>DN1\u003cem>存副本 A\u003c/em>\u003c/div>\u003cdiv class=\"node live\">\u003cstrong>✅\u003c/strong>DN2\u003cem>存副本 A\u003c/em>\u003c/div>\u003cdiv class=\"node ${(down||repair)?'dead':'live'}\">\u003cstrong>${(down||repair)?'✖':'✅'}\u003c/strong>${third}\u003cem>${(down||repair)?'不可读取':'存副本 A'}\u003c/em>\u003c/div>\u003cdiv class=\"node ${repair?'live':''}\">\u003cstrong>${repair?'✅':'📭'}\u003c/strong>DN4\u003cem>${repair?'存新增 A':'空闲备用'}\u003c/em>\u003c/div>\u003c/div>\u003cp>\u003cstrong>${repair?'系统已补齐：3 份健康副本':down?'NN 检测持续超时：只剩 2 份健康副本':lost?'只丢 1 次心跳：暂时不判定节点死亡':'当前健康：3 份副本均可用'}\u003c/strong>\u003c/p>\u003cp>${repair?'NameNode 可指挥 DN1 或 DN2 把副本复制给 DN4。':down?'NameNode 停止让客户端访问 DN3，并安排将欠复制的块补到其他可用节点。':lost?'单次网络丢包只表示一次控制消息未到；持续超时才会按故障处理。':'DataNode 正常向 NN 发心跳，也定期上报块列表。'}\u003c/p>`}\nfunction showSnapshot(){$('snapshot-out').innerHTML=`\u003cdiv class=\"two-lanes\">\u003cdiv class=\"lane\" style=\"padding:16px\">\u003cspan class=\"lane-tag\">当前文件 /reports/sales.txt\u003c/span>\u003ch3 style=\"font-size:16px\">${textEsc(shotCurrent)}\u003c/h3>\u003cp>随正常修改而变化\u003c/p>\u003c/div>\u003cdiv class=\"lane\" style=\"padding:16px\">\u003cspan class=\"lane-tag\">快照 .snapshot/s1/…\u003c/span>\u003ch3 style=\"font-size:16px\">${shotSaved?textEsc(shotSaved):'（还没有快照）'}\u003c/h3>\u003cp>创建后保持只读时间点视图\u003c/p>\u003c/div>\u003c/div>\u003cp>快照不等于将所有数据块立刻复制新的一份；通常通过已有块共享和元数据版本记录保留旧视图。\u003c/p>`}\nfunction stepView(which,index){const steps=which==='read'?READ_STEPS:WRITE_STEPS;let n=Math.max(0,Math.min(steps.length-1,index));if(which==='read')stepRead=n;else stepWrite=n;document.querySelectorAll(`[data-${which}-step]`).forEach((b,i)=>{b.classList.toggle('selected',i===n);b.classList.toggle('visited',i\u003cn)});const s=steps[n];let note=which==='read'?'记忆口诀：先问 NN 要地址，后向 DN 要数据。':'记忆口诀：Data 正向，ACK 反向；每个 Block 经管线写到多个 DN。';$(`${which}-detail`).innerHTML=`\u003ch4>STEP ${n+1} · ${s[0]}\u003c/h4>\u003cp>${s[1]}\u003c/p>\u003cdiv class=\"flow-diagram\">${s[2].split(/(→|←|↔)/).map(p=>['→','←','↔'].includes(p)?`\u003ci>${p}\u003c/i>`:`\u003cspan>${textEsc(p.trim())}\u003c/span>`).join('')}\u003c/div>\u003cp class=\"footnote\">${note}\u003c/p>`;$(`${which}-count`).textContent=`${n+1} / ${steps.length}`;$(`${which}-prev`).disabled=n===0;$(`${which}-next`).textContent=n===steps.length-1?'重播 ↺':'下一步 →'}\nfunction selectQuiz(parent,opt){if(parent.dataset.done)return;const q=Q[Number(parent.dataset.qch)][Number(parent.dataset.qi)];const correct=q[2];const answered=Number(opt.dataset.answer);parent.dataset.done='1';parent.dataset.right=String(answered===correct);parent.querySelectorAll('[data-answer]').forEach((b,k)=>{b.disabled=true;if(k===correct)b.classList.add('correct');else if(k===answered)b.classList.add('incorrect')});const explan=parent.querySelector('.explain');explan.hidden=false;explan.classList.add(answered===correct?'good':'bad');explan.innerHTML=`\u003cstrong>${answered===correct?'✓ 答对了':'✗ 正确答案：'+ 'ABCD'[correct]}\u003c/strong> · ${q[3]}`}\nfunction shuffleDeterministic(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}\nfunction newExam(){let every=Q.flatMap((group,ch)=>group.map((q,idx)=>({ch,idx,q})));if(examMode==='short'){const base=Q.map((group,ch)=>({ch,idx:Math.floor(Math.random()*group.length),q:null})).map(x=>({...x,q:Q[x.ch][x.idx]}));const included=new Set(base.map(x=>`${x.ch}-${x.idx}`));let remain=shuffleDeterministic(every.filter(x=>!included.has(`${x.ch}-${x.idx}`))).slice(0,3);examList=shuffleDeterministic([...base,...remain])}else examList=shuffleDeterministic(every);examAnswered={};$('exam-desc').textContent=`已选择${examMode==='short'?'精选 12 题':'全量 36 题'}，${examMode==='short'?'每章至少 1 题，适合临考快测。':'涵盖 9 章的全部考点。'}`;$('exam-score').textContent=`已答 0 / ${examList.length} 题`;$('exam-questions').innerHTML=examList.map((item,i)=>`\u003cdiv class=\"quiz-q\" data-exam=\"${i}\">\u003ch4>${i+1}. \u003cspan class=\"lesson-pages\">第 ${item.ch+1} 章\u003c/span> ${textEsc(item.q[0])}\u003c/h4>\u003cdiv class=\"quiz-options\">${item.q[1].map((s,k)=>`\u003cbutton type=\"button\" class=\"quiz-opt\" data-exam-answer=\"${k}\">\u003cb>${'ABCD'[k]}.\u003c/b> ${textEsc(s)}\u003c/button>`).join('')}\u003c/div>\u003cdiv class=\"explain\" hidden>\u003c/div>\u003c/div>`).join('')}\nfunction answerExam(btn){const panel=btn.closest('[data-exam]');const i=Number(panel.dataset.exam);if(examAnswered[i]!==undefined)return;const item=examList[i],v=Number(btn.dataset.examAnswer),correct=item.q[2];examAnswered[i]=v===correct;panel.querySelectorAll('[data-exam-answer]').forEach((b,k)=>{b.disabled=true;if(k===correct)b.classList.add('correct');else if(k===v)b.classList.add('incorrect')});const e=panel.querySelector('.explain');e.hidden=false;e.classList.add(v===correct?'good':'bad');e.innerHTML=`\u003cstrong>${v===correct?'✓ 正确':'✗ 正确答案 '+ 'ABCD'[correct]}\u003c/strong> · ${item.q[3]}`;const answered=Object.keys(examAnswered).length,score=Object.values(examAnswered).filter(Boolean).length;let msg=`已答 ${answered} / ${examList.length} 题 · 当前 ${score} 题正确`;if(answered===examList.length){const bad=examList.filter((x,k)=>!examAnswered[k]);const names=[...new Set(bad.map(x=>CHAPTERS[x.ch].title))];msg=`完成！${score} / ${examList.length} 题正确，得分 ${Math.round(score*100/examList.length)} 分。${names.length?'建议回看：'+names.join('、'):'全对！可以进行下一轮随机测验。'}`}$('exam-score').textContent=msg}\n// 轻量级的本地示例文件系统：所有命令只在 JS 变量中模拟。\nconst virtual={dirs:new Set(['/','/user','/user/student']),files:new Map(),local:new Map([['README.txt','Hello HDFS!']])};\nconst canonical=p=>{let v=p.trim();if(v==='.'||v==='./')return '/user/student';if(v.startsWith('./'))v='/user/student/'+v.slice(2);else if(!v.startsWith('/'))v='/user/student/'+v;return '/'+v.split('/').filter(Boolean).join('/')};\nconst parentPath=p=>p.slice(0,p.lastIndexOf('/'))||'/';\nconst appendTerminal=(cmd,out)=>{const elem=$('terminal-out');elem.textContent+=`\\n$ ${cmd}\\n${out}`;elem.scrollTop=elem.scrollHeight};\nfunction terminalRun(command){let raw=command.trim();if(!raw)return;if(!/^(hdfs\\s+dfs|hadoop\\s+fs|hadoop\\s+dfs)\\s+/.test(raw)){appendTerminal(raw,'本模拟只支持 hdfs dfs / hadoop fs 前缀。');return}const args=raw.split(/\\s+/).slice(2),op=args[0],rest=args.slice(1);let result='';\ntry{\nif(op==='-mkdir'){let flag=rest.includes('-p'),ps=rest.filter(x=>x!=='-p');if(!ps.length)throw Error('缺少目标路径');for(const pathArg of ps){const dest=canonical(pathArg);if(flag){let sub='';for(const part of dest.split('/').filter(Boolean)){sub+='/'+part;virtual.dirs.add(sub)}}else{if(!virtual.dirs.has(parentPath(dest)))throw Error('父目录不存在，使用 -mkdir -p');virtual.dirs.add(dest)}}result=`创建目录成功：${ps.join(', ')}（模拟）`}\nelse if(op==='-ls'){const path=canonical(rest[0]||'.');if(virtual.files.has(path)){result='-rw-r--r--  3 student supergroup '+virtual.files.get(path).length+' '+path}else if(!virtual.dirs.has(path))throw Error('No such file or directory: '+path);else {const entries=[...virtual.dirs].filter(v=>v!==path&&parentPath(v)===path).map(v=>'drwxr-xr-x  - student supergroup  0 '+v).concat([...virtual.files].filter(([v])=>parentPath(v)===path).map(([v,s])=>'-rw-r--r--  3 student supergroup  '+s.length+' '+v));result=`Found ${entries.length} items\\n${entries.join('\\n')||'(empty)'}`}}\nelse if(op==='-put'){if(rest.length\u003c2)throw Error('使用方式：-put 本地源文件 HDFS目标路径');let [source,target]=rest;let content=virtual.local.get(source);if(content===undefined)throw Error('本地源文件不存在：'+source);let dest=canonical(target);if(virtual.dirs.has(dest))dest+='/'+source.split('/').at(-1);if(!virtual.dirs.has(parentPath(dest)))throw Error('目标 HDFS 目录不存在，请先 mkdir');virtual.files.set(dest,content);result=`本地 ${source} → HDFS ${dest}\\n上传成功（模拟），不会写入真实 HDFS。`}\nelse if(op==='-get'){if(!rest.length)throw Error('使用方式：-get HDFS源文件 本地目标路径');const src=canonical(rest[0]);if(!virtual.files.has(src))throw Error('HDFS 文件不存在：'+src);let dst=rest[1]||'./';if(dst==='.'||dst==='./')dst=src.split('/').at(-1);virtual.local.set(dst,virtual.files.get(src));result=`HDFS ${src} → 本地 ${dst}\\n下载成功（仅在网页变量中模拟）。`}\nelse if(op==='-cat'||op==='-tail'){if(!rest.length)throw Error('需要指定文件路径');const p=canonical(rest[0]);if(!virtual.files.has(p))throw Error('HDFS 文件不存在：'+p);const x=virtual.files.get(p);result=op==='-tail'?x.slice(-1024):x}\nelse if(op==='-rm'){const paths=rest.filter(x=>!['-r','-R','-skipTrash'].includes(x));if(!paths.length)throw Error('需要指定文件路径');for(const p1 of paths){const p=canonical(p1);if(virtual.files.has(p)){virtual.files.delete(p)}else if(virtual.dirs.has(p)){if(!rest.some(x=>x==='-r'||x==='-R'))throw Error('目录需使用 -rm -r');for(const k of [...virtual.files.keys()])if(k.startsWith(p+'/'))virtual.files.delete(k);for(const d of [...virtual.dirs])if(d===p||d.startsWith(p+'/'))virtual.dirs.delete(d)}else throw Error('No such file or directory: '+p)}result='删除成功：'+paths.join(', ')}\nelse if(op==='-setrep'){result='调整副本的语法：hdfs dfs -setrep 2 /user/student/README.txt\\n本模拟只展示语义，不创建真实副本。'}\nelse if(op==='-help'){result='支持：-ls -mkdir [-p] -put -get -cat -tail -rm [-r] -setrep -help\\n例：hdfs dfs -put README.txt /user/student/data/'}\nelse throw Error('未收录该指令：'+op+'。试试上方示例按钮。');\n}catch(err){result='错误：'+err.message}\nappendTerminal(raw,result)}\nfunction showCompare(kind){document.querySelectorAll('[data-compare]').forEach(b=>b.classList.toggle('selected',b.dataset.compare===kind));const examples={archive:['✓ 比较适合','大规模日志一次写入、后续用 MapReduce/Spark 批处理，符合高吞吐大文件场景。'],chat:['✗ 不推荐作为主存储','每秒大量小对象随机更新，更像数据库/在线消息服务；HDFS 不是低延迟随机写设计。'],video:['✓ 比较适合','超大影音文件长期保存、多副本容错和批量读取正是 HDFS 的优势。']};const x=examples[kind];$('compare-out').innerHTML=`\u003ch4>${x[0]}\u003c/h4>\u003cp>${x[1]}\u003c/p>`}\nfunction navigate(dest){const id=dest==='home'?'screen-home':dest==='exam'?'screen-exam':dest==='cheats'?'screen-cheats':`screen-${dest}`;if(!$(id))return;cur=dest;document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('[data-go]').forEach(el=>el.classList.toggle('active',el.classList.contains('nav-link')&&el.dataset.go===dest));$('crumb').innerHTML=`HDFS \u003cb>/\u003c/b> ${dest==='home'?'学习首页':dest==='exam'?'全章综合测验':dest==='cheats'?'考点速记':CHAPTERS[Number(dest.split('-')[1])].title}`;try{history.replaceState(null,'','#'+dest)}catch{}window.scrollTo({top:0,behavior:'instant'});if(window.matchMedia('(max-width:770px)').matches)$('sidebar').classList.remove('open');}\nfunction onDocumentClick(event){const go=event.target.closest('[data-go]');if(go){event.preventDefault();navigate(go.dataset.go);return}const mark=event.target.closest('[data-mark]');if(mark){const id=mark.dataset.mark;if(learned.has(id))learned.delete(id);else learned.add(id);const card=$(id);card.classList.toggle('learned',learned.has(id));mark.textContent=learned.has(id)?'✓ 已掌握':'○ 标记掌握';updateProgress();return}const role=event.target.closest('[data-role]');if(role){roleView(Number(role.dataset.role));return}const cmp=event.target.closest('[data-compare]');if(cmp){showCompare(cmp.dataset.compare);return}const log=event.target.closest('[data-log]');if(log){checkpointEvents.push(log.dataset.log);showCheckpoint();return}const rack=event.target.closest('[data-rack]');if(rack){showRack(rack.dataset.rack);return}const failure=event.target.closest('[data-failure]');if(failure){showFailure(failure.dataset.failure);return}const read=event.target.closest('[data-read-step]');if(read){stepView('read',Number(read.dataset.readStep));return}const write=event.target.closest('[data-write-step]');if(write){stepView('write',Number(write.dataset.writeStep));return}const cmd=event.target.closest('[data-cmd]');if(cmd){$('terminal-input').value=cmd.dataset.cmd;terminalRun(cmd.dataset.cmd);return}const quiz=event.target.closest('[data-answer]');if(quiz){selectQuiz(quiz.closest('.quiz-q'),quiz);return}const ans=event.target.closest('[data-exam-answer]');if(ans){answerExam(ans);return}}\nfunction init(){renderChapters();$('role-buttons').innerHTML=ROLES.map((x,i)=>`\u003cbutton class=\"chip-btn\" type=\"button\" data-role=\"${i}\">${x.icon} ${x.name.split(' · ')[0]}\u003c/button>`).join('');roleView(0);['file-size','block-size','rep-factor'].forEach(id=>$(id).addEventListener('input',calcBlock));calcBlock();showCheckpoint();showRack('apache');showFailure('ok');showSnapshot();stepView('read',0);stepView('write',0);showCompare('archive');newExam();document.addEventListener('click',onDocumentClick);      \u003cdiv id=\"chapter-nav\">\u003c/div>\n        \u003cp class=\"nav-overline\">互动练习 · 可跳转\u003c/p>\n        \u003ca class=\"nav-link\" href=\"#split-lab\">\u003cspan>▦\u003c/span> 分片计算器\u003c/a>\n        \u003ca class=\"nav-link\" href=\"#job-lab\">\u003cspan>↗\u003c/span> 施工队 · 七步调度\u003c/a>\n        \u003ca class=\"nav-link\" href=\"#shuffle-lab\">\u003cspan>⇄\u003c/span> Shuffle 分拣机\u003c/a>\n        \u003cp class=\"nav-overline\">考前复习\u003c/p>\n        \u003ca class=\"nav-link\" href=\"#exam\">\u003cspan>✓\u003c/span> 考前自测\u003c/a>\n        \u003ca class=\"nav-link\" href=\"#cheats\">\u003cspan>≡\u003c/span> 考点速记\u003c/a>\n        \u003ca class=\"nav-link\" href=\"#practice-code\">\u003cspan>⌘\u003c/span> Python / Linux 示例\u003c/a>\n      \u003c/nav>\n      \u003cdiv class=\"sidebar-footer\">\u003cdiv class=\"progress-label\">\u003cspan>学习进度\u003c/span>\u003cstrong id=\"sidebar-progress\">0 / 25\u003c/strong>\u003c/div>\u003cdiv class=\"progress-track\">\u003cdiv id=\"progress-fill\">\u003c/div>\u003c/div>\u003cp>进度保存在当前浏览器\u003c/p>\u003c/div>\n    \u003c/aside>\n    \u003cdiv class=\"page-frame\">\n      \u003cheader class=\"topbar\">\u003cbutton id=\"menu-toggle\" class=\"icon-button sidebar-toggle\" type=\"button\" aria-label=\"收起目录\" aria-controls=\"sidebar\" aria-expanded=\"true\" title=\"收起或打开左侧目录\">☰ \u003cspan id=\"menu-text\">收起目录\u003c/span>\u003c/button>\u003cspan class=\"crumb\" id=\"page-label\">MAPREDUCE \u003cspan class=\"crumb-slash\">/\u003c/span> 学习首页\u003c/span>\u003cdiv class=\"top-actions\">\u003cbutton id=\"focus-btn\" class=\"btn-quiet\" title=\"隐藏已掌握的卡片\">专注未掌握\u003c/button>\u003cbutton id=\"theme-btn\" class=\"icon-button\" title=\"切换深浅色\" aria-label=\"切换深浅色\">◐\u003c/button>\u003ca class=\"top-chip\" href=\"#exam\">开始测验 ↗\u003c/a>\u003c/div>\u003c/header>\n      \u003cmain id=\"main\">\n        \u003csection class=\"hero\" id=\"top\">\n          \u003cdiv class=\"hero-kicker\">\u003cspan class=\"kicker-pulse\">\u003c/span> LEARN SMARTER · NOT LONGER\u003c/div>\n          \u003ch1>MapReduce，\u003cbr>\u003cem>一章就讲明白。\u003c/em>\u003c/h1>\n          \u003cp class=\"hero-description\">把密密麻麻的 85 页课件，变成能理解、能操作、能记住的学习地图。不死背术语：\u003cstrong>先有画面，再记概念，最后考试能选对。\u003c/strong>\u003c/p>\n          \u003cdiv class=\"hero-actions\">\u003ca class=\"btn-primary\" href=\"#job-lab\">先玩 7 步施工队 \u003cspan>→\u003c/span>\u003c/a>\u003ca class=\"btn-outline\" href=\"#chapter-bigdata\">从第 1 章学习\u003c/a>\u003c/div>\n          \u003cdiv class=\"hero-stats\">\u003cdiv>\u003cb>5\u003c/b>\u003cspan>知识章节\u003c/span>\u003c/div>\u003cdiv>\u003cb id=\"lesson-total\">38\u003c/b>\u003cspan>精讲卡片\u003c/span>\u003c/div>\u003cdiv>\u003cb id=\"quiz-total\">50\u003c/b>\u003cspan>应试题\u003c/span>\u003c/div>\u003cdiv>\u003cb>3\u003c/b>\u003cspan>交互实验\u003c/span>\u003c/div>\u003c/div>\n        \u003c/section>\n        \u003csection class=\"essence\" aria-label=\"整章核心思路\">\u003cdiv class=\"section-eyebrow\">THE BIG PICTURE\u003c/div>\u003ch2>整章，其实就这两条线\u003c/h2>\u003cdiv class=\"two-lanes\">\u003carticle class=\"lane lane-blue\">\u003cspan class=\"lane-tag\">计算主线 · 事情怎么做\u003c/span>\u003ch3>Split → Map → Shuffle → Reduce\u003c/h3>\u003cp>分工作 → 各自加工 → 分拣归类 → 汇总答案。\u003c/p>\u003cdiv class=\"lane-pills\">\u003cspan>拆任务\u003c/span>\u003cspan>并行\u003c/span>\u003cspan>按 key 分组\u003c/span>\u003cspan>归约\u003c/span>\u003c/div>\u003c/article>\u003carticle class=\"lane lane-purple\">\u003cspan class=\"lane-tag\">管理主线 · 谁来组织\u003c/span>\u003ch3>RM → AM → NM → Task\u003c/h3>\u003cp>总部配资源 → 项目经理协调 → 现场主管启动 → 工人执行。\u003c/p>\u003cdiv class=\"lane-pills\">\u003cspan>资源\u003c/span>\u003cspan>调度\u003c/span>\u003cspan>执行\u003c/span>\u003cspan>容错\u003c/span>\u003c/div>\u003c/article>\u003c/div>\u003cp class=\"fine-note\">别混了：第一条讲\u003cstrong>数据如何计算\u003c/strong>，第二条讲\u003cstrong>计算任务如何被组织起来\u003c/strong>。\u003c/p>\u003c/section>\n\n        \u003csection class=\"coverage-section\" id=\"coverage-audit\">\u003cdetails class=\"deep-module\">\u003csummary>\u003cspan class=\"deep-title\">85 页课件 · 逐区间对照表\u003c/span>\u003cspan class=\"deep-pages\">全章覆盖核对\u003c/span>\u003cspan class=\"deep-desc\">不确定某一页讲了什么？展开查看它对应哪个章节，直接跳转复习。\u003c/span>\u003c/summary>\u003cdiv class=\"deep-body\">\u003cp>本页覆盖的是 \u003cstrong>85 页的知识与考试要点\u003c/strong>，不是逐页逐字复制。分隔页和重复铺垫合并讲解，流程、计算、易错题和实例则保留或扩写。\u003c/p>\u003cdiv class=\"deep-table-scroll\">\u003ctable class=\"deep-table\">\u003cthead>\u003ctr>\u003cth>PDF 页码\u003c/th>\u003cth>课件主题 / 需要会什么\u003c/th>\u003cth>网站入口\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>P1–7\u003c/td>\u003ctd>章节结构、计算定义、四种计算模式\u003c/td>\u003ctd>\u003ca href=\"#chapter-bigdata\">第 1 章\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>P8–16\u003c/td>\u003ctd>分而治之、框架作用、优缺点及课程投票题\u003c/td>\u003ctd>\u003ca href=\"#chapter-bigdata\">第 1 章\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>P17–23\u003c/td>\u003ctd>Map/Reduce 输入输出 KV、Shuffle 归并、总体工作图\u003c/td>\u003ctd>\u003ca href=\"#chapter-principles\">第 2 章\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>P24–31\u003c/td>\u003ctd>Split 规则、SPLIT_SLOP、getSplits 与 RecordReader\u003c/td>\u003ctd>\u003ca href=\"#chapter-principles\">第 2 章\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>P32–35\u003c/td>\u003ctd>Map 并行性、数据本地性、三道课件原题\u003c/td>\u003ctd>\u003ca href=\"#chapter-principles\">第 2 章\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>P36–43\u003c/td>\u003ctd>Partition/Sort、Reduce、OutputFormat、part 文件\u003c/td>\u003ctd>\u003ca href=\"#chapter-principles\">第 2 章\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>P44–47\u003c/td>\u003ctd>RM/AM/NM/Container、七步调度、资源公平与容错\u003c/td>\u003ctd>\u003ca href=\"#chapter-yarn\">第 3 章\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>P48–54\u003c/td>\u003ctd>Map 端 Shuffle、100MB/80%、Combiner、Spill 与 Merge\u003c/td>\u003ctd>\u003ca href=\"#chapter-shuffle\">第 4 章\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>P55–58\u003c/td>\u003ctd>Reduce 端 Copy / Merge、两端归并区别\u003c/td>\u003ctd>\u003ca href=\"#chapter-shuffle\">第 4 章\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>P59–72\u003c/td>\u003ctd>WordCount、Python 代码、Linux、HDFS、hadoop jar 参数\u003c/td>\u003ctd>\u003ca href=\"#chapter-practice\">第 5 章\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>P73–76\u003c/td>\u003ctd>电商商品去重、set、yield、Streaming\u003c/td>\u003ctd>\u003ca href=\"#chapter-practice\">第 5 章\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>P77–85\u003c/td>\u003ctd>平均分/最高分、学号课程扩展题、七大特点总结\u003c/td>\u003ctd>\u003ca href=\"#chapter-practice\">第 5 章\u003c/a>\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"deep-note\">考试优先复习：P19–21、P24–31、P35、P39–47、P49–58、P63–72、P74–80。课件未明确给出的操作系统差异或 Hadoop 版本信息，在示例中均按可配置的环境参数处理。\u003c/p>\u003c/div>\u003c/details>\u003c/section>\n\u003csection class=\"interactive-section\" id=\"job-lab\">\u003cdiv class=\"section-eyebrow\">INTERACTIVE LAB 01 · PPT P44–45\u003c/div>\u003cdiv class=\"section-head\">\u003cdiv>\u003ch2>把作业调度当成一场施工\u003c/h2>\u003cp>RM、AM、NM、Container 不再是四个难背的缩写。\u003c/p>\u003c/div>\u003cspan class=\"section-flag\">重点考点\u003c/span>\u003c/div>\u003cdiv class=\"lab-box\">\u003ch3 class=\"lab-small-heading\">第一关 · 谁是谁？点击角色认识他\u003c/h3>\u003cdiv class=\"role-tabs\" id=\"role-tabs\" role=\"group\" aria-label=\"选择角色\">\u003c/div>\u003cdiv id=\"role-detail\" class=\"role-detail\" aria-live=\"polite\">\u003c/div>\u003cdiv class=\"lab-divider\">\u003c/div>\u003cdiv class=\"lab-heading-row\">\u003ch3 class=\"lab-small-heading\">第二关 · 7 步经历一遍\u003c/h3>\u003cspan class=\"step-count\" id=\"step-count\">01 / 07\u003c/span>\u003c/div>\u003cdiv class=\"stepper\">\u003cdiv class=\"step-dots\" id=\"step-dots\" aria-label=\"选择步骤\">\u003c/div>\u003cdiv id=\"step-detail\" class=\"step-detail\" aria-live=\"polite\">\u003c/div>\u003cdiv class=\"step-controls\">\u003cbutton class=\"btn-outline small\" id=\"prev-step\">← 上一步\u003c/button>\u003cbutton class=\"btn-primary small\" id=\"next-step\">下一步 →\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"takeaway\">\u003cstrong>考试一句话\u003c/strong>\u003cspan>RM 管全局资源；AM 管一个应用；NM 管本机容器；Container 提供 CPU / 内存；Task 真正执行计算。\u003c/span>\u003c/div>\u003c/section>\n\n        \u003csection class=\"interactive-section\" id=\"shuffle-lab\">\u003cdiv class=\"section-eyebrow\">INTERACTIVE LAB 02 · PPT P19–21 / 49–58\u003c/div>\u003cdiv class=\"section-head\">\u003cdiv>\u003ch2>Shuffle 分拣机\u003c/h2>\u003cp>输入一句话，亲眼看 Map、Shuffle、Reduce 怎么一步步改变数据。\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"lab-box\">\u003clabel class=\"input-label\" for=\"word-input\">编辑原始数据（英文单词用空格隔开）\u003c/label>\u003ctextarea id=\"word-input\" rows=\"2\" spellcheck=\"false\">Hello World Hello Hadoop\u003c/textarea>\u003cdiv class=\"stage-buttons\" id=\"stage-buttons\" role=\"group\" aria-label=\"数据处理阶段\">\u003c/div>\u003cdiv class=\"stage-result\">\u003cdiv class=\"stage-result-top\">\u003cspan id=\"stage-caption\">原始输入\u003c/span>\u003cspan id=\"stage-number\">1 / 4\u003c/span>\u003c/div>\u003cdiv id=\"shuffle-result\" class=\"data-output\" aria-live=\"polite\">\u003c/div>\u003c/div>\u003cdiv class=\"step-controls\">\u003cbutton class=\"btn-outline small\" id=\"reset-shuffle\">回到输入\u003c/button>\u003cbutton class=\"btn-primary small\" id=\"next-shuffle\">下一阶段 →\u003c/button>\u003c/div>\u003cp class=\"micro-note\" id=\"shuffle-explainer\">\u003c/p>\u003c/div>\u003c/section>\n\n        \u003csection class=\"interactive-section\" id=\"split-lab\">\u003cdiv class=\"section-eyebrow\">INTERACTIVE LAB 03 · PPT P24–28\u003c/div>\u003cdiv class=\"section-head\">\u003cdiv>\u003ch2>InputSplit 分片计算器\u003c/h2>\u003cp>Split 是“工作范围标签”，不是把硬盘文件切碎。输入容量试试看。\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"lab-box split-layout\">\u003cdiv>\u003clabel class=\"input-label\" for=\"file-size\">文件大小（MB）\u003c/label>\u003cinput type=\"number\" id=\"file-size\" value=\"300\" min=\"1\" max=\"1048576\" step=\"1\" />\u003clabel class=\"input-label\" for=\"block-size\">默认 Split 大小（MB）\u003c/label>\u003cselect id=\"block-size\">\u003coption value=\"64\">64 MB\u003c/option>\u003coption value=\"128\" selected>128 MB\u003c/option>\u003coption value=\"256\">256 MB\u003c/option>\u003c/select>\u003cp class=\"micro-note\">模拟普通可切分文本文件、默认 SPLIT_SLOP = 1.1；不适用于 gzip 等不可切分文件。\u003c/p>\u003c/div>\u003cdiv class=\"split-visual\">\u003cdiv class=\"split-result-number\">\u003cstrong id=\"split-count\">3\u003c/strong>\u003cspan>个逻辑 Split ≈ 个 Map Task\u003c/span>\u003c/div>\u003cdiv id=\"split-bars\" class=\"split-bars\" aria-label=\"Split 尺寸可视化\">\u003c/div>\u003cp id=\"split-explanation\" class=\"micro-note\">\u003c/p>\u003c/div>\u003c/div>\u003c/section>\n\n        \u003csection id=\"course\" class=\"course-wrap\">\u003cdiv class=\"chapter-page-intro\">\u003cdiv class=\"section-eyebrow\" id=\"course-label\">CHAPTER 01 / 05\u003c/div>\u003cdiv class=\"section-head\">\u003cdiv>\u003ch2 id=\"course-title\">为什么需要 MapReduce\u003c/h2>\u003cp id=\"course-desc\">每张卡片都按“直觉 → 比喻 → 准确表述 → 易错点”组织。\u003c/p>\u003c/div>\u003cdiv class=\"search-wrap\">\u003clabel for=\"lesson-search\" class=\"sr-only\">搜索知识点\u003c/label>\u003cspan aria-hidden=\"true\">⌕\u003c/span>\u003cinput id=\"lesson-search\" type=\"search\" placeholder=\"在本章搜索知识点…\" />\u003c/div>\u003c/div>\u003cdiv class=\"chapter-mini-status\" id=\"chapter-mini-status\" aria-live=\"polite\">\u003c/div>\u003c/div>\u003cdiv class=\"filter-line\">\u003cspan id=\"filtered-count\">38 个知识点\u003c/span>\u003cbutton class=\"btn-link\" id=\"chapter-focus-btn\">只看未掌握\u003c/button>\u003cbutton class=\"btn-link\" id=\"show-all\">显示全部\u003c/button>\u003cbutton class=\"btn-link\" id=\"reset-progress\">重置学习记录\u003c/button>\u003c/div>\u003cdiv id=\"chapters-container\">\u003c/div>\u003cdiv id=\"empty-search\" class=\"empty-state\" hidden>本章没有匹配的知识点，换个关键词或点击“显示全部”。\u003c/div>\u003c/section>\n\n        \u003csection id=\"exam\" class=\"exam-section\">\u003cdiv class=\"section-eyebrow\">EXAM MODE\u003c/div>\u003cdiv class=\"section-head\">\u003cdiv>\u003ch2>闭卷自测 · 当场判分\u003c/h2>\u003cp>先不看答案。选完后立即告诉你\u003cstrong>为什么选它、其他思路错在哪\u003c/strong>。\u003c/p>\u003c/div>\u003cspan class=\"section-flag\">考前冲刺\u003c/span>\u003c/div>\u003cdiv class=\"exam-panel\">\u003cdiv class=\"exam-controls\" id=\"exam-controls\">\u003clabel>考查范围\u003cselect id=\"exam-chapter\">\u003coption value=\"all\">全部五章\u003c/option>\u003c/select>\u003c/label>\u003clabel>题量\u003cselect id=\"exam-count\">\u003coption value=\"10\">随机 10 题\u003c/option>\u003coption value=\"20\">随机 20 题\u003c/option>\u003coption value=\"all\">全部题目\u003c/option>\u003c/select>\u003c/label>\u003cbutton id=\"start-exam\" class=\"btn-primary\">开始答题 →\u003c/button>\u003c/div>\u003cdiv id=\"exam-stage\" class=\"exam-stage\" hidden>\u003c/div>\u003cdiv id=\"exam-finish\" class=\"exam-finish\" hidden>\u003c/div>\u003c/div>\u003c/section>\n\n        \u003csection id=\"cheats\" class=\"cheats-section\">\u003cdiv class=\"section-eyebrow\">THE LAST 5 MINUTES\u003c/div>\u003cdiv class=\"section-head\">\u003cdiv>\u003ch2>考前一页速记\u003c/h2>\u003cp>不是缩写列表，而是“这个词到底管什么”。点击可展开考法与易错点。\u003c/p>\u003c/div>\u003c/div>\u003cdiv id=\"cheats-grid\" class=\"cheats-grid\">\u003c/div>\u003c/section>\n\n        \u003csection id=\"practice-code\" class=\"code-section\">\u003cdiv class=\"section-eyebrow\">PRACTICE · PPT P63–80\u003c/div>\u003cdiv class=\"section-head\">\u003cdiv>\u003ch2>可直接试的 Python + Linux 小实验\u003c/h2>\u003cp>和 PPT 一样用 Hadoop Streaming，但先在本地用管道检查 Map、排序、Reduce。\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"code-note\">这是\u003cstrong>演示用的 WordCount 示例\u003c/strong>。将三个文件放在同一目录，本地可直接测试；集群提交前请确认 Hadoop 已启动并上传 HDFS 数据。\u003c/div>\u003cdiv id=\"code-tabs\" class=\"code-tabs\" role=\"tablist\">\u003c/div>\u003cdiv class=\"code-wrap\">\u003cdiv class=\"code-title\">\u003cspan id=\"code-filename\">mapper.py\u003c/span>\u003cbutton id=\"copy-code\" class=\"copy-btn\">复制代码\u003c/button>\u003c/div>\u003cpre>\u003ccode id=\"code-content\">\u003c/code>\u003c/pre>\u003c/div>\u003cp class=\"micro-note\">命令中的 \u003ccode>$HADOOP_HOME\u003c/code> 是安装目录；Streaming jar 名称按你的 Hadoop 版本查找。文件不需要安装网页开发环境。\u003c/p>\u003c/section>\n        \u003cnav class=\"page-pager\" id=\"page-pager\" aria-label=\"板块翻页\">\n          \u003ca class=\"pager-link\" id=\"pager-prev\" href=\"#top\">\u003cspan class=\"pager-kicker\">← 上一板块\u003c/span>\u003cstrong id=\"pager-prev-text\">返回首页\u003c/strong>\u003c/a>\n          \u003cdiv class=\"pager-middle\">\u003cdiv class=\"pager-mark\" id=\"pager-mark\">01 / 08\u003c/div>\u003cspan>独立板块 · 按顺序学或目录跳转\u003c/span>\u003c/div>\n          \u003ca class=\"pager-link next\" id=\"pager-next\" href=\"#chapter-bigdata\">\u003cspan class=\"pager-kicker\">下一板块 →\u003c/span>\u003cstrong id=\"pager-next-text\">为什么需要 MapReduce\u003c/strong>\u003c/a>\n        \u003c/nav>\n        \u003cfooter class=\"footer\">\u003cdiv>\u003cstrong>MapReduce · 一章通\u003c/strong>\u003cspan>源自 85 页《MapReduce计算框架》课程讲义。页码为 PDF 页码；类比和代码注释为便于理解的教学扩展，不是课件原文。\u003c/span>\u003c/div>\u003ca href=\"#top\">返回顶部 ↑\u003c/a>\u003c/footer>\n      \u003c/main>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"mobile-overlay\" id=\"mobile-overlay\" hidden>\u003c/div>\n\u003ctemplate id=\"deep-template-bigdata\">\u003csection class=\"deep-section\" aria-label=\"本章深入讲解\">\u003cdiv class=\"deep-intro\">\u003cspan>DEEP DIVE · 课件逐项补全\u003c/span>\u003ch3>想真正学懂，再展开这些重点\u003c/h3>\u003cp>不是堆知识点：每张先给直观逻辑，再讲 PPT 中的正式概念和考试陷阱。点标题展开，读完可收起。\u003c/p>\u003c/div>\u003cdetails class=\"deep-module\">\u003csummary>\u003cspan class=\"deep-title\">四种大数据模式：一题区分\u003c/span>\u003cspan class=\"deep-pages\">P4–6\u003c/span>\u003cspan class=\"deep-desc\">不是看它是否“大数据”，而是看处理方式。\u003c/span>\u003c/summary>\u003cdiv class=\"deep-body\">\u003cp>想象一家超市：月底对十万张小票统一结算，是\u003cstrong>批处理\u003c/strong>；收银时每秒更新营业额，是\u003cstrong>流计算\u003c/strong>；寻找“哪些会员之间有推荐关系”，是\u003cstrong>图计算\u003c/strong>；店长随时搜索某商品库存，是\u003cstrong>交互查询\u003c/strong>。\u003c/p>\u003cdiv class=\"deep-table-scroll\">\u003ctable class=\"deep-table\">\u003cthead>\u003ctr>\u003cth>模式\u003c/th>\u003cth>用来干什么\u003c/th>\u003cth>PPT 中的代表产品\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>批处理\u003c/td>\u003ctd>批量离线分析\u003c/td>\u003ctd>MapReduce、Spark\u003c/td>\u003c/tr>\u003ctr>\u003ctd>流计算\u003c/td>\u003ctd>持续到来的实时数据\u003c/td>\u003ctd>Storm、S4、Flume\u003c/td>\u003c/tr>\u003ctr>\u003ctd>图计算\u003c/td>\u003ctd>节点之间的关系\u003c/td>\u003ctd>GraphX、Pregel\u003c/td>\u003c/tr>\u003ctr>\u003ctd>交互查询\u003c/td>\u003ctd>按需查询数据\u003c/td>\u003ctd>Hive、Cassandra、Impala\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"deep-note\">应试：选择题问“MapReduce 适合哪种任务？”优先选\u003cstrong>大规模离线批处理\u003c/strong>，不是毫秒级交互或不断到来的流数据。\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"deep-module\">\u003csummary>\u003cspan class=\"deep-title\">七大特点不是七条死记硬背\u003c/span>\u003cspan class=\"deep-pages\">P8–16、P82–85\u003c/span>\u003cspan class=\"deep-desc\">用“连锁工厂”一次记住七个特点。\u003c/span>\u003c/summary>\u003cdiv class=\"deep-body\">\u003col class=\"deep-steps\">\u003cli>\u003cstrong>横向扩展\u003c/strong>\u003cp>订单更多就增开工厂（加机器），不是只买一台更强的机器。\u003c/p>\u003c/li>\u003cli>\u003cstrong>失效常态\u003c/strong>\u003cp>工厂有人停工也不稀奇，检测并重试。\u003c/p>\u003c/li>\u003cli>\u003cstrong>计算靠近数据\u003c/strong>\u003cp>让就近工厂加工就近仓库的货，而非把货都搬到总部。\u003c/p>\u003c/li>\u003cli>\u003cstrong>顺序访问\u003c/strong>\u003cp>像看流水线传送带，按顺序批量读盘，避免频繁随机寻找。\u003c/p>\u003c/li>\u003cli>\u003cstrong>分布并行\u003c/strong>\u003cp>许多工人独立处理不同批次，同时干活。\u003c/p>\u003c/li>\u003cli>\u003cstrong>隐藏系统细节\u003c/strong>\u003cp>老板只给加工规则，不需要自己处理每个工人怎么通信重试。\u003c/p>\u003c/li>\u003cli>\u003cstrong>平滑扩展\u003c/strong>\u003cp>数据扩大、机器变多时，应当能继续增加整体处理能力。\u003c/p>\u003c/li>\u003c/ol>\u003cp class=\"deep-note\">这七项来自课件 P82–85。**易错：**“高容错”不等于中间结果永远不丢，而是丢失后可以重新执行任务。\u003c/p>\u003c/div>\u003c/details>\u003c/section>\u003c/template>\n\u003ctemplate id=\"deep-template-principles\">\u003csection class=\"deep-section\" aria-label=\"本章深入讲解\">\u003cdiv class=\"deep-intro\">\u003cspan>DEEP DIVE · 课件逐项补全\u003c/span>\u003ch3>想真正学懂，再展开这些重点\u003c/h3>\u003cp>不是堆知识点：每张先给直观逻辑，再讲 PPT 中的正式概念和考试陷阱。点标题展开，读完可收起。\u003c/p>\u003c/div>\u003cdetails class=\"deep-module\">\u003csummary>\u003cspan class=\"deep-title\">Map / Shuffle / Reduce 的真实输入输出\u003c/span>\u003cspan class=\"deep-pages\">P18–21、P36–39\u003c/span>\u003cspan class=\"deep-desc\">同样叫 key，三个时刻的含义可以不同。\u003c/span>\u003c/summary>\u003cdiv class=\"deep-body\">\u003cp>把 \u003ccode>Hello World Hello Hadoop\u003c/code> 当作一张原始订单。Map 看见的是\u003cstrong>文件位置 + 原始一行\u003c/strong>；程序员把它变成业务标签“单词 + 1”；Shuffle 整理相同标签；Reduce 最后求和。\u003c/p>\u003cdiv class=\"deep-table-scroll\">\u003ctable class=\"deep-table\">\u003cthead>\u003ctr>\u003cth>阶段\u003c/th>\u003cth>数据的形状\u003c/th>\u003cth>Hello 示例\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>TextInputFormat 输入 Map\u003c/td>\u003ctd>(字节偏移,一行文本)\u003c/td>\u003ctd>(0, \"Hello World Hello Hadoop\")\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Map 输出\u003c/td>\u003ctd>多条 (业务key,单个value)\u003c/td>\u003ctd>(Hello,1)、(World,1)、(Hello,1)、(Hadoop,1)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Shuffle 后逻辑分组\u003c/td>\u003ctd>(业务key,一组value)\u003c/td>\u003ctd>(Hello,&lt;1,1&gt;)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>原生 Reduce 输出\u003c/td>\u003ctd>每个 key 的统计结果\u003c/td>\u003ctd>(Hello,2)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"deep-note\">P20 的 Iterable 是\u003cstrong>Java MapReduce API\u003c/strong> 的抽象；P65–66 使用 Hadoop Streaming + Python 时，脚本收到的是\u003cstrong>已排序的逐行文本\u003c/strong>，必须用 last_key 判断何时换组。\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"deep-module\">\u003csummary>\u003cspan class=\"deep-title\">分片的计算与“不读取数据”的区别\u003c/span>\u003cspan class=\"deep-pages\">P24–28\u003c/span>\u003cspan class=\"deep-desc\">逻辑派工单 ≠ 把文件物理切成小文件。\u003c/span>\u003c/summary>\u003cdiv class=\"deep-body\">\u003cp>例如有一个 300MB 的文本文件，默认 split 128MB。可以生成范围 \u003ccode>[0,128)\u003c/code>、\u003ccode>[128,256)\u003c/code>、\u003ccode>[256,300)\u003c/code>；每个分片仅记录\u003cstrong>路径、起点、长度、存储位置\u003c/strong>。实际读取要等 MapTask 启动。\u003c/p>\u003cdiv class=\"deep-table-scroll\">\u003ctable class=\"deep-table\">\u003cthead>\u003ctr>\u003cth>题目\u003c/th>\u003cth>结果\u003c/th>\u003cth>为什么\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1GB 文本\u003c/td>\u003ctd>约 8 个 Split\u003c/td>\u003ctd>1024÷128=8\u003c/td>\u003c/tr>\u003ctr>\u003ctd>60MB 文本\u003c/td>\u003ctd>1 个 Split\u003c/td>\u003ctd>文件不足默认切分大小\u003c/td>\u003c/tr>\u003ctr>\u003ctd>150MB 文本\u003c/td>\u003ctd>2 个 Split\u003c/td>\u003ctd>150/128=1.172&gt;1.1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>独立两个文件 60MB + 150MB\u003c/td>\u003ctd>按常见默认策略 1+2=3 个\u003c/td>\u003ctd>不是直接把总大小 210MB 当成一个文件切\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"deep-note\">P25 的 SPLIT_SLOP=1.1 是处理尾巴的经验规则；也要记：TextInputFormat 不把一条文本记录拆给两个 Map，gzip 这类不可切分压缩文件可能只形成一个 Split。\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"deep-module\">\u003csummary>\u003cspan class=\"deep-title\">从提交到真正读取：4 个方法在哪发生？\u003c/span>\u003cspan class=\"deep-pages\">P27–31\u003c/span>\u003cspan class=\"deep-desc\">老师很容易考 getSplits 和 RecordReader 的执行时机。\u003c/span>\u003c/summary>\u003cdiv class=\"deep-body\">\u003col class=\"deep-steps\">\u003cli>\u003cstrong>客户端 getSplits()\u003c/strong>\u003cp>先看文件大小、Block、副本位置等元数据，生成多个 InputSplit；此时没有真正读取全文。\u003c/p>\u003c/li>\u003cli>\u003cstrong>集群安排 MapTask\u003c/strong>\u003cp>通常一个 InputSplit 对应一个 MapTask，尽可能调到数据附近，减少网络传输。\u003c/p>\u003c/li>\u003cli>\u003cstrong>MapTask createRecordReader()\u003c/strong>\u003cp>在执行任务的节点建立负责读记录的 RecordReader 对象。\u003c/p>\u003c/li>\u003cli>\u003cstrong>RecordReader.nextKeyValue()\u003c/strong>\u003cp>真正逐条读：TextInputFormat 通常每次返回 (LongWritable 行起始字节位置, Text 行内容)。\u003c/p>\u003c/li>\u003cli>\u003cstrong>map() 执行业务逻辑\u003c/strong>\u003cp>代码一行行加工，生成中间键值对；写入内存缓冲区并进入 Shuffle。\u003c/p>\u003c/li>\u003c/ol>\u003cp class=\"deep-note\">考试陷阱：“算 Split 是否要从 DataNode 读文本？”\u003cstrong>不要。\u003c/strong>而“Map 真的读数据吗？”\u003cstrong>要，RecordReader 在此阶段读取。\u003c/strong>\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"deep-module\">\u003csummary>\u003cspan class=\"deep-title\">Reduce 阶段和输出阶段：1 个 Reducer 到底产生几个文件？\u003c/span>\u003cspan class=\"deep-pages\">P39–42\u003c/span>\u003cspan class=\"deep-desc\">Map 草稿在本地，最终作业结果在 HDFS。\u003c/span>\u003c/summary>\u003cdiv class=\"deep-body\">\u003cp>假设分片 8 个、配置 \u003ccode>mapreduce.job.reduces=2\u003c/code>。系统一般有\u003cstrong>8 个 MapTask、2 个 ReduceTask\u003c/strong>。两个 Reducer 分别写出 \u003ccode>part-r-00000\u003c/code>、\u003ccode>part-r-00001\u003c/code>（不考虑其他特殊输出配置）。\u003c/p>\u003cdiv class=\"deep-table-scroll\">\u003ctable class=\"deep-table\">\u003cthead>\u003ctr>\u003cth>比较项\u003c/th>\u003cth>Map 中间结果\u003c/th>\u003cth>Reduce 最终结果\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>存储位置\u003c/td>\u003ctd>节点本地磁盘（Spill/Merge）\u003c/td>\u003ctd>HDFS（课件讲到默认 3 副本）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>作用\u003c/td>\u003ctd>供 Reduce 端跨节点拉取\u003c/td>\u003ctd>交付下游/用户使用\u003c/td>\u003c/tr>\u003ctr>\u003ctd>文件格式\u003c/td>\u003ctd>分区后的中间文件\u003c/td>\u003ctd>TextOutputFormat：key\\tvalue\\n\u003c/td>\u003c/tr>\u003ctr>\u003ctd>异常时\u003c/td>\u003ctd>节点坏掉可能需要重算\u003c/td>\u003ctd>作业输出目录已存在通常拒绝提交\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"deep-note\">P39 写“所有 Map 完成 Reduce 才开始”，但 P54–56 明确 Reduce 可以提前开始 \u003cstrong>Copy\u003c/strong> 已完成 Map 的输出。准确区分 Copy 与完整 reduce() 计算即可。\u003c/p>\u003c/div>\u003c/details>\u003c/section>\u003c/template>\n\u003ctemplate id=\"deep-template-yarn\">\u003csection class=\"deep-section\" aria-label=\"本章深入讲解\">\u003cdiv class=\"deep-intro\">\u003cspan>DEEP DIVE · 课件逐项补全\u003c/span>\u003ch3>想真正学懂，再展开这些重点\u003c/h3>\u003cp>不是堆知识点：每张先给直观逻辑，再讲 PPT 中的正式概念和考试陷阱。点标题展开，读完可收起。\u003c/p>\u003c/div>\u003cdetails class=\"deep-module\">\u003csummary>\u003cspan class=\"deep-title\">“施工队”与真实技术名词的一一对应\u003c/span>\u003cspan class=\"deep-pages\">P44–45\u003c/span>\u003cspan class=\"deep-desc\">比喻用来记顺序，但答题要写真实术语。\u003c/span>\u003c/summary>\u003cdiv class=\"deep-body\">\u003cdiv class=\"deep-table-scroll\">\u003ctable class=\"deep-table\">\u003cthead>\u003ctr>\u003cth>现实角色\u003
