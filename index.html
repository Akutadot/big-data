c/th>\u003cth>课件术语\u003c/th>\u003cth>真正职责\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>集团总部\u003c/td>\u003ctd>ResourceManager (RM)\u003c/td>\u003ctd>全局资源管理与调度，安排 Container\u003c/td>\u003c/tr>\u003ctr>\u003ctd>单个工程项目经理\u003c/td>\u003ctd>ApplicationMaster (AM)\u003c/td>\u003ctd>本应用申请资源、安排任务、监控故障\u003c/td>\u003c/tr>\u003ctr>\u003ctd>每个工地现场主管\u003c/td>\u003ctd>NodeManager (NM)\u003c/td>\u003ctd>管理本机容器、启动任务\u003c/td>\u003c/tr>\u003ctr>\u003ctd>工位 + 电力等配额\u003c/td>\u003ctd>Container\u003c/td>\u003ctd>分配 CPU、内存等资源的逻辑单位\u003c/td>\u003c/tr>\u003ctr>\u003ctd>分拣与汇总工人\u003c/td>\u003ctd>MapTask / ReduceTask\u003c/td>\u003ctd>实际执行计算\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003col class=\"deep-steps\">\u003cli>\u003cstrong>客户交作业给 RM\u003c/strong>\u003cp>Client → RM。\u003c/p>\u003c/li>\u003cli>\u003cstrong>RM 先给 AM 配工位\u003c/strong>\u003cp>首个 Container 内启动 AM。\u003c/p>\u003c/li>\u003cli>\u003cstrong>AM 申请更多工位\u003c/strong>\u003cp>AM 向 RM 申请 Map/Reduce 任务所需 Container。\u003c/p>\u003c/li>\u003cli>\u003cstrong>AM 找现场主管派人\u003c/strong>\u003cp>AM 与 NM 协同启动任务。\u003c/p>\u003c/li>\u003cli>\u003cstrong>工人干活\u003c/strong>\u003cp>Map → Shuffle → Reduce。\u003c/p>\u003c/li>\u003cli>\u003cstrong>经理巡检失败重跑\u003c/strong>\u003cp>AM 监控、故障重试。\u003c/p>\u003c/li>\u003cli>\u003cstrong>交工报告并释放工位\u003c/strong>\u003cp>AM 向 RM 报完成，Client 查看成果。\u003c/p>\u003c/li>\u003c/ol>\u003cp class=\"deep-note\">口诀：\u003cstrong>交、启、申、派、做、盯、收\u003c/strong>。考试不要说“Container=计算机器”或“RM 负责每个 Map 的业务计算”。\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"deep-module\">\u003csummary>\u003cspan class=\"deep-title\">两种调度器、三层容错：如何记考点\u003c/span>\u003cspan class=\"deep-pages\">P46–47\u003c/span>\u003cspan class=\"deep-desc\">分工位、分数据、出故障，各是不同问题。\u003c/span>\u003c/summary>\u003cdiv class=\"deep-body\">\u003cdiv class=\"deep-table-scroll\">\u003ctable class=\"deep-table\">\u003cthead>\u003ctr>\u003cth>场景\u003c/th>\u003cth>负责机制\u003c/th>\u003cth>要点\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>部门应分配多少 CPU/内存\u003c/td>\u003ctd>YARN Scheduler\u003c/td>\u003ctd>Capacity 强调队列配额；Fair 强调公平共享\u003c/td>\u003c/tr>\u003ctr>\u003ctd>某个 key 该交哪个 Reducer\u003c/td>\u003ctd>Partitioner / HashPartitioner\u003c/td>\u003ctd>相同 key 同一 Reducer；热点 key 可倾斜\u003c/td>\u003c/tr>\u003ctr>\u003ctd>任务异常退出\u003c/td>\u003ctd>AM 负责重试/调度\u003c/td>\u003ctd>可更换节点重新执行\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DataNode/节点故障\u003c/td>\u003ctd>任务与本地 Map 输出重建\u003c/td>\u003ctd>Spill 丢失，已完成 Map 也可能重跑\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ApplicationMaster 故障\u003c/td>\u003ctd>RM 负责重启 AM\u003c/td>\u003ctd>YARN 可通过恢复机制继续协调\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"deep-note\">课件还强调\u003cstrong>幂等性\u003c/strong>：同一任务重跑应得到相同结果且尽量避免外部副作用。\u003c/p>\u003c/div>\u003c/details>\u003c/section>\u003c/template>\n\u003ctemplate id=\"deep-template-shuffle\">\u003csection class=\"deep-section\" aria-label=\"本章深入讲解\">\u003cdiv class=\"deep-intro\">\u003cspan>DEEP DIVE · 课件逐项补全\u003c/span>\u003ch3>想真正学懂，再展开这些重点\u003c/h3>\u003cp>不是堆知识点：每张先给直观逻辑，再讲 PPT 中的正式概念和考试陷阱。点标题展开，读完可收起。\u003c/p>\u003c/div>\u003cdetails class=\"deep-module\">\u003csummary>\u003cspan class=\"deep-title\">Map 端 Shuffle：到底先干什么、后干什么\u003c/span>\u003cspan class=\"deep-pages\">P49–54\u003c/span>\u003cspan class=\"deep-desc\">想象分拣工作台：先放桌上，再分拣、打包、入库。\u003c/span>\u003c/summary>\u003cdiv class=\"deep-body\">\u003col class=\"deep-steps\">\u003cli>\u003cstrong>Map 输出进入环形缓冲区\u003c/strong>\u003cp>P50：常见默认 100MB，先在内存接收结果，减少磁盘写入频率。\u003c/p>\u003c/li>\u003cli>\u003cstrong>分区/排序\u003c/strong>\u003cp>按 key 的分区号决定哪个 Reducer 收，分区内按 key 排序。\u003c/p>\u003c/li>\u003cli>\u003cstrong>可选 Combiner\u003c/strong>\u003cp>如果配置且适用，先把相同 key 的值局部汇总；不能依赖它必然执行。\u003c/p>\u003c/li>\u003cli>\u003cstrong>达到阈值 Spill\u003c/strong>\u003cp>P51：约 80% 时后台开始溢写到\u003cstrong>本地磁盘\u003c/strong>。可能多次 Spill。\u003c/p>\u003c/li>\u003cli>\u003cstrong>Map 端 Merge\u003c/strong>\u003cp>在 Map 完成前把本 Map 的多个 Spill 文件做有序归并，留作 Reduce Copy。\u003c/p>\u003c/li>\u003c/ol>\u003cp class=\"deep-note\">对照应试：\u003cstrong>Partition 决定去向，Sort 决定顺序，Combiner 可选省流量，Spill 是写本地磁盘，Merge 是文件归并。\u003c/strong>\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"deep-module\">\u003csummary>\u003cspan class=\"deep-title\">为什么 Combiner 不适合直接算平均数\u003c/span>\u003cspan class=\"deep-pages\">P52–53\u003c/span>\u003cspan class=\"deep-desc\">分组平均数只有在各组样本量相同时才可直接平均。\u003c/span>\u003c/summary>\u003cdiv class=\"deep-body\">\u003cp>假设 A 同学只修一门课，成绩 100；B 同学修三门，成绩 50、50、50。\u003c/p>\u003cdiv class=\"deep-table-scroll\">\u003ctable class=\"deep-table\">\u003cthead>\u003ctr>\u003cth>小组\u003c/th>\u003cth>数据\u003c/th>\u003cth>小组平均分\u003c/th>\u003cth>样本量\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>A\u003c/td>\u003ctd>100\u003c/td>\u003ctd>100\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>B\u003c/td>\u003ctd>50、50、50\u003c/td>\u003ctd>50\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>错误做法：\u003ccode>(100 + 50) / 2 = 75\u003c/code>。正确做法：\u003ccode>(100 + 50 + 50 + 50) / 4 = 62.5\u003c/code>。\u003c/p>\u003cp>因此要把小组合并信息表示成 \u003ccode>(sum, count)\u003c/code>：A=(100,1)，B=(150,3)，最终=(250,4)，平均分 62.5。\u003c/p>\u003cp class=\"deep-note\">WordCount 的相加可以安全局部预聚合；平均值只传递一个“avg”一般不安全。\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"deep-module\">\u003csummary>\u003cspan class=\"deep-title\">Map Merge 与 Reduce Merge：一道表格题\u003c/span>\u003cspan class=\"deep-pages\">P54–58\u003c/span>\u003cspan class=\"deep-desc\">二者都“归并有序流”，但是文件来源完全不同。\u003c/span>\u003c/summary>\u003cdiv class=\"deep-body\">\u003cdiv class=\"deep-table-scroll\">\u003ctable class=\"deep-table\">\u003cthead>\u003ctr>\u003cth>比较维度\u003c/th>\u003cth>Map 端 Merge\u003c/th>\u003cth>Reduce 端 Merge\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>归并的数据来自哪里\u003c/td>\u003ctd>同一个 Map 的多个 Spill 文件\u003c/td>\u003ctd>多个 Map 的同一个 Reducer 分区\u003c/td>\u003c/tr>\u003ctr>\u003ctd>何时做\u003c/td>\u003ctd>Map 完成前\u003c/td>\u003ctd>Reduce 端 Copy 后\u003c/td>\u003c/tr>\u003ctr>\u003ctd>合并目的\u003c/td>\u003ctd>形成有序分区文件便于传输\u003c/td>\u003ctd>把跨 Map 的相同 key 聚拢供 Reduce 计算\u003c/td>\u003c/tr>\u003ctr>\u003ctd>之后做什么\u003c/td>\u003ctd>供 Reduce 拉取对应分区\u003c/td>\u003ctd>把分组数据交给 reduce()\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Reduce 端不是等最后才开始一切：每个 Map 完成时，对应分区数据就可以\u003cstrong>开始 Copy\u003c/strong>。不过最终计算同一 key 的全局结果，需要收齐相关输入。\u003c/p>\u003cp class=\"deep-note\">Reduce 端 Copy 常使用多个并行线程；课件举例 5 条线程，这个数可以配置。\u003c/p>\u003c/div>\u003c/details>\u003c/section>\u003c/template>\n\u003ctemplate id=\"deep-template-practice\">\u003csection class=\"deep-section\" aria-label=\"本章深入讲解\">\u003cdiv class=\"deep-intro\">\u003cspan>DEEP DIVE · 课件逐项补全\u003c/span>\u003ch3>想真正学懂，再展开这些重点\u003c/h3>\u003cp>不是堆知识点：每张先给直观逻辑，再讲 PPT 中的正式概念和考试陷阱。点标题展开，读完可收起。\u003c/p>\u003c/div>\u003cdetails class=\"deep-module\">\u003csummary>\u003cspan class=\"deep-title\">例题一：WordCount 从原始文件一步算到输出\u003c/span>\u003cspan class=\"deep-pages\">P59–67\u003c/span>\u003cspan class=\"deep-desc\">先看中间结果，再对照每行 Python 代码。\u003c/span>\u003c/summary>\u003cdiv class=\"deep-body\">\u003cp>课件数据 \u003ccode>aa.txt\u003c/code> 共四行：\u003c/p>\u003cdiv class=\"deep-code-title\">aa.txt\u003c/div>\u003cpre class=\"deep-code\">\u003ccode>Hello Bigdata\nBye Bigdata\nHello Hadoop\nBye Hadoop\u003c/code>\u003c/pre>\u003cdiv class=\"deep-table-scroll\">\u003ctable class=\"deep-table\">\u003cthead>\u003ctr>\u003cth>阶段\u003c/th>\u003cth>会看到什么\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Mapper\u003c/td>\u003ctd>hello 1、bigdata 1、bye 1、bigdata 1、hello 1、hadoop 1、bye 1、hadoop 1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Shuffle 排序归并\u003c/td>\u003ctd>bigdata &lt;1,1&gt;；bye &lt;1,1&gt;；hadoop &lt;1,1&gt;；hello &lt;1,1&gt;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reducer\u003c/td>\u003ctd>bigdata 2；bye 2；hadoop 2；hello 2\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"deep-code-title\">word_mapper.py：每条记录如何转换\u003c/div>\u003cpre class=\"deep-code\">\u003ccode>import sys\nfor line in sys.stdin:                  # 从标准输入逐行读取\n    line = line.strip().lower()         # 去换行、转小写\n    words = line.split()                # 按空白拆成单词\n    for word in words:\n        print(&quot;%s\\t%d&quot; % (word, 1))    # 输出：单词 + TAB + 1\u003c/code>\u003c/pre>\u003cp>\u003cstrong>逐行讲：\u003c/strong>\u003ccode>sys.stdin\u003c/code> 是 Linux 管道或 Hadoop Streaming 送来的输入；\u003ccode>strip()\u003c/code> 去掉换行；\u003ccode>lower()\u003c/code> 避免 Hello 与 hello 分成不同 key；\u003ccode>split()\u003c/code> 按空白拆词；\u003ccode>\"%s\\t%d\" % (word,1)\u003c/code> 中 \u003ccode>%s\u003c/code> 放字符串，\u003ccode>%d\u003c/code> 放整数，\u003ccode>\\t\u003c/code> 是制表符，末尾 \u003ccode>%\u003c/code> 是旧式格式化运算符。\u003c/p>\u003cdiv class=\"deep-code-title\">word_reducer.py：为什么需要 last_key\u003c/div>\u003cpre class=\"deep-code\">\u003ccode>import sys\nlast_key = None\nrunning_total = 0\nfor line in sys.stdin:\n    key, value = line.strip().split(&quot;\\t&quot;, 1)\n    value = int(value)\n    if last_key is not None and key != last_key:\n        print(&quot;%s\\t%d&quot; % (last_key, running_total))\n        running_total = 0\n    last_key = key\n    running_total += value\nif last_key is not None:\n    print(&quot;%s\\t%d&quot; % (last_key, running_total))\u003c/code>\u003c/pre>\u003cp>\u003cstrong>关键逻辑：\u003c/strong>\u003ccode>last_key=None\u003c/code> 说明尚无上一组；当 \u003ccode>key != last_key\u003c/code>，先输出上一组并将计数清零；\u003ccode>running_total += value\u003c/code> 累加本组的所有 1；\u003cstrong>循环结束补输出最后一组\u003c/strong>，否则最后一个单词永远不会被打印。\u003c/p>\u003cp class=\"deep-note\">课件 P64 演示可选 Combiner 的效果，不代表 Python Mapper 自己把相同 word 合并。\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"deep-module\">\u003csummary>\u003cspan class=\"deep-title\">实验命令全程：从 Linux 到 HDFS 到 hadoop jar\u003c/span>\u003cspan class=\"deep-pages\">P67–72\u003c/span>\u003cspan class=\"deep-desc\">每条命令都说明要解决什么问题。\u003c/span>\u003c/summary>\u003cdiv class=\"deep-body\">\u003cdiv class=\"deep-code-title\">顺序运行的完整命令（Hadoop 已正确配置为前提）\u003c/div>\u003cpre class=\"deep-code\">\u003ccode># ① 检查是否安装并启动 Hadoop（若已运行则无需再启动）\necho &quot;$HADOOP_HOME&quot;\nhadoop version\njps\n# 环境需要启动时（启动方式依部署而异）：\n# &quot;$HADOOP_HOME/sbin/start-all.sh&quot;\n\n# ② 建目录、写数据，创建 mapper.py 和 reducer.py\nmkdir -p ~/mr_demo &amp;&amp; cd ~/mr_demo\nprintf &#x27;Hello Bigdata\\nBye Bigdata\\nHello Hadoop\\nBye Hadoop\\n&#x27; &gt; aa.txt\n# 用编辑器把上方 Mapper、Reducer 分别保存成 mapper.py / reducer.py\n\n# ③ 本地三级验证（用 sort 模拟 Shuffle 排序）\ncat aa.txt | python3 mapper.py\ncat aa.txt | python3 mapper.py | sort\ncat aa.txt | python3 mapper.py | sort | python3 reducer.py\n\n# ④ 上传输入数据到 HDFS\nhadoop fs -mkdir -p /user/$USER/mr_input\nhadoop fs -put -f aa.txt /user/$USER/mr_input/\n\n# ⑤ 查找当前机器上的 Streaming JAR，避免写死版本\nSTREAMING_JAR=$(find &quot;$HADOOP_HOME/share/hadoop/tools/lib&quot; -name &#x27;hadoop-streaming*.jar&#x27; | head -n 1)\necho &quot;$STREAMING_JAR&quot;\n\n# ⑥ 旧输出目录必须删除，否则会报错\nhadoop fs -rm -r -f /user/$USER/mr_output\n\n# ⑦ 向 Hadoop 提交一个 Streaming 作业\nhadoop jar &quot;$STREAMING_JAR&quot; -files mapper.py,reducer.py -mapper &#x27;python3 mapper.py&#x27; -reducer &#x27;python3 reducer.py&#x27; -input /user/$USER/mr_input -output /user/$USER/mr_output\n\n# ⑧ 查看结果（结果存储在 HDFS 而不是当前 Linux 目录）\nhadoop fs -cat /user/$USER/mr_output/part-*\u003c/code>\u003c/pre>\u003cdiv class=\"deep-table-scroll\">\u003ctable class=\"deep-table\">\u003cthead>\u003ctr>\u003cth>命令或参数\u003c/th>\u003cth>做什么\u003c/th>\u003cth>最常错在哪里\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>cat file | python3 mapper.py\u003c/code>\u003c/td>\u003ctd>把本地文件通过标准输入交给 Mapper\u003c/td>\u003ctd>\u003ccode>|\u003c/code> 是管道，不是文件名的一部分\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>| sort |\u003c/code>\u003c/td>\u003ctd>模拟 Hadoop 按 key 排序的效果\u003c/td>\u003ctd>这里只是本地验证，不等于完整分布式 Shuffle\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>hadoop fs -mkdir/-put\u003c/code>\u003c/td>\u003ctd>在 HDFS 建输入目录并上传\u003c/td>\u003ctd>不要和 Linux 本地目录混淆\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>hadoop jar ...\u003c/code>\u003c/td>\u003ctd>提交 Hadoop Streaming 作业\u003c/td>\u003ctd>jar 是运行框架，不是 Python 编译产物\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>-files\u003c/code>\u003c/td>\u003ctd>分发当前目录的 Python 脚本\u003c/td>\u003ctd>文件名要与 \u003ccode>-mapper/-reducer\u003c/code> 一致\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>-mapper/-reducer\u003c/code>\u003c/td>\u003ctd>指定两个脚本进程如何执行\u003c/td>\u003ctd>任务节点必须能运行 python3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>-input/-output\u003c/code>\u003c/td>\u003ctd>指定 HDFS 输入、输出路径\u003c/td>\u003ctd>输出目录开始时必须不存在\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>hadoop fs -cat .../part-*\u003c/code>\u003c/td>\u003ctd>从 HDFS 读最终结果\u003c/td>\u003ctd>不是简单的 \u003ccode>cat /output\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"deep-note\">原 PPT 用 \u003ccode>hadoop-streaming-3.0.0.jar\u003c/code>；那只是课堂环境示例。实际必须查看本机版本，避免在别的 Hadoop 环境运行失败。\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"deep-module\">\u003csummary>\u003cspan class=\"deep-title\">`.jar` 是什么？为什么写 Python 也要 Hadoop JAR？\u003c/span>\u003cspan class=\"deep-pages\">P68–69\u003c/span>\u003cspan class=\"deep-desc\">最常问的三件事：JAR 是谁、数据在哪、参数干什么。\u003c/span>\u003c/summary>\u003cdiv class=\"deep-body\">\u003cp>\u003cstrong>JAR（Java Archive）\u003c/strong> 是 Java 程序及资源的归档文件。Hadoop 本身主要基于 Java；\u003cstrong>Streaming JAR 是 Hadoop 提供的“任务驱动器/翻译员”\u003c/strong>，负责按 MapReduce 规则调度、把输入转给你的 Python 脚本，并读取标准输出。\u003c/p>\u003cdiv class=\"deep-code-title\">一条命令拆成八段\u003c/div>\u003cpre class=\"deep-code\">\u003ccode>hadoop jar &lt;hadoop-streaming*.jar&gt; \\\n  -files mapper.py,reducer.py \\\n  -mapper &#x27;python3 mapper.py&#x27; \\\n  -reducer &#x27;python3 reducer.py&#x27; \\\n  -input /user/name/mr_input \\\n  -output /user/name/mr_output\u003c/code>\u003c/pre>\u003col class=\"deep-steps\">\u003cli>\u003cstrong>hadoop jar\u003c/strong>\u003cp>告诉 Hadoop“运行某个 JAR 作业”。\u003c/p>\u003c/li>\u003cli>\u003cstrong>\u003chadoop-streaming*.jar>\u003c/strong>\u003cp>Streaming 框架入口；不是成绩或单词文件。\u003c/p>\u003c/li>\u003cli>\u003cstrong>-files\u003c/strong>\u003cp>把本地脚本复制到任务运行环境。\u003c/p>\u003c/li>\u003cli>\u003cstrong>-mapper / -reducer\u003c/strong>\u003cp>指定每个 Task 启动什么命令，例如 python3 mapper.py。\u003c/p>\u003c/li>\u003cli>\u003cstrong>-input\u003c/strong>\u003cp>InputFormat 将读取哪些 HDFS 数据。\u003c/p>\u003c/li>\u003cli>\u003cstrong>-output\u003c/strong>\u003cp>最终结果写到哪个新建的 HDFS 目录。\u003c/p>\u003c/li>\u003c/ol>\u003cp class=\"deep-note\">“Python 程序”与“运行 Hadoop Streaming 的 JAR”是\u003cstrong>不同层\u003c/strong>：前者实现业务 Map/Reduce，后者实现框架对接。仅本地调试 \u003ccode>cat | python | sort | python\u003c/code> 不需要 JAR。\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"deep-module\">\u003csummary>\u003cspan class=\"deep-title\">例题二：电商收藏商品去重（课件 set + 更省内存的按 key 去重）\u003c/span>\u003cspan class=\"deep-pages\">P73–76\u003c/span>\u003cspan class=\"deep-desc\">先辨别“商品被收藏过”与“有多少人收藏”。\u003c/span>\u003c/summary>\u003cdiv class=\"deep-body\">\u003cdiv class=\"deep-code-title\">课堂输入示例（列之间是 TAB）\u003c/div>\u003cpre class=\"deep-code\">\u003ccode>10175\t100481\t2023-10-20-16:54:31\n10181\t100521\t2023-10-20-16:55:20\n20133\t100481\t2023-10-20-17:02:31\n20256\t100674\t2023-10-20-17:22:09\u003c/code>\u003c/pre>\u003cp>要回答“哪些商品出现过”，所以 \u003cstrong>Mapper 必须选第 2 列商品 ID\u003c/strong>，不能选用户 ID，也不需要保留日期。\u003c/p>\u003cdiv class=\"deep-code-title\">mapper.py\u003c/div>\u003cpre class=\"deep-code\">\u003ccode>import sys\nfor line in sys.stdin:\n    data = line.strip().split(&quot;\\t&quot;)  # 用户ID,商品ID,时间\n    if len(data) &gt;= 2:\n        print(f&quot;{data[1]}\\t1&quot;)      # key=商品ID，不是用户ID\u003c/code>\u003c/pre>\u003cdiv class=\"deep-code-title\">reducer.py：排序后不同商品只输出一次\u003c/div>\u003cpre class=\"deep-code\">\u003ccode>import sys\nlast_product = None\nfor line in sys.stdin:\n    product, _ = line.strip().split(&quot;\\t&quot;, 1)\n    if product != last_product:      # key 已排序，同商品挨在一起\n        print(product)              # 每个商品只输出一次\n        last_product = product\u003c/code>\u003c/pre>\u003cdiv class=\"deep-table-scroll\">\u003ctable class=\"deep-table\">\u003cthead>\u003ctr>\u003cth>阶段\u003c/th>\u003cth>核心输出\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Map\u003c/td>\u003ctd>(100481,1)、(100521,1)、(100481,1)、(100674,1)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Shuffle\u003c/td>\u003ctd>100481 的两条记录排在一起\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reduce\u003c/td>\u003ctd>100481、100521、100674\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>P76 课堂版本：\u003c/strong>Reducer 中使用 \u003ccode>collect=set()\u003c/code>，不断执行 \u003ccode>collect.add(商品ID)\u003c/code>，最后循环打印集合元素。这个方法容易理解，但唯一商品数非常多时会占用较多内存，而且 set 的输出顺序不保证。P75 的 \u003ccode>yield\u003c/code> 是“生成器”：每次遍历才产生一行，不必一次性创建所有记录的列表，节省输入读取的内存。因此上面同时提供了按已排序 key 流式去重的版本。\u003c/p>\u003cp class=\"deep-note\">应试按照课件记：\u003cstrong>set() 可去重\u003c/strong>；如果问工业可扩展性，解释为什么更偏好利用 Shuffle 的按 key 分组。\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"deep-module\">\u003csummary>\u003cspan class=\"deep-title\">例题三：你的学生成绩作业，逐行解释到会独立修改\u003c/span>\u003cspan class=\"deep-pages\">P77–80 + 作业扩展\u003c/span>\u003cspan class=\"deep-desc\">把“两列成绩题”改成“三列：学号、课程、成绩”。\u003c/span>\u003c/summary>\u003cdiv class=\"deep-body\">\u003cp>\u003cstrong>课件原题：\u003c/strong>输入 \u003ccode>姓名,成绩\u003c/code> 两列，求平均分、最高分。\u003cstrong>你的作业：\u003c/strong>输入 \u003ccode>学号,课程,成绩\u003c/code> 三列，求选课数和平均分；只需换 Mapper 取第 1、3 列，以及 Reducer 不求最高分。若要保留 PPT 的最高分统计，在每位学生分组内使用 \u003ccode>maxscore=max(maxscore, score)\u003c/code>，换学号时同时输出最大值，并在下一组重置。\u003c/p>\u003cdiv class=\"deep-code-title\">score.txt：全部七行\u003c/div>\u003cpre class=\"deep-code\">\u003ccode>230001,computer,93\n230001,math,88\n230002,math,78\n230001,AI,85\n230003,computer,92\n230002,english,89\n230003,math,80\u003c/code>\u003c/pre>\u003cdiv class=\"deep-code-title\">score_mapper.py：忽略中间的课程名\u003c/div>\u003cpre class=\"deep-code\">\u003ccode>import sys\nfor line in sys.stdin:\n    data = line.strip().split(&quot;,&quot;)\n    if len(data) != 3:\n        continue\n    student_id = data[0]            # 学号\n    score = int(data[2])           # 第三列才是成绩\n    print(f&quot;{student_id}\\t{score}&quot;)\u003c/code>\u003c/pre>\u003cdiv class=\"deep-table-scroll\">\u003ctable class=\"deep-table\">\u003cthead>\u003ctr>\u003cth>代码\u003c/th>\u003cth>为什么这么写\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>split(\",\")\u003c/code>\u003c/td>\u003ctd>按照逗号把一行分成学号、课程、成绩三个字段\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>data[0]\u003c/code>\u003c/td>\u003ctd>Python 从 0 开始编号，因此取第一列学号\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>data[2]\u003c/code>\u003c/td>\u003ctd>第三列才是成绩；课程名 \u003ccode>data[1]\u003c/code> 不参与统计\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>print(f\"{id}\\t{score}\")\u003c/code>\u003c/td>\u003ctd>输出键值对用 TAB 分隔，方便 Streaming 识别 key\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"deep-code-title\">score_reducer.py：换学生时先输出上一学生\u003c/div>\u003cpre class=\"deep-code\">\u003ccode>import sys\nlast_student = None\ncount = 0\nscore_sum = 0\n\nfor line in sys.stdin:\n    student, score_text = line.strip().split(&quot;\\t&quot;, 1)\n    score = int(score_text)\n\n    if last_student is not None and student != last_student:\n        avg = score_sum / count\n        print(f&quot;{last_student}\\t{count}\\t{avg:.2f}&quot;)\n        count = 0\n        score_sum = 0\n\n    last_student = student\n    count += 1\n    score_sum += score\n\n# 必须在 for 结束后输出最后一位学生\nif last_student is not None:\n    avg = score_sum / count\n    print(f&quot;{last_student}\\t{count}\\t{avg:.2f}&quot;)\u003c/code>\u003c/pre>\u003cp>举例学生 230001：来自 Mapper 的三条是 \u003ccode>(230001,93)、(230001,88)、(230001,85)\u003c/code>。Shuffle 将它们排在一起，Reducer 计算 \u003ccode>count=3\u003c/code>、\u003ccode>score_sum=266\u003c/code>，得到 \u003ccode>266/3=88.67\u003c/code>。\u003c/p>\u003cdiv class=\"deep-code-title\">最终预期输出（学号 / 门数 / 平均分）\u003c/div>\u003cpre class=\"deep-code\">\u003ccode>230001\t3\t88.67\n230002\t2\t83.50\n230003\t2\t86.00\u003c/code>\u003c/pre>\u003cp class=\"deep-note\">三处关键考试易错：①不是以课程名分组，而是以学号分组；②前一个学号结束时输出并清零；③ for 结束后仍需输出最后一个学号。\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"deep-module\">\u003csummary>\u003cspan class=\"deep-title\">两种不同 API 的 Reducer，不要混背\u003c/span>\u003cspan class=\"deep-pages\">P19–21、P65–66\u003c/span>\u003cspan class=\"deep-desc\">为什么 PPT 明明说“Iterable”，Python 代码却在遍历 sys.stdin？\u003c/span>\u003c/summary>\u003cdiv class=\"deep-body\">\u003cdiv class=\"deep-table-scroll\">\u003ctable class=\"deep-table\">\u003cthead>\u003ctr>\u003cth>技术方案\u003c/th>\u003cth>Reducer 收到的输入\u003c/th>\u003cth>怎样识别同一个 key\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>原生 Java MapReduce API\u003c/td>\u003ctd>\u003ccode>reduce(key, Iterable&lt;values&gt;)\u003c/code>\u003c/td>\u003ctd>框架已封装一组 values，直接遍历它\u003c/td>\u003c/tr>\u003ctr>\u003ctd>课件 Python Hadoop Streaming\u003c/td>\u003ctd>\u003ccode>sys.stdin\u003c/code> 传进的按 key 排序的文本行\u003c/td>\u003ctd>Python 自己比较 \u003ccode>last_key\u003c/code> 与 \u003ccode>current_key\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>同一份 WordCount 任务，用两种语言实现时底层 MapReduce 机制相同，但脚本接口\u003cstrong>不完全相同\u003c/strong>：Streaming Python 不会天然给出一个 Python 列表 \u003ccode>[1,1,1]\u003c/code> 作为一次 reducer 调用的参数。PPT 也明确提示这一点（P65）。\u003c/p>\u003cp class=\"deep-note\">考试若问原生 \u003ccode>reduce()\u003c/code> 的签名，回答 key + Iterable；若让你解释课程里 Python Streaming Reducer，用 stdin + last_key。\u003c/p>\u003c/div>\u003c/details>\u003c/section>\u003c/template>\n  \u003cscript>\n/* 本文件的知识点按《MapReduce计算框架》85页课件编排。\n * 易懂的类比用于辅助记忆；“准确表述”与“易错点”优先贴合课件。 */\nconst CHAPTERS = [\n  {id:'bigdata',num:'01',name:'为什么需要 MapReduce',pages:'P4–16',tag:'先理解动机',description:'别先背定义，先想：为什么一个人搬不完所有箱子？'},\n  {id:'principles',num:'02',name:'MapReduce 怎么计算',pages:'P18–43',tag:'计算主线',description:'把一份大数据从原料变成最终结果。'},\n  {id:'yarn',num:'03',name:'YARN 如何组织工人',pages:'P44–47',tag:'重点：作业调度',description:'记住施工队故事，七步流程自然就顺了。'},\n  {id:'shuffle',num:'04',name:'Shuffle 到底忙什么',pages:'P48–58',tag:'重点：中间过程',description:'把包裹分类、贴地址、装箱，再派送给正确的人。'},\n  {id:'practice',num:'05',name:'编程实践与总结',pages:'P59–85',tag:'例题 + 命令',description:'用词频、去重和成绩统计检验是否真正学会。'}\n];\nconst LESSONS = [\n {id:'models',chapter:'bigdata',title:'计算模式：四种工作，不要混淆',pages:'P4–6',hook:'计算就是把输入变成输出；不同工作需要不同工具。',analogy:'处理年终所有账单像“批量清账”；实时查看出租车位置像“直播”；研究朋友关系像“社交关系图”；在资料库里随时查记录像“问答窗口”。',core:'批处理：MapReduce / Spark；流计算：Storm 等；图计算：GraphX / Pregel；交互查询：Hive / Impala 等。MapReduce 是批处理框架。',memory:'记忆：批量算账、实时直播、关系成图、随问随查。',trap:'MapReduce 不擅长毫秒级实时分析，也不是所有大数据问题的唯一工具。',more:'课件把计算定义成“从输入到输出的变换”；强调大规模数据分布式并行处理，经典 MapReduce 解决的是批量计算。'},\n {id:'divide',chapter:'bigdata',title:'分而治之：一百箱书，谁来清点？',pages:'P8–14',hook:'MapReduce = 大任务分给很多人 → 各自做 → 汇总答案。',analogy:'一个人点清 100 个书架很慢。让 10 个工人分别数 10 个书架，最后把数量相加，就快得多。你只要告诉工人“怎么数”，不用自己设计全部通信和调度。',core:'Map 执行局部数据的独立转换，Reduce 归纳、汇总；框架隐藏切分、分布、调度、同步、容错等分布式复杂性。',memory:'记忆：分 → 算 → 合；程序员管“算什么”，框架管“怎么调度”。',trap:'MapReduce 的核心目标不是“提高单机速度”，而是封装分布式处理细节。',more:'高效并行要求数据块间尽量不存在计算依赖，Map 任务相互独立。同一份工作上的分工如果极不均衡，也可能出现有人很闲、有人长期加班。'},\n {id:'features',chapter:'bigdata',title:'优势与局限：为什么它适合批处理',pages:'P15–16、82–85',hook:'强项是大规模、容错、横向扩展；弱项是实时性。',analogy:'与其买一台超级贵的电脑，不如开很多普通工位。有人请假，换个人继续做；但这种流水线不适合每秒都要求立刻回答的问题。',core:'优势：易编程、横向扩展、高容错、数据本地化、顺序处理、并行吞吐；局限：中间数据落盘，非实时、不适合连续流处理。',memory:'记忆：加机器、能重跑、算大批；不擅长即时回答。',trap:'横向扩展是“加机器数量”，纵向扩展是“升级单台机器配置”。',more:'课件总结七个特点：横向扩展、失效常态、计算靠近数据、顺序访问、分布并行、隐藏系统细节、平滑可扩展。'},\n {id:'pipeline',chapter:'principles',title:'一张图看全流程：Split → Map → Shuffle → Reduce',pages:'P18、P23、P43',hook:'地图：原料分包 → 分别加工 → 快递分拣 → 统一结算 → 保存成果。',analogy:'快递仓：先把整车货拆成批次；工人逐批贴标签；分拣中心把同类包裹送一条线路；收货部门最终清点；结果入库。',core:'InputSplit（逻辑分片）→ Map（产出中间键值对）→ Shuffle（分区/排序/分组/传输）→ Reduce（按 key 聚合）→ Output（结果写 HDFS）。',memory:'记忆：切、映、洗、归、存。',trap:'Shuffle 不是一个由你独立写的 map()/reduce() 函数，而是框架执行的一组中间操作。',more:'InputSplit 由 InputFormat 规划；Map/Reduce 都可以并行；输出文件常见为 part-r-00000。'},\n {id:'map',chapter:'principles',title:'Map：见一条，就做一次转换',pages:'P19、P32–33',hook:'Map 不是“统计总数”，它只负责产生中间键值对。',analogy:'翻译工人看到“Hello World Hello”，立即贴出三张标签：(Hello,1)、(World,1)、(Hello,1)。重复单词也照贴，不负责加总。',core:'典型 TextInputFormat：输入 (LongWritable 字节偏移, Text 一行原文)；输出 0 个或多个 (K2,V2)，由用户定义类型和含义。',memory:'记忆：Map = 拆开 + 贴标签。',trap:'Map 输入 key 的“字节偏移”不是 WordCount 里的单词，也不等于 Map 输出的 key。',more:'例如 key=0, value=\"Hello World Hello Hadoop\"，Map 输出 (Hello,1) (World,1) (Hello,1) (Hadoop,1)。相同 key 可以出现多次。'},\n {id:'reduce',chapter:'principles',title:'Reduce：收到同一类，再算总账',pages:'P20、P39',hook:'Reduce 一次处理一个 key 和它对应的整组 values。',analogy:'会计不再接到一张张散落的票据，而是收到 “Hello → [1,1,1]” 一整叠票据，于是算出 Hello 有 3 个。',core:'原生 MapReduce API：reduce(K3, Iterable\u003cV3>)，通常每个 key 调用一次，输出该 key 的聚合结果。可计算求和、计数、平均、最大最小等。',memory:'记忆：Reduce = 同类账单一起结。',trap:'Reduce 输入通常不是 Map 的一条原样输出；中间经过 Shuffle。',more:'MapReduce 框架将同一 key 的 values 组织为迭代器。注意 Hadoop Streaming Python 脚本看到的是按 key 排序的标准输入行，而非直接拿到 Iterable 对象。'},\n {id:'bridge',chapter:'principles',title:'Shuffle：Map 与 Reduce 之间的桥',pages:'P21、P36–38',hook:'关键：相同 key 一定进入同一 Reduce；不同 key 可能也在同一 Reduce。',analogy:'快递站先按目的区域分到不同货车（分区），每辆车按地址排好（排序），相同地址的包裹放到一起（分组）。',core:'分区按 key 的 Hash 选 Reducer；分区内按 key 排序；在归约前将相同 key 的 value 组成一组。',memory:'记忆：先决定去哪里，再排队，再按姓名成组。',trap:'“同一 key 必定同 Reducer”正确；“不同 key 必定不同 Reducer”错误。',more:'Shuffle 涉及网络传输；Reduce 从多个 Map 节点拉取属于本分区的数据。'},\n {id:'split',chapter:'principles',title:'InputSplit：分片是任务清单，不是切文件',pages:'P24–26',hook:'逻辑分片只记录“哪一段数据归谁读”，不把 HDFS 文件真的切出新文件。',analogy:'一本 300 页的书分给三个人看，不需要撕成三本，只需要告诉他们各自看哪几页。',core:'InputSplit 携带路径、开始偏移、长度和数据所在节点等元数据；通常 1 Split → 1 Map Task。课件默认 Block 大小约 128 MB；Split 常与 Block 对齐。',memory:'记忆：Split 是便签条，Block 是仓库里真正的存储块。',trap:'Split 不一定等于 HDFS Block；计算分片仅需元数据，不必读 DataNode 上的真实数据。',more:'课件默认计算式：splitSize=max(minSize,min(maxSize,blockSize))。考虑末段 SPLIT_SLOP=1.1；例如 150MB 默认分 2 个 Split，60MB 通常 1 个。'},\n {id:'reader',chapter:'principles',title:'InputFormat 与 RecordReader：谁真正打开书？',pages:'P27–29',hook:'InputFormat 规划“分给谁”；RecordReader 到运行时才真正读“哪一行”。',analogy:'教务员只根据书目页数分配阅读范围（getSplits），学生到座位后才翻书逐行阅读（RecordReader）。',core:'InputFormat.getSplits()：客户端规划逻辑分片；createRecordReader()：MapTask 启动时创建读取器；TextInputFormat 的 LineRecordReader 按行读出 (字节偏移,文本行)。',memory:'记忆：getSplits 划任务；RecordReader 读内容。',trap:'切片阶段无需读取文件正文；TextInputFormat 会处理跨 Split 的行边界，不把一行拆成两个 Map 输入。',more:'第二个 Split 可能从行中间开始，LineRecordReader 会跳过当前残余半行，从下一条完整记录开始，避免记录重复或漏掉。'},\n {id:'parallel',chapter:'principles',title:'Map Task 数量与数据本地性',pages:'P30–35',hook:'几个 Split 通常就有几个 Map Task；机器数量不限制任务总数。',analogy:'只有 4 个工位，但有 20 箱活儿，可以排队分批做 20 个任务。搬箱子的工人优先在箱子所在仓库工作，省运输。',core:'一 InputSplit 通常产生一 MapTask；Map Task 之间不直接通信；尽可能把计算调度到拥有数据副本的节点（数据本地性）。',memory:'记忆：任务数看 Split；并发数看资源；执行地点靠近数据。',trap:'“N 个 DataNode 最多 N 个 Map Task”错误：一个节点可先后或并行执行多个任务。',more:'任务总数与同时运行的任务数不同。过少 Split 并行度不足，过多 Split 会使调度开销增加。'},\n {id:'output',chapter:'principles',title:'输出：最后的文件和中间文件不是一回事',pages:'P39–42',hook:'Map 结果先暂存本地；Reduce 最终结果才写 HDFS。',analogy:'工人草稿写在自己桌上；经会计核对的最终报表才进入公司档案库。',core:'Map 中间结果通常在本地磁盘 spill；Reduce 结果经 OutputFormat 写到 HDFS。一个 Reducer 通常产生一个 part-r-xxxxx 文件。输出目录不能预先存在。',memory:'记忆：中间本地，最终 HDFS；重跑先删旧 output。',trap:'“Map 中间结果直接写入 HDFS”错误；输出目录已存在通常会报错。',more:'Reduce 拉取数据的 Copy/Shuffle 可和仍在运行的其他 Map 重叠；最终 Reduce 归约需等相关 Map 输出就绪。'},\n {id:'roles',chapter:'yarn',title:'四种角色：公司、项目经理、现场主管、工位',pages:'P44',hook:'RM 管全公司资源，AM 管单个项目，NM 管本机，Container 给算力。',analogy:'ResourceManager 是公司总部的资源调度员；ApplicationMaster 是某一单项目经理；NodeManager 是每个工地的现场主管；Container 是分到的工作场地和 CPU/内存预算；Task 才是真工人。',core:'RM：集群级资源管理；AM：每个应用一个，申请资源、协调/监督任务；NM：各节点资源管理、启动/停止容器；Container：封装 CPU、内存等资源，AM 和 Task 都在其中运行。',memory:'记忆：RM 管全局，AM 管项目，NM 管本机，Container 装资源。',trap:'Container 不等于一个物理服务器，也不等于 MapTask 工人本身。',more:'一个集群里可以有多个应用各自的 AM；RM 对多个应用统一安排资源。'},\n {id:'jobsteps',chapter:'yarn',title:'作业七步：一场项目从接单到交付',pages:'P45',hook:'接单 → 选经理 → 要工位 → 派工人 → 做任务 → 查进度 → 交付。',analogy:'客户提交工程单；总部给项目经理配一个办公室；经理向总部申请工位和资源；各工地主管启动工人；分拣工人 Map 处理、汇总工人 Reduce 汇总；经理持续巡查并补人；完成后汇报总部，释放工位。',core:'Client 提交 Job → RM 安排首个 Container 并启动 AM → AM 向 RM 申请更多 Container → AM 与 NM 协作启动 MapTask/ReduceTask → 任务执行 → AM 监控/失败重试 → AM 向 RM 报完成、释放资源。',memory:'记忆口诀：交、启、申、派、做、盯、收。',trap:'不是 RM 亲自给每个 Map 任务执行计算；RM 负责资源，AM 负责本应用的协调。',more:'第 45 页有七步完整表述，下面的“施工队交互流程”可以逐步点开记忆。'},\n {id:'scheduling',chapter:'yarn',title:'两种均衡：分工位与分数据',pages:'P46',hook:'资源层管“谁有多少算力”，数据层管“谁拿多少数据”。',analogy:'总部决定每个项目分几个工位，这是资源调度；分拣中心决定每条快递线路装多少包裹，这是数据分区。一个是工位公平，一个是任务别压垮某个人。',core:'资源层 RM 调度 Container；课件比较 Capacity Scheduler（队列配额）和 Fair Scheduler（公平共享）。数据层 Partitioner 决定 key 进入哪个 Reducer；热点 key 会造成数据倾斜。',memory:'记忆：RM 调“机器资源”，Partitioner 调“数据流向”。',trap:'资源公平 ≠ 各 Reducer 的数据量一样；Hash 可能让热点 key 导致某个 Reducer 过载。',more:'课件列出应对倾斜的方法：定制 Partitioner、Combiner 预聚合、热点 key 加盐等；加盐须配合后续合并才能保持最终结果正确。'},\n {id:'fault',chapter:'yarn',title:'容错：有人掉线怎么办？',pages:'P47',hook:'MapReduce 从不赌“机器永远不会坏”，而是让失败任务重新跑。',analogy:'工人旷工，项目经理把活儿重新分给别人；某仓库断电，那里未完成的工作重新做，本地草稿丢了也得重做。',core:'课件按任务失败、节点失败、AM/RM 失败分类；自动检测、重试、重新分配任务，YARN RM 可采用主备高可用。',memory:'记忆：坏了不等；先发现，再重跑。',trap:'节点坏掉时，保存在该节点本地的 Map 中间文件可能丢失；已完成的相关 Map 也可能需要重新执行。',more:'课件举例 map 最大尝试次数 4、超时 10 分钟，为示意配置/默认行为，实际部署可改参数。用户任务最好幂等，即重复执行结果一致。'},\n {id:'shuffleall',chapter:'shuffle',title:'Shuffle 全景：两边其实都在忙',pages:'P48–49、58',hook:'Shuffle 不只是 Reduce 排序，它从 Map 输出开始，直到 Reduce 读到分组数据。',analogy:'发货端：临时堆放、按线路打包、合并货箱；收货端：从各地提货、按地址合并、交给会计结算。',core:'Map 端：缓冲区 → 分区/排序（可选 Combiner）→ Spill → 文件归并；Reduce 端：Copy 拉取 → 缓冲/Spill → 多路归并/分组 → Reduce。',memory:'记忆：Map 端“打包发”，Reduce 端“收件拆”。',trap:'Shuffle 既可能涉及 Map 本地磁盘，也可能涉及跨节点网络传输。',more:'Map 端排好的是本 Map 输出的各分区；Reduce 端合并的是来自多个 Map 的同一个 Reduce 分区。'},\n {id:'spill',chapter:'shuffle',title:'环形缓冲区与 Spill：桌子满了先归档',pages:'P50–51',hook:'Map 输出不是生成一条写一次磁盘，而是先放内存缓冲区。',analogy:'分拣员先把快递放在工作台；桌子将满（例如到约 80%）就打包一批到仓库，腾出桌面再继续。',core:'课件默认 Map 环形缓冲区 100 MB、Spill 触发阈值 80%；满足阈值会启动后台线程排序/溢写，写成本地文件。',memory:'记忆：先缓存，八成满，溢到盘。',trap:'100MB/80% 是课件列出的常见默认配置，并非不可改变；Spill 不是输出到 HDFS。',more:'相关参数 mapreduce.task.io.sort.mb 和 mapreduce.map.sort.spill.percent。一个 Map 可能产生多个 spill 文件。'},\n {id:'partition',chapter:'shuffle',title:'Partition、Sort、Combiner 分别做什么？',pages:'P52–53',hook:'分区决定谁收；排序方便同类聚集；Combiner 可选，帮忙提前合并。',analogy:'包裹先按负责的送货员分车，再按门牌排序。如果都是“同一种计数小票”，可以先打包成一个小计单减少路上运输。',core:'Partition：同一 key 必须归同一 Reducer；Sort：分区内按 key 排序，默认执行；Combiner：用户配置后可做本地预聚合，减少传输，不保证每次执行。',memory:'记忆：分区选人、排序排队、Combiner 省运费。',trap:'Combiner 不等于 Reduce，不能保证调用；平均值不能直接把“各组平均数”简单相加或再取平均。',more:'课件给的默认分区形式：(key.hashCode() & Integer.MAX_VALUE) % numReduceTasks；不同 key 可以落在同一个 Reducer。'},\n {id:'mergemap',chapter:'shuffle',title:'Map 端 Merge：把自己桌上的小文件合起来',pages:'P54',hook:'同一个 Map 写出的多个 Spill 文件，最后再按顺序归并。',analogy:'一个工人一天装了五箱同类文件，装车前把五箱按地址重新整理成一批。',core:'Map Task 结束前会归并它自身的多个 Spill 文件，保留分区与 key 的有序性；合并完成后临时文件可删除。',memory:'记忆：Map Merge = 合并“自己”产生的小文件。',trap:'Merge 与 Combiner 不同：Merge 是文件归并，不必改变某个 key 的数值；Combiner 是可选的计算预聚合。',more:'只有一个 Spill 文件时可能不需要多路归并；一个 Map 完成后，Reduce 可以开始复制它的分区输出。'},\n {id:'mergereduce',chapter:'shuffle',title:'Reduce 端 Copy / Merge：从所有人那里收货',pages:'P55–57',hook:'一个 Reducer 从多个 Map 的输出里，只收属于自己分区的数据。',analogy:'“一号快递员”挨个去不同仓库领取发往自己片区的包裹，再把来源不同的包裹合成一份有序清单。',core:'Reduce 端并行从 Map 节点 Copy 对应分区数据，缓冲区满时也可溢写；通过多路归并把相同 key 的 values 整理在一起，再交给 Reduce 函数。',memory:'记忆：Map 端合“同一工人的多个文件”；Reduce 端合“多个工人的同一分区”。',trap:'Reduce 的 Copy 阶段可以在部分 Map 完成后开始，不必所有 Map 都完成才开始复制。',more:'课件举例默认 5 个并行 Copy 线程，具体可配置。Map 端 Merge 的结果给别人拉走；Reduce 端 Merge 的结果直接送入归约计算。'},\n {id:'wordcount',chapter:'practice',title:'WordCount：最小的完整例子',pages:'P59–66',hook:'一行变成多个 (word,1)，同词聚在一起，最后求和。',analogy:'每遇到一个单词就发一张“+1 票”；邮局按单词名称分组；统计员把票数相加。',core:'Mapper：逐行拆词，输出 “单词\\t1”；Shuffle：按 key 整理；Reducer：同词求和。测试数据如 Hello Bigdata / Bye Bigdata / Hello Hadoop / Bye Hadoop。',memory:'记忆：分词打 1 → 排序 → 同词相加。',trap:'Map 不负责在全局合并同词；同样的词可能由不同 Map 产生。',more:'课件 Python Mapper：for line in sys.stdin，strip().lower()，split()，输出 key 和 1；Reducer 比较 last_key 变化，结尾必须补输出最后一组。'},\n {id:'streaming',chapter:'practice',title:'Hadoop Streaming：为什么 Python Reducer 要自己比较 key？',pages:'P63、P65–69',hook:'Java API 的 Reduce 收到迭代器；Python Streaming 脚本收到排序好的文本行。',analogy:'如果是标准 MapReduce 接口，会计收到“某客户的一整包票据”；如果是 Streaming Python，他收到按客户姓名排好的一叠单据，需要自己判断姓名什么时候变了。',core:'Hadoop Streaming 使用 stdin/stdout 与 Mapper/Reducer 脚本通信；Hadoop 负责分区与排序，Python Reducer 常用 last_key、running_total 顺序归并。',memory:'记忆：Java 按组接，Streaming 按行读；排序是框架做的。',trap:'不能把 Java API 的 Iterable\u003cV> 硬套到 Python Streaming 脚本；Streaming 必须正确处理最后一个 key 的输出。',more:'课堂所用命令 hadoop jar \u003cstreaming-jar> -files ... -mapper \"python3 ...\" -reducer \"python3 ...\" -input ... -output ...。'},\n {id:'commands',chapter:'practice',title:'Linux 实验：三步本地测试，再提交 Hadoop',pages:'P67–72',hook:'先自己把数据管道跑通，再交给集群运行。',analogy:'做菜先在家试配方，再交给食堂大规模生产；先确认 Mapper、排序、Reducer 都没问题。',core:'本地：cat input | python3 mapper.py → 加 | sort → 再加 | python3 reducer.py。集群：启动服务 / HDFS 上传输入 / hadoop jar Streaming / hadoop fs -cat 看结果。',memory:'记忆：测试 Map → 测试排序 → 测试 Reduce → 提交 → 看 part 文件。',trap:'输出目录存在时作业会失败；重新运行之前需删除旧输出。不要把本地文件路径与 HDFS 输入路径混淆。',more:'课件中的 jar 版本号只是其环境实例；应根据实际 Hadoop 安装位置寻找 hadoop-streaming*.jar。'},\n {id:'dedup',chapter:'practice',title:'去重：只关心商品有没有出现过',pages:'P73–76',hook:'不关心收藏几次，只要知道哪些商品被收藏。',analogy:'一个商店会员重复收藏同一件商品，清单只希望每件商品列一次，就像名单去重复姓名。',core:'输入含用户 ID、商品 ID、收藏时间；Mapper 取商品 ID，输出 (商品ID,1)；课件示例 Reducer 用 Python set 保存不重复商品 ID。',memory:'记忆：提商品 ID → 去重 → 输出唯一名单。',trap:'集合 set 会去重，但无序；不要把它当成按原始顺序输出的结构。',more:'课件示例重点展示 Python 标准输入、split、set。分布式全局去重时仍要保证所有同一商品 ID 被一致地归并/去重。'},\n {id:'grade',chapter:'practice',title:'成绩统计：门数、均分、最高分',pages:'P77–80',hook:'所有同学的成绩按学号放在一起，再一次算出 count、sum、max。',analogy:'老师先把所有卷子按照学号排成小叠；每叠就是一个学生，数卷子几张，分数求和除张数，顺手找最高分。',core:'Mapper 输出 (学生,成绩)；Shuffle 按学生聚集；Reducer 对每组 count++、total+=score、maxscore=max(...)，平均分 total/count。',memory:'记忆：一个学生一叠卷；门数看张数，均分看总分/张数。',trap:'Reducer 检测新 key 时必须把上一学生结果输出并重置计数；循环结束还要输出最后一位学生。',more:'你之前的学号、课程、成绩三列题，只需在 Mapper 忽略课程列，输出第 1 列和第 3 列；Reduce 求 count 和 total/count。'}\n];\n\nLESSONS.push(...[{\"id\": \"modes_compare\", \"chapter\": \"bigdata\", \"title\": \"为什么 MapReduce 不能替代所有计算框架\", \"pages\": \"P6、P16\", \"hook\": \"算十年账本和处理每秒订单是两回事。\", \"analogy\": \"批处理像仓库月底盘点，流处理像收银台每秒记账；图计算看关系网，交互查询回答临时问题。\", \"core\": \"课件四模式：批处理 MapReduce/Spark；流计算 Storm/S4/Flume；图计算 GraphX/Pregel；交互查询 Hive/Cassandra/Impala。\", \"memory\": \"记：批、流、图、查，各干各活。\", \"trap\": \"Spark 也可执行批处理，不意味着只要“实时”就必须 MapReduce。\", \"more\": \"课件 P6 的代表产品按课件记忆，产品实际功能可能超出表中单一类别。\"}, {\"id\": \"types\", \"chapter\": \"principles\", \"title\": \"四组 KV 类型与 Java API / Streaming 的区别\", \"pages\": \"P19–21、P65–66\", \"hook\": \"千万不要把 K1 的字节偏移当成统计用的 key。\", \"analogy\": \"快递系统进门自带“货物位置编号”，贴完业务标签后按收件人发货；进门位置号不会自动成为分拣标签。\", \"core\": \"TextInputFormat 原生 Map 输入 (LongWritable,Text)；Map 输出用户定义 (K2,V2)；原生 Reduce 接收 (K2,Iterable\u003cV2>)；Streaming Python 接收排序的文本流，不直接收到 Iterable。\", \"memory\": \"字节偏移是入站索引；业务 key 是映射标签。\", \"trap\": \"原生 Java Map 输出可以重复 key；同 key 的汇总不是 Map 自动完成。\", \"more\": \"对应 P19–21、P65：Java 原生 API 的接口抽象与 Streaming 的 stdin/stdout 接口不是同一种形态。\"}, {\"id\": \"slop\", \"chapter\": \"principles\", \"title\": \"Split 计算：128MB 和 1.1 尾巴规则\", \"pages\": \"P24–26\", \"hook\": \"算分片不是机械地所有余数都新开一片。\", \"analogy\": \"车队每辆车习惯装 128 箱，最后多出很少的箱子不一定专门再开一辆车。\", \"core\": \"课件默认 splitSize≈128MB，且 TextInputFormat 使用 SPLIT_SLOP=1.1：剩余数据超过 1.1×splitSize 才继续切分；例如 150MB 会形成 128MB 和 22MB 两片，约 130MB 可留一片。\", \"memory\": \"1GB/128MB=8；60MB=1；150MB=2。\", \"trap\": \"1.1 是默认切片策略中的尾部处理，不是所有 InputFormat 都相同；gzip 常不可切分。\", \"more\": \"HDFS Block 与 InputSplit 可不同；逻辑切片不物理复制文件。\"}, {\"id\": \"getsplit_vs_reader\", \"chapter\": \"principles\", \"title\": \"getSplits 与 RecordReader：谁在什么时候读数据\", \"pages\": \"P27–31\", \"hook\": \"一份工作单和真正开始读货是两个时刻。\", \"analogy\": \"计划员先拿货仓地图规划派工区间；工人上岗后才真的打开仓库逐条读取货。\", \"core\": \"InputFormat.getSplits() 在客户端提交作业时用文件元数据生成逻辑分片；MapTask 上调用 createRecordReader() 并逐条 nextKeyValue() 后给 map()。\", \"memory\": \"先定范围（不读内容），后读内容（在 Map 节点）。\", \"trap\": \"getSplits 不是从 DataNode 下载所有文件正文；TextInputFormat 还会处理跨 Split 的文本行。\", \"more\": \"默认 TextInputFormat：key 是一行的起始字节偏移（LongWritable），value 是这一行文本（Text）。\"}, {\"id\": \"reduce_output\", \"chapter\": \"principles\", \"title\": \"Reduce 个数、输出文件、HDFS 与本地磁盘\", \"pages\": \"P39–42\", \"hook\": \"Map 的草稿放本地，Reduce 的成品入库 HDFS。\", \"analogy\": \"分拣员各自的草稿留在桌上（Spill）；最后几位汇总员各自提交一份正式结算表（part-r-文件）。\", \"core\": \"ReduceTask 数目可配置 mapreduce.job.reduces，课件典型默认 1；每个 Reducer 对应 part-r-00000 等输出文件，TextOutputFormat 使用 key + 制表符 + value + 换行。\", \"memory\": \"Map 中间文件本地磁盘，Reduce 最终结果到 HDFS。\", \"trap\": \"Reducer 数目不是由 InputSplit 数量决定；输出目录若已存在会报错。\", \"more\": \"课件 P39 所说“所有 Map 完成 Reduce 才开始”应理解为归约函数需等待完整键分组，Reduce 端提前可以 Copy 已完成 Map 的输出（P54–56）。\"}, {\"id\": \"reduce_numbers\", \"chapter\": \"principles\", \"title\": \"Reduce 太多或太少，各有什么问题\", \"pages\": \"P39\", \"hook\": \"工位越多不意味着总效率越高。\", \"analogy\": \"一个结算员处理全城订单会累死；1000 个结算员各处理一张订单，安排人员与沟通又太费时间。\", \"core\": \"Reduce 太少：单任务负载重、并行度低；太多：启动开销大、Shuffle 网络压力大。Reduce 任务数是可配置的。\", \"memory\": \"Map 个数看 Split，Reduce 个数看配置。\", \"trap\": \"不是 Map=8 就必然 Reduce=8；MapTask 与 ReduceTask 的数量决定因素不同。\", \"more\": \"课件给出约 1GB/Reducer 的经验提示，属于调参参考值，非硬性规则。\"}, {\"id\": \"scheduler\", \"chapter\": \"yarn\", \"title\": \"Capacity / Fair：调度工位与分发数据是两回事\", \"pages\": \"P46\", \"hook\": \"资源公平不等于每个 Reducer 工作量完全相同。\", \"analogy\": \"总部给每队分几张桌（ResourceManager）；快递按邮编分给谁（Partitioner）。一个管桌子、一个管货。\", \"core\": \"Capacity Scheduler 以队列资源配额为主；Fair Scheduler 让应用公平共享资源；HashPartitioner 决定 key 去哪个 Reducer，热点 key 会导致数据倾斜。\", \"memory\": \"RM 管资源，Partitioner 管 key 的去向。\", \"trap\": \"有 10 个 Reducer，也可能一个热门 key 导致其中一个特别忙。\", \"more\": \"课件提出自定义 Partitioner、Combiner、热点加盐等办法；加盐拆分后可能需要第二阶段再合并才能得正确聚合。\"}, {\"id\": \"fault_cases\", \"chapter\": \"yarn\", \"title\": \"任务失败 / 节点失败 / AM 失败\", \"pages\": \"P47\", \"hook\": \"出了问题重做对应工作，而不是所有情况都从零开始。\", \"analogy\": \"工人请假就换工人；一整个工地停电，丢掉的本地草稿需要重写；项目经理不在，总部还要重新指派经理。\", \"core\": \"课件列出任务失败重试、节点失效任务重跑、AM 由 RM 重启；RM 可部署 HA；Map 本地 Spill 丢失后相关 Map 必须重跑。\", \"memory\": \"幂等：重复跑应得相同结果。\", \"trap\": \"Map 中间文件不是自动保存在 HDFS 的 3 副本中。\", \"more\": \"课件给出 mapreduce.map.maxattempts=4、task.timeout=10min 作为典型参数，可因环境配置变化。\"}, {\"id\": \"combine_not_merge\", \"chapter\": \"shuffle\", \"title\": \"Combiner 不等于 Merge：尤其平均分陷阱\", \"pages\": \"P52–54\", \"hook\": \"两个小组平均分各 80 分，不能保证总平均也是 80。\", \"analogy\": \"Combiner 是每队先算一个“小计”；Merge 只是把已经排好序的小票放在一起。\", \"core\": \"Combiner 是可选本地预聚合，不能保证被调用；Merge 是多个 Spill 文件有序归并；求均值应传递 (sum,count)，最后总和/总量，不能直接平均组平均数。\", \"memory\": \"Combiner 算值，Merge 整文件；二者不是一回事。\", \"trap\": \"仅用平均值作 Combiner 会在每组样本量不同时算错。\", \"more\": \"例：A 组 100 一门课，B 组 50、50、50 三门课。组平均是 100 和 50，简单再平均得 75；正确是 62.5。\"}, {\"id\": \"shuffle_order\", \"chapter\": \"shuffle\", \"title\": \"Shuffle 时间顺序与 Map、Reduce 重叠\", \"pages\": \"P49–58\", \"hook\": \"看到“Reduce 等 Map 完成”要问具体是哪一个动作。\", \"analogy\": \"收件员可以先从已经打包好的仓库取货，但要等所有应到包裹齐了，才结算最终数量。\", \"core\": \"Map 输出后做分区/排序/溢写/本地 Merge；Reduce 端可从已完成的 Map 逐步 Copy，再 Merge 与按 key 分组，最后运行 reduce()。\", \"memory\": \"可先 Copy，完整归约后做。\", \"trap\": \"Shuffle 并非只在 Map 阶段或只在 Reduce 阶段；Map 侧与 Reduce 侧都有操作。\", \"more\": \"课件 P39 的简化说法与 P54–56 的 Copy 重叠描述可一并理解。\"}, {\"id\": \"streaming_jar\", \"chapter\": \"practice\", \"title\": \"为什么 Python MapReduce 还要用 .jar\", \"pages\": \"P68–69\", \"hook\": \"Python 是工人的工作说明，Streaming JAR 是 Hadoop 的翻译员/组织器。\", \"analogy\": \"你会用中文写工单，但工厂管理系统只会接受自己的标准接口；Streaming JAR 负责在 Hadoop 和你的脚本之间转交输入输出。\", \"core\": \"hadoop jar \u003chadoop-streaming版本.jar> 启动 Streaming 作业；-files 分发 Python 脚本；-mapper/-reducer 指定运行命令；-input/-output 是 HDFS 路径。\", \"memory\": \"jar 是运行框架入口，不要求把 Python 代码编译进 jar。\", \"trap\": \"jar 路径是本机 Hadoop 安装目录，不是输入数据文件；输出目录必须不存在。\", \"more\": \"课件 P68 给出 3.0.0 演示路径，实际安装版本要用 hadoop version 或查 share/hadoop/tools/lib。\"}, {\"id\": \"dedup_global\", \"chapter\": \"practice\", \"title\": \"商品去重：去重的是商品 ID，不是用户 ID\", \"pages\": \"P74–76\", \"hook\": \"多个用户收藏同一商品，最终清单只显示一次。\", \"analogy\": \"游客各自写下喜欢的商品；把所有小纸条按商品编号分类，最后每个商品保留一条。\", \"core\": \"Mapper 根据 TSV 输入输出 (商品ID,1)；课件 Reducer 用 set() 保存出现过的商品 ID；如按 key 分组，亦可每个商品 ID 输出一次。\", \"memory\": \"set 去重，但结果顺序不保证。\", \"trap\": \"若要全局去重，多个 Reducer 必须保证相同商品 ID 进入同一分区；不能简单把不同分区 set 的输出当成自然有序。\", \"more\": \"同一用户多次收藏与不同用户收藏同一商品都不会令商品重复输出。\"}, {\"id\": \"score_last\", \"chapter\": \"practice\", \"title\": \"Reducer 的三个陷阱：首行、换 key、末行\", \"pages\": \"P66、P80\", \"hook\": \"最后一位学生最容易“被漏掉”。\", \"analogy\": \"老师把按学号排列的卷子逐个看：第一次先建立学生档案；看到新学号就结算上一位；翻完最后一张还要再结算一次。\", \"core\": \"currentKey != lastKey 时输出上一组并重置 sum/count/max；整个循环结束时必须输出最后一个 key；Streaming 输入按 key 排好序。\", \"memory\": \"首行初始化、换 key 结账、末尾补结账。\", \"trap\": \"只在换 key 时输出，会漏掉最后学生；重置前不保存上一组，会把两个学生分数混在一起。\", \"more\": \"课件原题算平均分、最高分；你的三列版任务则求课程数、平均分。\"}] );\n\nconst QUIZ_BANK = [\n{chapter:'bigdata',q:'MapReduce 的核心作用是什么？',options:['把单机 CPU 变快','封装分布式计算细节，让开发者专注业务逻辑','代替所有数据库','只解决机器硬件不足'],a:1,why:'P8、P15：MapReduce 把数据划分、调度、通信、容错等复杂细节交给框架。'},\n{chapter:'bigdata',q:'适合 MapReduce 的典型任务是？',options:['毫秒级视频通话','实时流式控制','海量日志的离线批量统计','鼠标移动事件追踪'],a:2,why:'P6、P16：MapReduce 主要用于批处理，不擅长实时和持续流处理。'},\n{chapter:'bigdata',q:'“横向扩展”最贴切的例子是？',options:['增加服务器台数','换成一台更高频的 CPU','给单台机器换显卡','关闭集群网络'],a:0,why:'P82：横向扩展是增加廉价机器组成更大的集群。'},\n{chapter:'principles',q:'TextInputFormat 下 Map 的输入 key 通常是什么？',options:['单词','行号（一定如此）','文件中的字节偏移','Reducer 编号'],a:2,why:'P19：LongWritable 字节偏移；value 才是一行文本。'},\n{chapter:'principles',q:'对“Hello Hello”进行标准 WordCount Map，输出什么？',options:['(Hello,2)','(Hello,1),(Hello,1)','(Hello,[1,1])','没有输出'],a:1,why:'P19：Map 同 key 可重复出现，不负责合并。'},\n{chapter:'principles',q:'Reduce 在原生 Java API 中通常接收什么？',options:['(key, 单个 value)','(key, 可迭代 values)','整个 HDFS 文件','只有 key 没有 value'],a:1,why:'P20：按 key 一次回调，values 为该 key 的可迭代值列表。'},\n{chapter:'principles',q:'下面关于 Shuffle 的说法正确的是？',options:['它只在 Map 函数内部运行','它会按 key 分区、排序和分组','它把所有中间结果写进 HDFS','它会自动给出最终平均值'],a:1,why:'P21、P36：分区、排序、归并分组是其主要作用。'},\n{chapter:'principles',q:'相同 key 的中间数据必须满足什么条件？',options:['来自同一个 Mapper','被发送到同一个 Reducer','文件位置完全相同','一定只出现一条'],a:1,why:'P36：分区需保证同 key 汇合到同一 Reduce 任务。'},\n{chapter:'principles',q:'不同 key 会不会进入同一个 Reducer？',options:['绝对不会','会，哈希分区可能冲突或共享分区','只有数据出错才会','一个 Reducer 只能处理一个 key'],a:1,why:'P52：多个不同 key 完全可能映射到同一个分区。'},\n{chapter:'principles',q:'InputSplit 本质上是什么？',options:['一个新的物理文件','只记录范围和位置的逻辑分片','一个 Reducer','Map 的输出文件'],a:1,why:'P24、P28：Split 只保存文件路径、偏移、长度和位置等信息。'},\n{chapter:'principles',q:'计算 InputSplit 时，是否必须先读取 DataNode 上的文件正文？',options:['必须','不需要，主要使用元数据','只有大于 1 GB 时必须','只有 WordCount 必须'],a:1,why:'P28：getSplits 计算逻辑分片时不实际读取文件正文。'},\n{chapter:'principles',q:'一个 1GB 文本文件，默认 128MB 分片，大约产生多少个 Split？',options:['1','4','8','128'],a:2,why:'P26：1024 MB /128 MB = 8。'},\n{chapter:'principles',q:'N 个 DataNode，Map Task 最多只能有 N 个？',options:['正确','错误'],a:1,why:'P34–35：MapTask 总量受 Split 数决定，单节点可执行多个 MapTask。'},\n{chapter:'principles',q:'“数据本地性”指什么？',options:['只在客户端运行','尽量在存有数据的节点处理数据','所有数据先传给 ResourceManager','只用本地磁盘存结果'],a:1,why:'P30–35：尽量让计算靠近 HDFS 数据副本，减少网络传输。'},\n{chapter:'principles',q:'Map 中间 Spill 文件默认主要写在哪里？',options:['本地磁盘','HDFS 最终目录','客户端浏览器','NameNode 的元数据内存'],a:0,why:'P33、P41：Map 中间输出通常先写本地文件，Reduce 最终输出上 HDFS。'},\n{chapter:'principles',q:'重新运行同一 MapReduce 作业，旧 output 目录还在会怎样？',options:['自动覆盖','通常因输出路径已存在而报错','自动改名','Reduce 会跳过'],a:1,why:'P41：输出目录要由作业新建，重跑需要先删除旧输出。'},\n{chapter:'yarn',q:'负责全局集群资源调度的是谁？',options:['ApplicationMaster','MapTask','ResourceManager','RecordReader'],a:2,why:'P44：RM 管全局资源；AM 管单个应用。'},\n{chapter:'yarn',q:'只协调一个应用的任务、监控其执行状态的是谁？',options:['ApplicationMaster','所有 DataNode','客户端浏览器','HashPartitioner'],a:0,why:'P44–45：一个应用一个 AM，负责申请资源并监督任务。'},\n{chapter:'yarn',q:'NodeManager 的主要职责是？',options:['管理全局所有作业的逻辑','本机管理资源并启动/停止 Container','计算所有 key 的 Hash','保存 HDFS 文件目录'],a:1,why:'P44：NM 是节点本地守护进程，管理本机 Container。'},\n{chapter:'yarn',q:'Container 的正确含义是？',options:['永远是一台物理服务器','执行工作的 CPU/内存等资源封装','就是 ResourceManager 本身','用于替代 Mapper 的代码'],a:1,why:'P44：Container 是资源逻辑单元，AM 和 Tasks 都在其中运行。'},\n{chapter:'yarn',q:'作业提交后，谁为 ApplicationMaster 安排首个 Container？',options:['ReduceTask','ResourceManager','RecordReader','Combiner'],a:1,why:'P45：RM 为 AM 分配启动所需的第一个 Container。'},\n{chapter:'yarn',q:'热点 key 的数据倾斜属于哪类不均衡？',options:['RM 的 CPU 配额','Partitioner 的数据分布','客户端网络命令','文件名长度'],a:1,why:'P46：单个 key 过热导致部分 Reducer 负载过重。'},\n{chapter:'yarn',q:'节点宕机，本地已有 Map 输出会怎样？',options:['始终被 HDFS 保证完整保留','可能丢失，相关 Map 需要重跑','会自动变为 Reducer','完全不影响后续'],a:1,why:'P47：Map 中间文件在本地磁盘，节点故障会导致已完成 Map 的输出失效。'},\n{chapter:'shuffle',q:'按课件举例，Map 环形缓冲区与 Spill 阈值默认是？',options:['100MB，80%','128MB，100%','1GB，20%','无缓冲区'],a:0,why:'P50–51：100 MB、达到约 80% 启动 Spill。'},\n{chapter:'shuffle',q:'Combiner 的调用性质是？',options:['框架一定调用','可选、仅适合能安全局部聚合的运算','总是在 Reduce 后执行','不需要用户配置'],a:1,why:'P53：用户定义 Combiner 才可能进行本地合并，且非所有运算都适合。'},\n{chapter:'shuffle',q:'用 Combiner 求总体平均分，哪种中间值才更安全？',options:['只保留每个 Mapper 的平均数','保留(分数总和,样本数)供下一步合并','先把最高分当平均分','任意丢弃一半数据'],a:1,why:'P53：平均值不能直接把不同规模的局部均值再取简单平均；可通过 sum/count 聚合。'},\n{chapter:'shuffle',q:'Map 端文件 Merge 与 Reduce 端 Merge 最核心的区别是？',options:['两者毫无区别','前者合并自己的多个 Spill，后者合并多个 Map 提供的数据','后者不会排序','只有 Map 端写文件'],a:1,why:'P57：两者合并的数据来源不同，后续去向也不同。'},\n{chapter:'shuffle',q:'Reduce Copy 阶段必须等全部 MapTask 完成才开始吗？',options:['必须','不必，单个 Map 完成后即可开始拉取其输出'],a:1,why:'P54–55：已完成的 Map 可以先供 Reduce 拉取，最终归约需要齐备的数据。'},\n{chapter:'practice',q:'Python Hadoop Streaming Reducer 通常从什么接收数据？',options:['按 key 排序的 stdin 行文本','原生 Java Iterable 参数','WebSocket','HDFS 自动推送的 JSON'],a:0,why:'P65–69：Streaming 使用标准输入输出，Reducer 常需自己检查相邻 key。'},\n{chapter:'practice',q:'本地模拟 Shuffle 最常用的 Linux 命令是哪一个？',options:['rm','sort','chmod','jps'],a:1,why:'P67：cat input | python3 mapper.py | sort | python3 reducer.py。'},\n{chapter:'practice',q:'学生成绩统计的 Mapper 输出哪两列最直接？',options:['课程名和学号','学号和成绩','课程名和 1','平均分和最高分'],a:1,why:'P78–80：Reducer 才根据同一学生的各条成绩算门数与平均分。'},\n{chapter:'practice',q:'统计选课门数和平均成绩，Reducer 应维护什么？',options:['count 和 total','只有最后一个课程名','所有任务的 Container ID','只记录最大值'],a:0,why:'P80：count 统计课程门数，total 累加分数，avg=total/count。'},\n{chapter:'practice',q:'Python Streaming Reducer 循环结束后为什么还有一次输出？',options:['打印多余空行','输出最后一个 key 的累计结果','重新启动 Hadoop','清理 NameNode'],a:1,why:'P66、P80：如果只在 key 切换时输出，最后一个 key 永远不会触发切换。'},\n{chapter:'practice',q:'课件商品收藏去重示例中，Python 使用哪种数据结构？',options:['set','list.sort()','tuple','dict.clear()'],a:0,why:'P74–76：set 自动保留唯一商品 ID。'}\n];\n\nQUIZ_BANK.push(...[{\"chapter\": \"bigdata\", \"q\": \"以下哪一个体现了计算向数据迁移？\", \"options\": [\"把数据复制到客户端本地统一处理\", \"让 MapTask 尽可能靠近包含该分片数据的 DataNode 运行\", \"强制所有数据读取 NameNode\", \"将所有 Mapper 放到 RM\"], \"a\": 1, \"why\": \"P30、P83：优先数据本地性，减少网络传输。\"}, {\"chapter\": \"principles\", \"q\": \"假设默认 Split=128MB、SPLIT_SLOP=1.1，150MB 文本文件通常有几个 Split？\", \"options\": [\"1\", \"2\", \"3\", \"150\"], \"a\": 1, \"why\": \"P25–26：150/128=1.17 大于 1.1，因此为两片。\"}, {\"chapter\": \"principles\", \"q\": \"FileInputFormat.getSplits() 在何时做什么？\", \"options\": [\"Map 执行时读取所有文本行\", \"客户端提交时依据元数据计算逻辑分片\", \"Reduce 结束时整理输出文件\", \"NodeManager 在本地求和\"], \"a\": 1, \"why\": \"P27–28：getSplits 在客户端用文件元数据计算范围；不读正文。\"}, {\"chapter\": \"principles\", \"q\": \"哪种方法在 MapTask 启动后真正读取一条记录？\", \"options\": [\"getSplits\", \"RecordReader.nextKeyValue\", \"HashPartitioner\", \"TextOutputFormat\"], \"a\": 1, \"why\": \"P29–31：MapTask 由 RecordReader 逐条提供 KV。\"}, {\"chapter\": \"principles\", \"q\": \"OutputFormat 发现目标输出目录已经存在，一般如何处理？\", \"options\": [\"覆盖\", \"拒绝提交/报错\", \"保留第一半数据\", \"自动增加 Reducer\"], \"a\": 1, \"why\": \"P41：输出目录需由作业自行创建；重跑先删除旧目录。\"}, {\"chapter\": \"principles\", \"q\": \"一个作业有 8 个 InputSplit，设置两个 ReduceTask；通常输出多少个 part-r 文件？\", \"options\": [\"8\", \"2\", \"1\", \"无法同时运行\"], \"a\": 1, \"why\": \"P39–41：ReduceTask 数量决定 part-r 文件数；Split 数决定 MapTask 数。\"}, {\"chapter\": \"yarn\", \"q\": \"AM 与 Container 的关系正确的是？\", \"options\": [\"AM 不需要 Container\", \"AM 自身也运行在 Container 中\", \"Container 只给 Reducer\", \"一个 Container 是一台 DataNode\"], \"a\": 1, \"why\": \"P44–45：AM 首先在 RM 安排的 Container 中启动。\"}, {\"chapter\": \"yarn\", \"q\": \"谁管理单台机器的 Container 启停？\", \"options\": [\"NameNode\", \"NodeManager\", \"ResourceManager 直接执行每个 Map\", \"Combiner\"], \"a\": 1, \"why\": \"P44：NM 管本机资源和 Container。\"}, {\"chapter\": \"yarn\", \"q\": \"热点 key 导致一个 Reducer 非常慢，首先是什么问题？\", \"options\": [\"数据倾斜\", \"OutputFormat 错误\", \"DataNode 数为 0\", \"Reduce 函数没启动\"], \"a\": 0, \"why\": \"P46：Hash/Partitioner 的数据分布可能失衡。\"}, {\"chapter\": \"shuffle\", \"q\": \"Combiner 和 Merge 的关键区别是什么？\", \"options\": [\"完全相同\", \"Combiner 计算预聚合，Merge 整理有序文件\", \"Merge 只存在 HDFS\", \"Combiner 一定执行\"], \"a\": 1, \"why\": \"P52–54：Combiner 可选且改变中间统计，Merge 是排序归并。\"}, {\"chapter\": \"shuffle\", \"q\": \"两组成绩分别 [100] 与 [50,50,50]，平均两组平均值得 75；正确总体平均分是？\", \"options\": [\"75\", \"62.5\", \"50\", \"100\"], \"a\": 1, \"why\": \"必须合并 (sum,count)：总分 250，总人数 4，平均 62.5。\"}, {\"chapter\": \"shuffle\", \"q\": \"Reduce 端何时可以开始 Copy 已完成 Map 的输出？\", \"options\": [\"必须所有 Map 完全结束之后\", \"有 Map 完成即可开始拉取其输出\", \"只在写 HDFS 后\", \"只在清理资源后\"], \"a\": 1, \"why\": \"P54–56：Copy 可与未完成 Map 并行；最终 Reduce 聚合要等键的数据齐全。\"}, {\"chapter\": \"practice\", \"q\": \"为什么 Python Streaming 作业仍需 hadoop-streaming*.jar？\", \"options\": [\"Python 脚本需要先打包 Java 字节码\", \"JAR 是 Hadoop Streaming 提供的运行框架入口\", \"JAR 保存成绩数据\", \"JAR 自动把所有 Python 转 Java\"], \"a\": 1, \"why\": \"P68–69：Streaming JAR 负责以标准输入/输出与 Python 脚本通信。\"}, {\"chapter\": \"practice\", \"q\": \"Hadoop Streaming 的 -files 主要用于什么？\", \"options\": [\"指定 HDFS 结果目录\", \"将本地脚本/文件分发到任务执行环境\", \"指定 Reduce 数量\", \"读取 NameNode 内存\"], \"a\": 1, \"why\": \"P69：-files 分发 Mapper、Reducer 等文件。\"}, {\"chapter\": \"practice\", \"q\": \"Streaming Python Reducer 判断“换学生”时，应先做什么？\", \"options\": [\"忽略前一个学生\", \"输出上一组并清空计数\", \"重启 Hadoop\", \"只更改 lastKey 不处理数据\"], \"a\": 1, \"why\": \"P80：新 key 意味着前一组结束，先输出之前统计，再重置。\"}, {\"chapter\": \"practice\", \"q\": \"Reducer 循环结束后还必须做什么？\", \"options\": [\"再输出一次最后的 key\", \"清空 HDFS 全部数据\", \"让 Map 再跑一遍\", \"什么都不做\"], \"a\": 0, \"why\": \"P66、P80：不补输出最后一组会漏掉它。\"}] );\n\nconst ROLES = [\n {key:'rm',name:'ResourceManager',alias:'总部资源调度',emoji:'🏢',job:'分配整个集群的 Container 资源，启动作业的 AM。',not:'不负责亲自执行 Map 函数。'},\n {key:'am',name:'ApplicationMaster',alias:'单项目经理',emoji:'🧑‍💼',job:'向 RM 要资源，找 NM 安排工人，跟踪任务和故障。',not:'它不是全局唯一：通常每个应用有自己的 AM。'},\n {key:'nm',name:'NodeManager',alias:'工地现场主管',emoji:'🦺',job:'在本机启动、停止 Container，汇报本机资源。',not:'不负责全局资源调度。'},\n {key:'container',name:'Container',alias:'算力工位 / 物资配额',emoji:'📦',job:'CPU、内存等资源的逻辑封装；AM、MapTask、ReduceTask 都需要它。',not:'它不是物理机器，也不是直接做统计的工人。'},\n {key:'task',name:'MapTask / ReduceTask',alias:'真正的执行工人',emoji:'👷',job:'Map 分别加工数据；Reduce 汇总归约数据。',not:'Task 不等于负责资源分配的 RM。'}\n];\n\nconst JOB_STEPS = [\n {title:'客户提交工程单',who:'Client → ResourceManager',actual:'用户通过客户端提交 MapReduce 作业给 RM。',story:'客户把“统计所有学生平均分”的合同交给建筑公司总部。',test:'作业最初交给谁？RM。'},\n {title:'总部指派项目经理',who:'ResourceManager → Container → ApplicationMaster',actual:'RM 分配第一个 Container，在其中启动该应用的 AM。',story:'总部先给项目经理一个办公室和办公资源，让他开始组织项目。',test:'AM 也运行在 Container 中。'},\n {title:'项目经理申请工位',who:'ApplicationMaster → ResourceManager',actual:'AM 向 RM 申请运行 Map 与 Reduce 任务所需的 Container。',story:'项目经理发现需要 5 个工位，给总部递交资源申请单。',test:'向 RM 申请的是 AM，不是 Map 函数。'},\n {title:'现场主管启动工人',who:'ApplicationMaster ↔ NodeManager',actual:'AM 与相应 NM 通信，在所分配的 Container 中启动任务。',story:'经理联系各工地的现场主管，安排工人在已经分配的工位上上岗。',test:'NM 管本机资源，真正执行的是 Task。'},\n {title:'工人开始施工',who:'MapTask → Shuffle → ReduceTask',actual:'Map 读输入并输出中间结果；Shuffle 传送和归并；Reduce 汇总最终结果。',story:'Map 工人拆货贴标签，分拣中心 Shuffle 归类，Reduce 工人清点出最终总数。',test:'Shuffle 夹在 Map 和 Reduce 之间。'},\n {title:'经理巡检并补位',who:'ApplicationMaster',actual:'AM 跟踪任务状态；如有失败，协调重新申请资源或重启任务。',story:'项目经理查进度，哪个工人掉线就重新调人。',test:'容错靠发现 + 重试，而不是假定机器永不坏。'},\n {title:'汇报、归档、释放工位',who:'ApplicationMaster → ResourceManager → Client',actual:'全部任务完成，AM 向 RM 报告完成并释放资源，客户端查询结果。',story:'经理向总部交工，退还工位；客户收到整理好的成果。',test:'最终归约结果保存在指定输出位置。'}\n];\n\n  \u003c/script>\n  \u003cscript>\n'use strict';\nconst $ = id => document.getElementById(id);\nconst esc = s => String(s).replace(/[&\u003c>\"']/g, c => ({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst readLS = (k,fallback) => {try{return JSON.parse(localStorage.getItem(k)) ?? fallback;}catch{return fallback;}};\nconst saveLS = (k,v) => {try{localStorage.setItem(k,JSON.stringify(v));}catch{}};\nlet learned = new Set(readLS('mr-learned',[]));\nlet focusOnly = false;\nlet activeStep = 0;\nlet activeRole = 'rm';\nlet activeShuffle = 0;\nlet exam = null;\nlet currentCode = 'mapper.py';\n\nfunction renderNav(){\n $('chapter-nav').innerHTML=CHAPTERS.map(c=>`\u003ca class=\"nav-link nav-small\" href=\"#chapter-${c.id}\">\u003cspan>${esc(c.num)}\u003c/span>${esc(c.name)}\u003c/a>`).join('');\n $('exam-chapter').insertAdjacentHTML('beforeend',CHAPTERS.map(c=>`\u003coption value=\"${c.id}\">${esc(c.name)}\u003c/option>`).join(''));\n $('lesson-total').textContent=LESSONS.length;\n $('quiz-total').textContent=QUIZ_BANK.length;\n}\nfunction renderCurriculum(){\n $('chapters-container').innerHTML=CHAPTERS.map(c=>{\n   const cards=LESSONS.filter(l=>l.chapter===c.id).map(l=>`\u003carticle class=\"lesson${learned.has(l.id)?' learned':''}\" data-id=\"${esc(l.id)}\" data-search=\"${esc([l.title,l.hook,l.analogy,l.core,l.trap,l.pages,c.name,l.more].join(' ').toLowerCase())}\">\n     \u003cdiv class=\"lesson-head\">\u003cspan class=\"lesson-pages\">${esc(l.pages)}\u003c/span>\u003cbutton type=\"button\" class=\"lesson-check${learned.has(l.id)?' checked':''}\" data-learned=\"${esc(l.id)}\" aria-pressed=\"${learned.has(l.id)}\">${learned.has(l.id)?'✓ 已掌握':'○ 标为已掌握'}\u003c/button>\u003c/div>\n     \u003ch4>${esc(l.title)}\u003c/h4>\u003cp class=\"lesson-hook\">${esc(l.hook)}\u003c/p>\n     \u003cdiv class=\"analogy\">\u003cspan class=\"card-overline\">💡 换个画面理解\u003c/span>\u003cp>${esc(l.analogy)}\u003c/p>\u003c/div>\n     \u003cdiv class=\"card-core\">\u003cspan class=\"card-overline\">◎ 考试准确表述\u003c/span>\u003cp>${esc(l.core)}\u003c/p>\u003c/div>\n     \u003cdetails>\u003csummary>记忆口诀 · 易错点 · 继续展开\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp class=\"memorize\">\u003cb>记：\u003c/b>${esc(l.memory)}\u003c/p>\u003cp class=\"trap\">\u003cb>易错：\u003c/b>${esc(l.trap)}\u003c/p>\u003cp>\u003cb>补充：\u003c/b>${esc(l.more)}\u003c/p>\u003c/div>\u003c/details>\n     \u003c/article>`).join('');\n   return `\u003cdiv class=\"chapter-block\" id=\"chapter-${c.id}\">\u003cdiv class=\"chapter-cards-caption\">核心知识卡片 · 用故事理解、按考点记忆\u003c/div>\u003cdiv class=\"lessons-grid\">${cards}\u003c/div>\u003c/div>`;\n }).join('');\n document.querySelectorAll('[data-learned]').forEach(button=>button.addEventListener('click',()=>{\n   const id=button.dataset.learned;\n   if(learned.has(id))learned.delete(id); else learned.add(id);\n   saveLS('mr-learned',[...learned]);\n   const card=button.closest('.lesson'); card.classList.toggle('learned',learned.has(id));\n   button.classList.toggle('checked',learned.has(id));button.textContent=learned.has(id)?'✓ 已掌握':'○ 标为已掌握';button.setAttribute('aria-pressed',learned.has(id));\n   updateProgress();filterLessons();if(currentView.startsWith('chapter-')){const n=LESSONS.filter(l=>l.chapter===currentChapter&&learned.has(l.id)).length;const total=LESSONS.filter(l=>l.chapter===currentChapter).length;$('chapter-mini-status').textContent=`本章节：${n} / ${total} 个知识点已掌握 · 实验也在本页下方`; }\n }));\n updateProgress();\n}\nfunction updateProgress(){\n const n=LESSONS.filter(l=>learned.has(l.id)).length;\n $('sidebar-progress').textContent=`${n} / ${LESSONS.length}`;\n $('progress-fill').style.width=`${100*n/LESSONS.length}%`;\n}\nfunction filterLessons(){\n const term=$('lesson-search').value.trim().toLowerCase();let count=0;\n const chapterLessons=LESSONS.filter(l=>l.chapter===currentChapter);\n document.querySelectorAll('.chapter-block').forEach(block=>{block.hidden=block.id!=='chapter-'+currentChapter;});\n document.querySelectorAll('.lesson').forEach(card=>{\n   const inChapter=card.closest('.chapter-block').id==='chapter-'+currentChapter;\n   const visible=inChapter&&(!term||card.dataset.search.includes(term))&&(!focusOnly||!card.classList.contains('learned'));\n   card.hidden=!visible;if(visible)count++;\n });\n $('filtered-count').textContent=`当前板块：${count} / ${chapterLessons.length} 个知识点`;\n $('empty-search').hidden=count!==0;\n}\nfunction initCurriculum(){\n $('lesson-search').addEventListener('input',filterLessons); $('chapter-focus-btn').addEventListener('click',()=>{$('focus-btn').click();$('chapter-focus-btn').textContent=focusOnly?'显示已掌握':'只看未掌握';});\n $('focus-btn').addEventListener('click',()=>{focusOnly=!focusOnly;$('focus-btn').classList.toggle('is-on',focusOnly);$('focus-btn').textContent=focusOnly?'显示全部':'专注未掌握';$('chapter-focus-btn').textContent=focusOnly?'显示已掌握':'只看未掌握';filterLessons();});\n $('show-all').addEventListener('click',()=>{$('lesson-search').value='';focusOnly=false;$('focus-btn').classList.remove('is-on');$('focus-btn').textContent='专注未掌握';$('chapter-focus-btn').textContent='只看未掌握';filterLessons();});\n $('reset-progress').addEventListener('click',()=>{if(!window.confirm('清空所有“已掌握”记录吗？'))return;learned.clear();saveLS('mr-learned',[]);document.querySelectorAll('.lesson').forEach(card=>{card.classList.remove('learned');const b=card.querySelector('[data-learned]');b.classList.remove('checked');b.setAttribute('aria-pressed','false');b.textContent='○ 标为已掌握';});updateProgress();showRoute(location.hash||'#top');});\n}\nfunction renderRoles(){\n $('role-tabs').innerHTML=ROLES.map(r=>`\u003cbutton type=\"button\" class=\"role-tab${r.key===activeRole?' active':''}\" data-role=\"${r.key}\" aria-pressed=\"${r.key===activeRole}\">${r.emoji} ${esc(r.name==='ResourceManager'?'RM':r.name==='ApplicationMaster'?'AM':r.name==='NodeManager'?'NM':r.name==='Container'?'Container':'Task')}\u003c/button>`).join('');\n const r=ROLES.find(x=>x.key===activeRole);\n $('role-detail').innerHTML=`\u003cdiv class=\"role-face\">${r.emoji}\u003c/div>\u003cdiv>\u003ch4>${esc(r.name)} \u003csmall>≈ ${esc(r.alias)}\u003c/small>\u003c/h4>\u003cp>${esc(r.job)}\u003c/p>\u003cp class=\"role-trap\">不要误记：${esc(r.not)}\u003c/p>\u003c/div>`;\n $('role-tabs').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{activeRole=b.dataset.role;renderRoles();}));\n}\nfunction renderStep(){\n $('step-count').textContent=`${String(activeStep+1).padStart(2,'0')} / 07`;\n $('step-dots').innerHTML=JOB_STEPS.map((s,i)=>`\u003cbutton type=\"button\" class=\"step-dot${i===activeStep?' current':i\u003cactiveStep?' visited':''}\" aria-label=\"第${i+1}步：${esc(s.title)}\" aria-current=\"${i===activeStep?'step':'false'}\" data-step=\"${i}\">${i+1}\u003c/button>`).join('');\n const s=JOB_STEPS[activeStep];\n $('step-detail').innerHTML=`\u003cdiv class=\"who\">${esc(s.who)}\u003c/div>\u003ch4>${esc(s.title)}\u003c/h4>\u003cp>🎬 故事：${esc(s.story)}\u003c/p>\u003cp class=\"formal\">📝 课件表达：${esc(s.actual)}\u003c/p>\u003cp class=\"step-memory\">必记：${esc(s.test)}\u003c/p>`;\n $('prev-step').disabled=activeStep===0;\n $('next-step').textContent=activeStep===6?'重新过一遍 ↻':'下一步 →';\n $('step-dots').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{activeStep=+b.dataset.step;renderStep();}));\n}\nfunction initSteps(){\n $('prev-step').addEventListener('click',()=>{activeStep=Math.max(0,activeStep-1);renderStep();});\n $('next-step').addEventListener('click',()=>{activeStep=(activeStep+1)%JOB_STEPS.length;renderStep();});\n renderStep();renderRoles();\n}\nconst STAGE_NAMES=['原始文本','Map：逐词打 1','Shuffle：排序分组','Reduce：每组求和'];\nconst STAGE_DESC=[\n '这是一行原始输入。TextInputFormat 在原生 API 下把文本行和字节偏移交给 Map。',\n 'Mapper 对每个单词独立输出一条 (key,1)。重复 key 仍分别输出，不急着计算总数。',\n '框架把 key 排序和分组：同一个 key 的多个 value 聚成一组。此处演示其逻辑效果。',\n 'Reducer 对每个 key 下的一组数求和，得到最后的词频结果。'\n];\nfunction getTokens(){return $('word-input').value.trim().split(/\\s+/).filter(Boolean).slice(0,80).map(w=>w.toLowerCase());}\nfunction renderShuffle(){\n const words=getTokens();const map=new Map();words.forEach(w=>map.set(w,(map.get(w)||0)+1));const grouped=[...map.entries()].sort((a,b)=>a[0].localeCompare(b[0]));\n $('stage-buttons').innerHTML=STAGE_NAMES.map((s,i)=>`\u003cbutton type=\"button\" class=\"stage-btn${i===activeShuffle?' active':''}\" data-stage=\"${i}\" aria-pressed=\"${i===activeShuffle}\">${i+1}. ${esc(s)}\u003c/button>`).join('');\n $('stage-caption').textContent=STAGE_NAMES[activeShuffle];$('stage-number').textContent=`${activeShuffle+1} / 4`;\n $('shuffle-explainer').textContent=STAGE_DESC[activeShuffle];\n $('next-shuffle').textContent=activeShuffle===3?'重放 ↻':'下一阶段 →';\n let output;\n if(!words.length)output='\u003cspan class=\"micro-note\">请先输入至少一个单词。\u003c/span>';\n else if(activeShuffle===0)output=`\u003cspan class=\"kv\">${esc($('word-input').value.trim().slice(0,500))}\u003c/span>`;\n else if(activeShuffle===1)output=words.map(w=>`\u003cspan class=\"kv\">(${esc(w)}, 1)\u003c/span>`).join('');\n else if(activeShuffle===2)output=grouped.map(([w,n])=>`\u003cspan class=\"kv group\">(${esc(w)}, &lt;${Array(n).fill(1).join(', ')}&gt;)\u003c/span>`).join('');\n else output=grouped.map(([w,n])=>`\u003cspan class=\"kv final\">(${esc(w)}, ${n})\u003c/span>`).join('');\n if(words.length===80)output+='\u003cspan class=\"micro-note\">仅演示前 80 个单词。\u003c/span>';\n $('shuffle-result').innerHTML=output;\n $('stage-buttons').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{activeShuffle=+b.dataset.stage;renderShuffle();}));\n}\nfunction initShuffle(){\n $('word-input').addEventListener('input',renderShuffle);\n $('next-shuffle').addEventListener('click',()=>{activeShuffle=(activeShuffle+1)%4;renderShuffle();});\n $('reset-shuffle').addEventListener('click',()=>{activeShuffle=0;renderShuffle();});renderShuffle();\n}\nfunction splitSizes(total,size){\n // Hadoop FileInputFormat 的常见 SPLIT_SLOP 逻辑（课件 P25），示意、非精确文件系统模拟。\n let remaining=total;const output=[];\n while(remaining/size>1.1 && output.length\u003c20000){output.push(size);remaining-=size;}\n if(remaining>0)output.push(remaining);\n return output;\n}\nfunction renderSplit(){\n let filesize=Number($('file-size').value);const size=Number($('block-size').value);\n if(!Number.isFinite(filesize)||filesize\u003c=0){$('split-count').textContent='—';$('split-bars').innerHTML='';$('split-explanation').textContent='请输入大于 0 的文件大小。';return;}\n filesize=Math.min(filesize,1048576);\n const parts=splitSizes(filesize,size);$('split-count').textContent=parts.length;\n $('split-bars').innerHTML=parts.length>16?`\u003cdiv class=\"split-compact\">${parts.length} 段，数量过多，仅显示概念；调小文件大小可查看每段。\u003c/div>`:parts.map((p,i)=>`\u003cdiv class=\"split-bar\" style=\"flex:${Math.max(p,12)}\" title=\"Split ${i+1}：${p.toFixed(1)}MB\">\u003cspan>${i+1}\u003c/span>\u003csmall>${Number(p.toFixed(1))} MB\u003c/small>\u003c/div>`).join('');\n $('split-explanation').textContent=`文件 ${filesize} MB，目标单片 ${size} MB，考虑最后余量的 1.1 阈值，约 ${parts.length} 个逻辑 Split → 通常约 ${parts.length} 个 Map Task。没有物理切割文件。`;\n}\nfunction initSplit(){$('file-size').addEventListener('input',renderSplit);$('block-size').addEventListener('change',renderSplit);renderSplit();}\nfunction shuffleArray(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}\nfunction startExam(){\n const chapter=$('exam-chapter').value;const size=$('exam-count').value;\n const pool=QUIZ_BANK.filter(q=>chapter==='all'||q.chapter===chapter);\n const selected=shuffleArray(pool).slice(0,size==='all'?pool.length:Math.min(+size,pool.length));\n exam={questions:selected,idx:0,correct:0,misses:[],answered:false};\n $('exam-controls').hidden=true;$('exam-stage').hidden=false;$('exam-finish').hidden=true;renderQuestion();\n}\nfunction renderQuestion(){\n const q=exam.questions[exam.idx];exam.answered=false;\n const idx=exam.idx+1,n=exam.questions.length;\n $('exam-stage').innerHTML=`\u003cdiv class=\"exam-topline\">\u003cspan>QUESTION ${String(idx).padStart(2,'0')} / ${String(n).padStart(2,'0')}\u003c/span>\u003cspan>已答对 ${exam.correct} 道\u003c/span>\u003c/div>\u003cdiv class=\"exam-meter\">\u003cdiv style=\"width:${100*(idx-1)/n}%\">\u003c/div>\u003c/div>\u003cdiv class=\"question-text\">${esc(q.q)}\u003c/div>\u003cdiv class=\"answer-options\">${q.options.map((opt,i)=>`\u003cbutton class=\"answer-opt\" data-answer=\"${i}\">\u003cspan>${String.fromCharCode(65+i)}\u003c/span>${esc(opt)}\u003c/button>`).join('')}\u003c/div>\u003cdiv id=\"answer-feedback\">\u003c/div>\u003cdiv class=\"exam-next\">\u003cbutton id=\"next-question\" class=\"btn-primary\" hidden>${idx===n?'查看成绩 →':'下一题 →'}\u003c/button>\u003c/div>`;\n $('exam-stage').querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>chooseAnswer(+b.dataset.answer)));\n $('next-question').addEventListener('click',()=>{exam.idx++;if(exam.idx===exam.questions.length)finishExam();else renderQuestion();});\n}\nfunction chooseAnswer(choice){\n if(exam.answered)return;exam.answered=true;\n const q=exam.questions[exam.idx];const success=choice===q.a;\n if(success)exam.correct++;else exam.misses.push({q,choice});\n $('exam-stage').querySelectorAll('[data-answer]').forEach(b=>{\n   const i=+b.dataset.answer;\n   b.disabled=true;b.classList.toggle('correct',i===q.a);b.classList.toggle('wrong',i===choice&&choice!==q.a);\n });\n $('answer-feedback').innerHTML=`\u003cdiv class=\"exam-explanation\">\u003cdiv class=\"exam-feedback-head\">${success?'✓ 回答正确':'✕ 回答错误'} · 正确答案 ${String.fromCharCode(65+q.a)}\u003c/div>\u003cdiv>${esc(q.why)}\u003c/div>\u003c/div>`;\n $('next-question').hidden=false;\n}\nfunction finishExam(){\n $('exam-stage').hidden=true;$('exam-finish').hidden=false;\n const n=exam.questions.length;const pct=Math.round(100*exam.correct/n);\n $('exam-finish').innerHTML=`\u003cdiv class=\"score\">${pct}\u003cspan style=\"font-size:21px\"> / 100\u003c/span>\u003c/div>\u003ch3>${pct>=90?'已经掌握得不错！':pct>=70?'方向对了，抓住易错点。':'把错题再理解一遍，会进步很快。'}\u003c/h3>\u003cp>共 ${n} 题，答对 ${exam.correct} 题，错 ${exam.misses.length} 题。错题解释可以直接展开复习。\u003c/p>${exam.misses.length?`\u003cdiv class=\"missed\">\u003ch4>错题回顾\u003c/h4>${exam.misses.map((m,i)=>`\u003cdetails>\u003csummary>${i+1}. ${esc(m.q.q)}\u003c/summary>\u003cp>\u003cb>正确答案：\u003c/b>${esc(m.q.options[m.q.a])}\u003c/p>\u003cp>${esc(m.q.why)}\u003c/p>\u003c/details>`).join('')}\u003c/div>`:''}\u003cbutton id=\"redo-exam\" class=\"btn-primary\">再做一轮 →\u003c/button>`;\n $('redo-exam').addEventListener('click',()=>{$('exam-controls').hidden=false;$('exam-finish').hidden=true;});\n}\nfunction renderCheats(){\n const cheats=[\n ['Map','逐条加工，输出独立 KV','同 key 可出现多次；不能直接当成总数。'],\n ['Reduce','按 key 接收一组 values','Java API 可迭代；Streaming 文本行按 key 排序。'],\n ['Shuffle','分区 → 排序 → 归并','把同 key 送同一 Reducer，不代表不同 key 必须分开。'],\n ['InputSplit','逻辑工作范围','不物理切文件；通常 1 Split → 1 MapTask。'],\n ['HDFS Block','物理存储块','Split 与 Block 常对齐，但不必一样。'],\n ['RecordReader','启动 Map 后读一条条记录','计算 Split 时无需读取实际正文。'],\n ['RM','全局资源管理员','管集群资源，不亲自执行数据统计。'],\n ['AM','每个应用的项目经理','申请 Container、协调与监控 Task。'],\n ['NM','每台机器的现场主管','管理本机 Container，启动/停止任务。'],\n ['Container','CPU + 内存的资源工位','不是 DataNode，也不是 Task 本身。'],\n ['Spill','缓冲区达阈值溢到本地磁盘','课件示例默认 100MB、80%。'],\n ['Combiner','可选 Map 端预聚合','不保证执行，不是所有函数都适合。'],\n ['Map Merge','合自己的多个 Spill 文件','来源是“一个 Map 的多个文件”。'],\n ['Reduce Merge','合不同 Map 的对应分区','来源是“多个 Map 的同一分区”。'],\n ['数据本地性','把计算尽量放在数据所在地','少搬数据，不是所有作业只运行一台机器。'],\n ['输出目录','必须未存在','重跑先删除旧 output 目录。'],\n ];\n $('cheats-grid').innerHTML=cheats.map(([name,desc,trap])=>`\u003carticle class=\"cheat\">\u003ch4>${esc(name)}\u003c/h4>\u003cp>${esc(desc)}\u003c/p>\u003cdetails>\u003csummary>常见考法 / 易错\u003c/summary>\u003cp>${esc(trap)}\u003c/p>\u003c/details>\u003c/article>`).join('');\n}\nconst CODE_SAMPLES={\n 'mapper.py':`import sys\n\n# WordCount: 一行行读，逐词输出 (word,1)\nfor line in sys.stdin:\n    for word in line.strip().lower().split():\n        print(f\"{word}\\\\t1\")`,\n 'reducer.py':`import sys\n\nlast_key = None\ntotal = 0\n\n# Streaming 输入是按 key 排序的文本行\nfor line in sys.stdin:\n    key, value = line.strip().split(\"\\\\t\")\n    value = int(value)\n    if last_key is not None and key != last_key:\n        print(f\"{last_key}\\\\t{total}\")\n        total = 0\n    last_key = key\n    total += value\n\n# 不要漏掉最后一个 key\nif last_key is not None:\n    print(f\"{last_key}\\\\t{total}\")`,\n '终端命令':`# 先建立 words.txt，例如：\nprintf 'Hello World Hello Hadoop\\\\n' > words.txt\n\n# 本地逐步验证 Map / 排序 / Reduce\ncat words.txt | python3 mapper.py\ncat words.txt | python3 mapper.py | sort\ncat words.txt | python3 mapper.py | sort | python3 reducer.py\n\n# 假设 Hadoop / HDFS 已配置并启动\nhadoop fs -mkdir -p /user/$USER/mr_input\nhadoop fs -put -f words.txt /user/$USER/mr_input/\nhadoop fs -rm -r -f /user/$USER/mr_output\nSTREAMING_JAR=$(find \"$HADOOP_HOME/share/hadoop/tools/lib\" -name 'hadoop-streaming*.jar' | head -n 1)\nhadoop jar \"$STREAMING_JAR\" -files mapper.py,reducer.py -mapper 'python3 mapper.py' -reducer 'python3 reducer.py' -input /user/$USER/mr_input -output /user/$USER/mr_output\nhadoop fs -cat /user/$USER/mr_output/part-*`,\n 'score_mapper.py':`import sys\n\n# 每行: 学号,课程,成绩\nfor line in sys.stdin:\n    data = line.strip().split(\",\")\n    if len(data) == 3:\n        print(f\"{data[0]}\\\\t{data[2]}\")`,\n 'score_reducer.py':`import sys\n\nlast_key = None\ncount = 0\ntotal = 0\nfor line in sys.stdin:\n    student, score = line.strip().split(\"\\\\t\")\n    score = int(score)\n    if last_key is not None and student != last_key:\n        print(f\"{last_key}\\\\t{count}\\\\t{total/count:.2f}\")\n        count, total = 0, 0\n    last_key = student\n    count += 1\n    total += score\nif last_key is not None:\n    print(f\"{last_key}\\\\t{count}\\\\t{total/count:.2f}\")`\n};\nCODE_SAMPLES[\"商品去重_mapper.py\"] = \"import sys\\n\\n# 假设每行由制表符分隔：用户ID 商品ID 收藏日期\\nfor line in sys.stdin:\\n    fields = line.strip().split(\\\"\\\\t\\\")\\n    if len(fields) >= 2:\\n        product_id = fields[1]\\n        print(f\\\"{product_id}\\\\t1\\\")\";\nCODE_SAMPLES[\"商品去重_reducer.py\"] = \"import sys\\n\\n# Hadoop Streaming 会给 Reducer 排好 key\\nlast_product = None\\nfor line in sys.stdin:\\n    parts = line.strip().split(\\\"\\\\t\\\", 1)\\n    if len(parts) != 2:\\n        continue\\n    product = parts[0]\\n    if product != last_product:\\n        print(product)\\n        last_product = product\";\nCODE_SAMPLES[\"商品去重_课堂set版本.py\"] = \"import sys\\n\\n# 课堂 P76 版本：收集唯一商品 ID 再输出\\n# 注意：内存随唯一 ID 数量增长，输出顺序不保证\\nseen = set()\\nfor line in sys.stdin:\\n    parts = line.strip().split(\\\"\\\\t\\\", 1)\\n    if parts:\\n        seen.add(parts[0])\\nfor product in seen:\\n    print(product)\";\nCODE_SAMPLES[\"完整成绩_含最高分.py\"] = \"import sys\\n\\n# PPT P78-80：输入是 姓名,成绩（两列）\\nlast_key = None\\ncount = total = 0\\nmaximum = None\\n\\nfor line in sys.stdin:\\n    key, val = line.strip().split(\\\"\\\\t\\\")\\n    score = int(val)\\n    if last_key is not None and key != last_key:\\n        print(f\\\"{last_key}\\\\t{total/count:.2f}\\\\t{maximum}\\\")\\n        count = total = 0\\n        maximum = None\\n    last_key = key\\n    count += 1\\n    total += score\\n    maximum = score if maximum is None else max(maximum,score)\\n\\nif last_key is not None:\\n    print(f\\\"{last_key}\\\\t{total/count:.2f}\\\\t{maximum}\\\")\";\nCODE_SAMPLES[\"成绩作业_全部命令.sh\"] = \"# 把 score_mapper.py 和 score_reducer.py 保存到本地当前目录\\nprintf '230001,computer,93\\\\n230001,math,88\\\\n230002,math,78\\\\n230001,AI,85\\\\n230003,computer,92\\\\n230002,english,89\\\\n230003,math,80\\\\n' > score.txt\\n\\n# 本地验证：map -> 排序 -> reducer\\ncat score.txt | python3 score_mapper.py\\ncat score.txt | python3 score_mapper.py | sort\\ncat score.txt | python3 score_mapper.py | sort | python3 score_reducer.py\\n\\n# 上传到 HDFS，重跑时清理旧输出目录\\nhadoop fs -mkdir -p /user/$USER/score_input\\nhadoop fs -put -f score.txt /user/$USER/score_input/\\nhadoop fs -rm -r -f /user/$USER/score_output\\n\\n# 找到本机安装版本的 Streaming JAR\\nSTREAMING_JAR=$(find \\\"$HADOOP_HOME/share/hadoop/tools/lib\\\" -name 'hadoop-streaming*.jar' | head -n 1)\\n\\n# 注意这里 -files 是本地脚本；-input/-output 是 HDFS 路径\\nhadoop jar \\\"$STREAMING_JAR\\\" -files score_mapper.py,score_reducer.py -mapper 'python3 score_mapper.py' -reducer 'python3 score_reducer.py' -input /user/$USER/score_input -output /user/$USER/score_output\\nhadoop fs -cat /user/$USER/score_output/part-*\";\nfunction renderCode(){\n $('code-tabs').innerHTML=Object.keys(CODE_SAMPLES).map(k=>`\u003cbutton type=\"button\" role=\"tab\" aria-selected=\"${k===currentCode}\" class=\"code-tab${k===currentCode?' active':''}\" data-code=\"${esc(k)}\">${esc(k)}\u003c/button>`).join('');\n $('code-filename').textContent=currentCode;\n $('code-content').textContent=CODE_SAMPLES[currentCode];\n $('code-tabs').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{currentCode=b.dataset.code;renderCode();}));\n}\nfunction initCode(){\n $('copy-code').addEventListener('click',async()=>{\n   const txt=CODE_SAMPLES[currentCode];\n   try{await navigator.clipboard.writeText(txt);$('copy-code').textContent='✓ 已复制';}catch{\n     const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();\n     try{document.execCommand('copy');$('copy-code').textContent='✓ 已复制';}catch{$('copy-code').textContent='请手动复制';}ta.remove();\n   }\n   setTimeout(()=>{$('copy-code').textContent='复制代码';},1800);\n });renderCode();\n}\nfunction initTheme(){\n const saved=readLS('mr-theme','light');document.documentElement.dataset.theme=saved;\n $('theme-btn').addEventListener('click',()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;saveLS('mr-theme',next);});\n}\n\nconst PAGE_SEQUENCE = [\n {route:'top', name:'学习首页', short:'首页'},\n ...CHAPTERS.map(c=>({route:'chapter-'+c.id,name:c.name,short:c.name})),\n {route:'exam',name:'考前自测',short:'自测'},\n {route:'cheats',name:'考点速记',short:'速记'}\n];\nconst SPECIAL_DESTINATIONS = {'job-lab':'yarn','shuffle-lab':'shuffle','split-lab':'principles','practice-code':'practice'};\nlet currentView = 'top';\nlet currentChapter = 'bigdata';\n\nfunction arrangeViews(){\n // 同一份 HTML，逻辑上拆成首页、五章、练习、速记共八个独立板块。\n const main=$('main');\n const home=document.createElement('div');home.id='view-home';home.className='study-view';\n main.insertBefore(home,$('top'));\n home.append($('top'),document.querySelector('.essence'),$('coverage-audit'));\n // 把实验放回各自对应的章节，不再形成长长的一整页。\n const labPlacements=[['split-lab','principles'],['job-lab','yarn'],['shuffle-lab','shuffle'],['practice-code','practice']];\n for(const [lab,chapter] of labPlacements){\n   $('chapter-'+chapter).appendChild($(lab));\n }\n for(const c of CHAPTERS){\n   const t=$('deep-template-'+c.id);\n   if(t)$('chapter-'+c.id).appendChild(t.content.cloneNode(true));\n }\n // 搜索后仍保留实验区块，失去匹配的只是相应知识卡片。\n}\nfunction routeInfo(hash){\n const requested=decodeURIComponent((hash||'#top').replace(/^#/,''));\n if(requested.startsWith('chapter-') && CHAPTERS.some(c=>c.id===requested.slice(8))){\n   return {page:requested,chapter:requested.slice(8),anchor:''};\n }\n if(SPECIAL_DESTINATIONS[requested])return {page:'chapter-'+SPECIAL_DESTINATIONS[requested],chapter:SPECIAL_DESTINATIONS[requested],anchor:requested};\n if(requested==='exam'||requested==='cheats')return {page:requested,chapter:null,anchor:''};\n return {page:'top',chapter:null,anchor:''};\n}\nfunction updatePager(){\n const index=PAGE_SEQUENCE.findIndex(p=>p.route===currentView);\n const prev=PAGE_SEQUENCE[index-1],next=PAGE_SEQUENCE[index+1];\n const update=(link,textEl,item,disabled)=>{\n   link.setAttribute('href','#'+(item?.route||currentView));\n   link.setAttribute('aria-disabled',String(disabled));\n   $(textEl).textContent=item?.name||(disabled&&link.id==='pager-prev'?'已经是第一个板块':'已经是最后一个板块');\n };\n update($('pager-prev'),'pager-prev-text',prev,!prev);\n update($('pager-next'),'pager-next-text',next,!next);\n $('pager-mark').textContent=String(index+1).padStart(2,'0')+' / '+String(PAGE_SEQUENCE.length).padStart(2,'0');\n}\nfunction showRoute(hash){\n const info=routeInfo(hash);\n currentView=info.page;\n if(info.chapter)currentChapter=info.chapter;\n $('view-home').hidden=currentView!=='top';\n $('course').hidden=!currentView.startsWith('chapter-');\n $('exam').hidden=currentView!=='exam';\n $('cheats').hidden=currentView!=='cheats';\n if(info.chapter){\n   const c=CHAPTERS.find(ch=>ch.id===info.chapter);\n   $('course-label').textContent=`CHAPTER ${c.num} / 05 · ${c.pages}`;\n   $('course-title').textContent=c.name;\n   $('course-desc').textContent=c.description+'  按“类比 → 精准考点 → 易错点”学会这一板块。';\n   const n=LESSONS.filter(l=>l.chapter===c.id && learned.has(l.id)).length;\n   const total=LESSONS.filter(l=>l.chapter===c.id).length;\n   $('chapter-mini-status').textContent=`本章节：${n} / ${total} 个知识点已掌握 · 实验也在本页下方`;\n   filterLessons();\n }\n const p=PAGE_SEQUENCE.find(x=>x.route===currentView);\n $('page-label').textContent='MAPREDUCE  /  '+p.name;\n $('focus-btn').hidden=!info.chapter;\n updatePager();\n document.querySelectorAll('.side-nav .nav-link').forEach(a=>{\n   const link=a.getAttribute('href').slice(1);\n   const active=link===(hash||'#top').replace('#','')||(link===currentView&&!(info.anchor));\n   a.classList.toggle('active',active);\n   if(active)a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');\n });\n // 优先回到板块顶部；从目录直达互动实验时，滚动到实验标题。\n requestAnimationFrame(()=>requestAnimationFrame(()=>{\n   if(info.anchor){$(info.anchor).scrollIntoView({block:'start',behavior:'instant'});}\n   else window.scrollTo({top:0,behavior:'instant'});\n }));\n}\nfunction setupDirectoryToggle(){\n const side=$('sidebar'),button=$('menu-toggle'),overlay=$('mobile-overlay');\n const mobile=()=>window.matchMedia('(max-width:780px)').matches;\n const update=()=>{\n   const isMobile=mobile(), openMobile=side.classList.contains('open');\n   if(!isMobile){side.classList.remove('open');overlay.hidden=true;}\n   else {overlay.hidden=!openMobile;}\n   const visible=isMobile?openMobile:!document.body.classList.contains('sidebar-collapsed');\n   button.setAttribute('aria-expanded',String(visible));\n   button.setAttribute('aria-label',visible?'收起目录':'展开目录');\n   $('menu-text').textContent=visible?'收起目录':'打开目录';\n };\n const closeMobile=()=>{side.classList.remove('open');update()};\n button.addEventListener('click',()=>{\n   if(mobile())side.classList.toggle('open');\n   else{document.body.classList.toggle('sidebar-collapsed');saveLS('mr-sidebar-collapsed',document.body.classList.contains('sidebar-collapsed'));}\n   update();\n });\n overlay.addEventListener('click',closeMobile);\n window.addEventListener('resize',update);\n document.addEventListener('keydown',e=>{if(e.key==='Escape'&&side.classList.contains('open'))closeMobile();});\n document.body.classList.toggle('sidebar-collapsed',readLS('mr-sidebar-collapsed',false));\n update();\n return closeMobile;\n}\nfunction initNavigation(){\n const closeMobile=setupDirectoryToggle();\n // 当前页切换采用 hash 链接：便于收藏指定章节，也支持前进/后退。\n document.addEventListener('click',event=>{\n   const a=event.target.closest('a[href^=\"#\"]');if(!a)return;\n   const hash=a.getAttribute('href');\n   if(!hash||hash==='#')return;\n   event.preventDefault();\n   closeMobile();\n   if(location.hash!==hash)location.hash=hash;\n   else showRoute(hash);\n });\n window.addEventListener('hashchange',()=>showRoute(location.hash));\n showRoute(location.hash||'#top');\n}\nfunction init(){\n renderNav();renderCurriculum();arrangeViews();initCurriculum();initSteps();initShuffle();initSplit();renderCheats();initCode();initTheme();initNavigation();\n $('start-exam').addEventListener('click',startExam);\n}\ninit();\n\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"]</script>
<script>
(function(){
'use strict';
const metadata=[{"n": 1, "name": "大数据概述", "sub": "从大数据的概念与特征入手，建立全章知识框架。", "pages": "72 页课件", "concepts": "大数据特征 · 云计算 · IaaS / PaaS / SaaS", "badge": "基础认识"}, {"n": 2, "name": "大数据处理架构 Hadoop", "sub": "理解大数据平台怎么储存、计算并调度资源。", "pages": "65 页课件", "concepts": "Hadoop · YARN · HBase · Hive · Linux", "badge": "系统架构"}, {"n": 3, "name": "分布式文件系统 HDFS", "sub": "用仓库与快递的故事，理解分布式存储和读写流程。", "pages": "77 页课件", "concepts": "NameNode · DataNode · 副本 · 读写流程", "badge": "分布式存储"}, {"n": 4, "name": "MapReduce 计算框架", "sub": "从 Map、Shuffle、Reduce 到完整编程与考点练习。", "pages": "85 页课件", "concepts": "分片 · Shuffle · 任务调度 · 编程实践", "badge": "并行计算"}];
const sources=JSON.parse(document.getElementById('embedded-chapters').textContent);
const portal=document.getElementById('portal');
const reader=document.getElementById('reader');
const frame=document.getElementById('chapter-frame');
const label=document.getElementById('reader-title');
const select=document.getElementById('switch-chapter');
let active=null;
function render(){
 const hit=window.location.hash.match(/^#chapter-([1-4])$/);
 if (!hit){
   active=null; portal.hidden=false; reader.hidden=true; document.body.style.overflow='auto';
   // Stop the previous chapter only on returning to the portal.
   frame.removeAttribute('srcdoc');
   document.title='大数据课程 · 四章互动学习';
   window.scrollTo(0,0);
   return;
 }
 const idx=Number(hit[1])-1;
 if(active===idx && !reader.hidden)return;
 active=idx; portal.hidden=true; reader.hidden=false; document.body.style.overflow='hidden';
 label.innerHTML=metadata[idx].name+' <small>· 第 '+(idx+1)+' 章</small>';
 select.value=String(idx+1);
 frame.title='第'+(idx+1)+'章：'+metadata[idx].name;
 // srcdoc is the exact decoded original HTML; it runs in its own document context.
 frame.srcdoc=sources[idx];
 document.title=metadata[idx].name+' · 大数据互动学习';
}
document.getElementById('chapter-grid').addEventListener('click',function(e){
 const card=e.target.closest('[data-chapter]');
